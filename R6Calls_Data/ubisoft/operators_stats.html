, "id": "4KdXjpPgwA7gtB1cM0J6Ln", "ccid-m": "4KdXjpPgwA7gtB1cM0J6Ln", "ccid-l": "44yiCsXTMTB3S4xf49gstx", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3DXcPrPIbedPiY7oNg3bk4/e5cac2ae586e53f7b7be37f6b4ff6888/operator-video-small-blitz.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4kdZUaHnwqRC6TqdmklGrn/cd99884bba8c0c5bff5f4a4236a7d803/operator-video-small-blitz.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "April 2nd (Age 37)", "placeOfBirth": "Bremen, Germany", "biography": "### Biography\n“I don’t like photos of myself. The lighting is always wrong.”\n\nKötz is a graduate of Hermann-Böse-Gymnasium, an elite academy specializing in science and language studies. Throughout his education Kötz excelled both academically and athletically. Among his many unique qualities, Kötz is multilingual with the ability to grasp the nuance of a language quickly. His physically imposing frame and skill with his weapon make him formidable in tight space, room-to-room deployment. It’s his tactical experience that secures him as a solid Rainbow elite. These abilities combined with his specialized academic background and good-natured personality make him highly sought after. He easily transitioned from a Schnelle Kräfte soldier in Kosovo to a member of GSG 9. Kötz has been integral to fostering training practices and good will between India’s National Security Guard and GSG 9.\n\n### Psychological report\nSpecialist Elias “Blitz” Kötz has seen his share of intense combat but is physically and mentally resilient. His temperament can best be described as jovial, though his team prefers to describe his sense of humor as “goofy.” I know my son would agree. Kötz uses humor to help diffuse stressful situations. It’s appreciated by his teammates and holds more value than his previous commanders gave him credit for. \\[…\\] It’s not that he doesn’t take his job seriously. In fact, quite the opposite: On a number of occasions he was the first to rush a barricade and has often placed the team’s safety over his own. The fact that Kötz prefers to not consider his acts as heroic is a quirk of his personality, but certainly no detriment to his performance. \\[…\\]\n\nI like to think of myself as physically fit. Of course I realize these specialists are in a class of their own but even there, Kötz stands out as exceptional. He jokes about how often our med team files requests to strap him to some new machine so they can keep testing his physical limits. For anyone else the attention might be overwhelming, but Kötz takes it all in his stride. \\[…\\]\n\nFor his easy laugh and quick wit, there’s an earnest passion to Kötz. In the midst of telling me how his childhood was fun and free, he suddenly stopped. All joking aside, he said, “We have a responsibility to look after one another. I take that very seriously.” I have no doubt. \\[…\\] I’ve noticed that Blitz is a close confidante with Specialist Lera “Finka” Melnikova. When I asked him about it, he said they enjoy making fun of each other. She impresses him, he told me. It makes me wonder if he harbors some guilt because he’s in perfect health. \\[…\\]\n\nKötz’s mental dexterity can’t be overlooked, yet he often neglects to use it during operations. His amicable friendship with Specialist Gilles “Montagne” Touré may be a pathway to expanding Kötz’s application of his own abilities, and a way to hone their competitive edge.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2YTGfm1Df9PtldLcGodcTV/9a235b550cdf5066d686cef750eba090/Y0R6_BADGE_Blitz_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/MlN3NUzTAYwPkFughKR23/19b3155bf7d69c7415cafa36f52f67e7/R6-operator-blitz.png", "loadout": [{"name": "G52-Tactical Shield", "slot": "primary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7qmWjGZayvK4t6E80Gvu7g/8b789d6d639744dce100c2cfb9709e6a/G52-Tactical_Shield.png", "imageLocal": "img/loadout/G52-Tactical Shield.png"}, {"name": "P12", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2mpM7rah7rwEW0bViIirUC/ed9caa4db58421519fa4db390b1aa164/P12.png", "imageLocal": "img/loadout/P12.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c4636845a04478432c48be8c29aee/Smoke_Grenade.png", "imageLocal": "img/loadout/Smoke Grenade.png"}, {"name": "Breach Charge", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1OgTMhyF1FBsSAo4njk26m/99b7a971f81b9195b3c3536b51d52893/R6S_Breach_charge.png", "imageLocal": "img/loadout/Breach Charge.png"}, {"name": "G52-TACTICAL SHIELD", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7EXDIOjPFMhPKZWY5OcEQC/f2df48ebe5673dca7773d81efd940b66/Flash-Shield.png", "imageLocal": "img/loadout/G52-TACTICAL SHIELD.png"}], "iconLocal": "img/operators/blitz_icon.png", "imageLocal": "img/operators/blitz_render.png"}, {"slug": "brava", "name": "Brava", "realName": "Nayara Cardoso", "side": true, "isAttacker": true, "squad": ["viperstrike"], "faction": "COT", "speed": 3, "armor": 1, "health": 100, "difficulty": 3, "roles": ["intel", "anti-gadget"], "ability": {"id": "6LX0VEKWzm4h3EXtOkLv4X", "ccid-m": "6LX0VEKWzm4h3EXtOkLv4X", "ccid-l": "7ffPuK0buzOb46T0H1QgkZ", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Brava's Kludge Drone is a sabotage tool capable of taking over opponents' devices. If the device can't be controlled, it's destroyed instead.", "trackingLocationDetail": "unique ability", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "fc8d476d-697b-46b4-964b-27fe866f5005", "buttonNumber": 1, "id": "6Or05nJqxnszFRMjfE0OSh", "ccid-m": "6Or05nJqxnszFRMjfE0OSh", "ccid-l": "1Gpv9lVi9KVu7iwcHC15ZE", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2ipLdElEMZaRBqfR08RKVS/2f41f67df699ddad2aea10726d2ce21b/Brava-gameplay.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "unique ability", "trackingValue": "brava : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2NPnWceJXOniZoNibJLmo4/6cb46cd3df362c459ec6854d59791b4f/Brava-gameplay.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "January 10th (40)", "placeOfBirth": "Curitiba, Brazil", "biography": "### BIOGRAPHY\n\n*“Sometimes the only path to justice is through a bullet…”*\n\nBrava’s childhood was impacted by the untimely death of her cousin, an innocent bystander in a heist gone wrong. The criminal involvement in the event motivated Cardoso to pursue a degree in law. Her inability to effect significant change within the system as a criminal prosecutor left her disillusioned and prompted her to join the Departamento de Polícia Federal (DPF).\n\nAs an Agent de Polícia Federal, Cardoso combated interstate and federal crime, eventually becoming a Federal Police Commissioner. She commanded investigations, issued warrants, and following a special recommendation from the DPF, moved to Brasilia to apply to the Comando de Operações Táticas (COT). After completing the 18-week course of air, amphibious, and riverside operations training, Cardoso joined the COT’s high-risk interventions unit.\n\nBrava’s specialization in resolving civil aircraft hijackings brought her to the attention of Captain Yumiko “Hibana” Imagawa, but it’s her stellar performance record that earned her a place in Viperstrike.\n\n### PSYCHOLOGICAL REPORT\n\nThe formal record indicates my reasons for recruiting Specialist Nayara “Brava” Cardoso are tied to her “stellar performance record.” Allow me to be elaborate as to why Brava is a natural fit for the foremost CTU in the world, Viperstrike.\n\nDuring Operation Crushed Rock, she single-handedly turned an impossible situation into a victory. The official purpose of the mission, rescuing hostages that included her cousin Specialist Vicente “Capitão” Souza, was optimistic to say the least. It was well known that the criminal organization holding him never let anyone go alive, and that if Capitão was still breathing in the first place it was because they believed he could be broken. Despite the COT’s faultless preparation, the long odds saw their tactical execution fall apart. With no other recourse, Brava became judge, jury, and executioner on that mission, and was the only reason Souza made it out with his life. If any one of the dozens of criminals holding Capitão had survived, I’m sure their nightmares would be haunted by images of Brava storming their compound. Her performance on that day is what legends are made of, and legends belong in Viperstrike.\n\nBrava knows the cost of pulling the trigger like few others do. Yet throughout it all she remains an idealist, which make missions like Operation \\[REDACTED\\] exact a hard toll on her. There is an old saying in Kyūdō, “Shooting with technique improves the shooting, but shooting with spirit improves the person.” Brava does all the personal and professional work required to transcend her personal preferences and be decisive in the field. The squad will benefit from someone that shoots with spirit.\n\nIt will be important to keep an eye on her relationship with Capitão. He seems to want to bond with her, but she shuts him out. When I asked about it, she told me that “personal relationships are distracting,” but that hasn’t stopped Brava from developing a friendship with Jäger over their shared enthusiasm for aircraft. I will let it lie so long as it doesn’t bleed into our operation performance.\n\n-- Captain Yumiko “Hibana” Imagawa, Viperstrike Squad Leader", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1JTzualMKZVGfdROg4XKh8/7989454e62b7972bfd88f09097cc148f/r6s-operators-badge-brava.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7uyRvknQBEbg6KY37rXeK2/699fd5226e65c7b3ad5205dcf54360f4/r6s-operator-brava.png", "loadout": [{"name": "PARA-308", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6ub8y2Cs5EYhVPfDWuVVkW/82ca131a41ee4ba2e0b75f2dc52ed9e3/PARA-308.png", "imageLocal": "img/loadout/PARA-308.png"}, {"name": "CAMRS", "slot": "primary", "subtype": "Marksman Rifle", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4dBzqVVmnpv1DZi91LAnEN/e374b4ea289fc992280b943cdbb94d60/CAMRS.png", "imageLocal": "img/loadout/CAMRS.png"}, {"name": "USP40", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7FxemzWRtlpAhK9MyKp1Gp/817cc25b6b7c3575dc1ba53a6a8170a9/USP40.png", "imageLocal": "img/loadout/USP40.png"}, {"name": "Super Shorty", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Dq8LDmIxAveRqXM17orUW/8169927dba6976cee92cc53c7b0960aa/r6-operator-weapon-sa-supershorty.png", "imageLocal": "img/loadout/Super Shorty.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c4636845a04478432c48be8c29aee/Smoke_Grenade.png", "imageLocal": "img/loadout/Smoke Grenade.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "Kludge Drone", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7CeEFqxBVGt3yXGCrE8TZq/5e3eb1477ba8eb9c71f0ed6955408b28/r6s-operator-ability-brava.png", "imageLocal": "img/loadout/Kludge Drone.png"}], "iconLocal": "img/operators/brava_icon.png", "imageLocal": "img/operators/brava_render.png"}, {"slug": "buck", "name": "Buck", "realName": "Sebastien Côté", "side": true, "isAttacker": true, "squad": ["redhammer"], "faction": "JTF2", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["breach", "support"], "ability": {"id": "5YcgZIFKmUIPiaVlS9TOVP", "ccid-m": "5YcgZIFKmUIPiaVlS9TOVP", "ccid-l": "6pdbkXfXukFglRaZVqcxQp", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "\nUnder-barrel mounted 12 gauge shotgun with four round capacity, used in tandem with an assault rifle.\nThe Skeleton Key allows the operator to alternate between their standard issue assault rifle and a breaching shotgun with ease and efficiency.\n\n", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "651cab74-979a-4c03-8ab2-0a8f41e8cb57", "buttonNumber": 1, "id": "HHykyXIcZzAWT60Cd4fZw", "ccid-m": "HHykyXIcZzAWT60Cd4fZw", "ccid-l": "3Fa3FN0xiQa8RoXAFkXuq5", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1zq3lDkrHsMJAzm1xofKS0/dfa03c4570f1b41c7e3b663ce8fcfcbe/R6-operators-gadget-buck.png", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "EekYZeaUrx8", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "August 20th (Age 36)", "placeOfBirth": "Montreal, QC", "biography": "### Biography\n“Follow me. I know a shortcut.”\n\nCôté comes from a long line of military veterans and served in the Canadian Reserves throughout university. After graduating with a degree in Criminology, he enlisted full time in the Canadian Armed Forces and was assigned to the Military Police. His specialized training in high-risk situations, both long- and close-range, marine rescue, and armed ship boarding made him a strong candidate for the RCMP Emergency Response Team.\n\nEven after his acceptance into the world-renowned special operations force JTF2, Côté has continued to expand his repertoire of skills, including high-speed tactical driving on both land and water, hazardous materials management, and hostage rescue. When under stress, he exhibits self-discipline and adaptive thinking. His friendly and intuitive leadership style makes him one of the more flexible team members. Along with French and English, Côté speaks fluent Pashto and is currently enrolled in Kanien'kéha (Mohawk) studies for personal interest.\n\n### Psychological report\nSpecialist Sebastien “Buck” Côté is one of those easy-going people who can settle into any conversation and make everyone comfortable. I enjoy our sessions together. In our first encounters, he was formal but not necessarily closed off. I can see why, in social settings, he’s described as laid-back. In the field, his tendency to meld well with a wide range of people is recognized by those with a tactical eye, but is appreciated by all who work with him. \\[…\\]\n\nCôté has an adventurous spirit and, for someone who is a veteran of the forces, approaches his work with fresh enthusiasm. He was raised with tales of his voyageur ancestors who paddled the rivers across Canada, worked as fur trappers, and helped map the north for the railroad and mining industries. He told me he only recently discovered that his great-grandfather almost drowned in rapids but was rescued by his Mohawk friend. If it hadn’t been for this friend, Côté’s father wouldn’t have been born. So as thanks, Côté told me, he plans to learn the language.\n\nThis is a great illustration of Côté at his core. Though he is eager to make a difference in the world, his approach is sensible and realistic. He works toward actual results and the effort required doesn’t deter him. \\[…\\]\n\nHe grew up in close-knit family, the middle of three. I gather the entire family is very physically active and Côté says most of his activities are centred around the outdoors. That said, he was happy to share his fascination with mechanical puzzles. It’s an intricate maze of metal pieces that fit together and the challenge is to reassemble them. Côté told me that his uncle taught him how to make them and he’s been doing it ever since. The one he showed me was not only designed by him, but Côté machined the pieces as well. Being able to design and craft this type of complex structure demonstrates Côté’s analytical mind and artistry. I just wish that he hadn’t left it with me. It’s proving embarrassingly difficult for me to solve.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2oZZBEZzVLFpRY7Mp85MWq/f62287872dd61b4e0697a93d703b2beb/Y1S1_BADGE_Buck_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3YDi0a5YWFRwNzMoAjZstI/f2ebc37bde447faa664bcf160c63042d/R6-operator-buck.png", "loadout": [{"name": "C8-SFW", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1itXpz2GnvdwwRyhX1SYa2/b58ff71048fa3bb5ed09d5d935dc90f4/C8-SFW.png", "imageLocal": "img/loadout/C8-SFW.png"}, {"name": "CAMRS", "slot": "primary", "subtype": "Marksman Rifle", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4dBzqVVmnpv1DZi91LAnEN/e374b4ea289fc992280b943cdbb94d60/CAMRS.png", "imageLocal": "img/loadout/CAMRS.png"}, {"name": "Mk1 9mm", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3tWoNeF3jQYs3w4EOydQYs/434409c96693df1fd3e969d778e70795/Mk1_9mm_BI.png", "imageLocal": "img/loadout/Mk1 9mm.png"}, {"name": "Stun Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3XnK8s1iQJQu5cfr6UyQfK/429480b96d6d6d6b830c32c75d2608f5/Stun_Grenade.png", "imageLocal": "img/loadout/Stun Grenade.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "Skeleton Key", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2w8EQtN4FFtEMa9lBYyWGg/36bbc6d819761c11418c868d2e483991/Skeleton-Key.png", "imageLocal": "img/loadout/Skeleton Key.png"}], "iconLocal": "img/operators/buck_icon.png", "imageLocal": "img/operators/buck_render.png"}, {"slug": "capitao", "name": "CAPITÃO", "realName": "Vicente Souza", "side": true, "isAttacker": true, "squad": ["viperstrike"], "faction": "BOPE", "speed": 3, "armor": 1, "health": 100, "difficulty": 2, "roles": ["front-line", "map-control"], "ability": {"id": "72m3QizUXL5IRSKcWetvum", "ccid-m": "72m3QizUXL5IRSKcWetvum", "ccid-l": "7oXFOzYr7oeAD1wqVYpZMb", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Use a glass bolt to deliver a swift and silent assault against hostiles without alerting them to your position. The glass cartridge breaks on impact releasing a gas that ignites the oxygen in the surrounding area. Deliver swift and agile assaults without alerting your opponents of your position.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "4c7f9def-03bc-4198-bcae-69f138ee8862", "buttonNumber": 1, "id": "4tZb4saptW9SNrOxgSzWuY", "ccid-m": "4tZb4saptW9SNrOxgSzWuY", "ccid-l": "5EYz5e8xKTZGzrRvqZAPg1", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4NDbuVh6WIYOhPNmwQMwH/9c87f433b27d64df36ccdffffa987a72/R6-operators-gadget-capitao.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "November 17th (Age 49)", "placeOfBirth": "Rio de Janeiro, Brazil (Nova Iguaçu)", "biography": "### Biography\n“Focusing only on the bad things in life will keep you from seeing the many opportunities to do good.”\n\nThe youngest of three children, Souza was raised in Nova Iguaçu, a suburb of Rio de Janeiro. The murder of his older brother by drug dealers prompted Souza to join the Polícia Militar, where he was trained in a wide range of tactical weapons and breaching strategies. During a raid against a crime cartel, Souza was ambushed and taken hostage. Despite the loss of an eye and other brutal treatment, his inner resolve kept him alive for two months before he was rescued. Believing Souza perfectly embodied their motto, Victory over Death, and given his urban warfare experience, Batalhão de Operações Policiais Especiais (BOPE) recruited him into their ranks following his recovery. He has become a renowned expert in the organization and psychological behavior of criminal gangs, and his fight to end drug crime has put a cartel bounty on his head.\n\n### Psychological report\nFor all of the descriptions of what makes Specialist Vicente “Capitão” Souza an excellent operator – dedicated, focused, analytical – at his heart he is a family man. Every step of every decision reinforces his commitment to protecting his family and making their world safer.\n\nRaised in a close-knit community, he extends that tradition to his own three children. It’s hardly surprising he never got over the trauma of losing his older brother. He named his eldest son in honor of him, and they often share stories to keep his memory alive. Souza’s favorite moments are when his house is crowded with family, and the quiet, safe surroundings he’s created in his own home give him a chance to relax his guard, knowing that they’re all within his reach and protected. \\[…\\] He admitted that he doesn’t trust his children’s friends, yet he also worries that he can be too overbearing. It sounds like he raised them to be smart about how they live their lives, though I suspect the fear of losing them will always be more intense for him than for other parents with less tragic pasts. \\[…\\]\n\nSince there was talk of removing him from the field following his capture and mutilation, I thought it best we discuss how he feels about that ordeal, long ago though it may now be. It wasn’t something I wanted to bring up during our first meeting, so I reserved it for subsequent discussions. What’s clear is that it shaped him. Souza is dedicated to justice and protecting those who cannot protect themselves. It’s made him relentless. At any given moment he is deciphering every aspect of how these gangs function in order to find a weakness. It’s a daunting task that one member of law enforcement can’t fix alone. \\[…\\]\n\nHis incomparable resolve and years of unique experiences make him a valuable asset for any team, but it’s crucial that he maintains some distance between his role as a protector and his sense of self. We need to be understanding, but we also need to ensure that he remains grounded.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/73R4IrWJyn0xdkJ0fjOODA/fc70d200a7530dccae2847ab7962e394/Y1S3_BADGE_Capitao_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5OxEmlChYi0U3d4URLaC4C/e348f7b3b77d2d8dec65ec6afbe171f9/R6-operator-capitao.png", "loadout": [{"name": "M249", "slot": "primary", "subtype": "Light Machine Gun", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7z8UpVPS3P14OC1oL9dDIn/39c0c657f154218003fd4b2a9250b92f/M249.png", "imageLocal": "img/loadout/M249.png"}, {"name": "PARA-308", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6ub8y2Cs5EYhVPfDWuVVkW/82ca131a41ee4ba2e0b75f2dc52ed9e3/PARA-308.png", "imageLocal": "img/loadout/PARA-308.png"}, {"name": "PMR90A2", "slot": "primary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/g1CRNF5Bg8mYPXY8qxsTt/a3fd65c5715d31c8afeb9fad9c478be5/PMR90A2.png", "imageLocal": "img/loadout/PMR90A2.png"}, {"name": "Gonne-6", "slot": "secondary", "subtype": "Hand Cannon", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/23AlSVw8MwI1y3ZakEfqgW/c4561ae6e8da8db2627a146b8b55ee6c/GONNE-6_HUD_Icon__1_.png", "imageLocal": "img/loadout/Gonne-6.png"}, {"name": "PRB92", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/dl28J1HsE7mzhj66pmd5D/b8d8fc48d2dde13154047de94abbd8ca/PRB92.png", "imageLocal": "img/loadout/PRB92.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "HARD BREACH CHARGE", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3OvnVPWY1UyrDE913kU0a1/eae4b2a1584234ea2ff4ad6481239f3b/SecondaryBreacher.png", "imageLocal": "img/loadout/HARD BREACH CHARGE.png"}, {"name": "Impact EMP Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7izurbA5jDmnsmdeBdgKZO/29bca81243dda4084a92521ac0c03592/R6S-EMP-Impact-grenade.png", "imageLocal": "img/loadout/Impact EMP Grenade.png"}, {"name": "Tactical Crossbow", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5ur3NZUGos3i2HR8f0HIzj/46cf23c97453ebfedeaa42a1088ff32f/Tactical-Crossbow.png", "imageLocal": "img/loadout/Tactical Crossbow.png"}], "iconLocal": "img/operators/capitao_icon.png", "imageLocal": "img/operators/capitao_render.png"}, {"slug": "castle", "name": "Castle", "realName": "Miles Campbell", "side": false, "isAttacker": false, "squad": ["wolfguard"], "faction": "SWAT", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["anti-entry", "support"], "ability": {"id": "40zsZ7MzfrPvXiRgMDyI7i", "ccid-m": "40zsZ7MzfrPvXiRgMDyI7i", "ccid-l": "1yjxf3NX3Lc2g8VSmPahDC", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Castle is an anchor and secure Operator, capable of creating defensive strongholds around the objective, controlling the flow of the attackers and slowing down their assault.\nCastle's unique ability is to create reinforced barricades using the: UTP1-Universal Tactical Panel.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "e263d3c6-5672-46d6-ab4e-516ee8064e1e", "buttonNumber": 1, "id": "4kAMOa1JEUWy7ntTOm7JRO", "ccid-m": "4kAMOa1JEUWy7ntTOm7JRO", "ccid-l": "3ZFLJjHQMb4fggphRwvDqN", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/0BBT1Iwn1vyTV3bjcdhrb/7dc1b48a6b3eddc3f73c75dc8ac30285/operator-video-ability-castle.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "4Ng1Zg8WlMc", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "September 20th (Age 36)", "placeOfBirth": "Sherman Oaks, California", "biography": "### Biography\n“Listen up, people: No one dies today. Any questions’ll just have to wait.”\n\nMiles Campbell graduated from Cal State LA with a bachelor’s degree in Criminal Justice and promptly joined the LAPD. Recruited into LAPD SWAT, Campbell excelled in tactical support and high-risk incidents. His careful application of dynamic and deliberate entries made him a Captain early on, while his exceptional perimeter control earned him his first commendation.\n\nAlways interested in the safety of his team, Campbell worked tirelessly to perfect defense and reinforcement techniques and equipment. He has earned multiple commendations since his first and is a certified firearms specialist. Transferred to the FBI as a field agent where he trained with the German Federal Police (GSG-9), he was then recruited into the FBI SWAT team. Campbell has participated in cross-departmental training sessions with international law enforcement agencies, including the SAS and GIGN.\n\n### Psychological report\nWithin minutes of my first meeting with Specialist Campbell it was like being with an old friend. He has an easy-going manner. We joked over American football and our football – side note: look up the origins of the word “soccer.” I have 20 quid bet on it. \\[…\\]\n\nReports repeatedly mention that Campbell is referred to as “papa bear” or “the diplomat” among the Rainbow operators. He described how he smoothed over a heated discussion between two operators the other night. It’s clear that he’s the team’s social glue. This, and his openness, means that Campbell can be grouped with any member of Rainbow. I’m not surprised that he’s the one with whom Specialist Eliza “Ash” Cohen feels the most comfortable. \\[…\\]\n\nHis sense of fair play is clear in both his personal and professional life. I wondered if it was ever a struggle for him, given what he’s seen. Without hesitation he told me: His job is to protect those who can’t protect themselves. Beyond the sense of justice that motivates him, he has a desire to transform things for the better. \\[…\\]\n\nOur discussion explored his appreciation of his teammates, world cultures, and his love for the abused dogs he’s rescued. Campbell’s a curious person, someone who enjoys learning for learning’s sake: Habitually staying up late to watch any sort of documentary certainly makes him a kindred spirit for me. He draws his positive energy from his parents, who have been married 42 years and are still madly in love. Along with inheriting their work ethic, it’s their playfulness he tries to emulate. \\[…\\]\n\nCampbell is a hopeful person. He believes in the potential of people – all people – and wants to be an agent of change. He’s so concerned for others that he may overlook his own needs. I suspect this is what sparked his recent blow-up after a training exercise. His frustration with himself was evident. One of his strategies hadn’t played out the way he had hoped. Clearly, we need to make sure he gets as much encouragement as he offers to the others. \n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/kzznLctjOsXJZAg0F2HPB/dea28fa008515d6ddaa0d2659f4dc253/Y0R6_BADGE_Castle_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/569euf91mHD0ZceUnO5tVl/d2c58485cf44e51c130373fe8007f4d0/R6-operator-castle.png", "loadout": [{"name": "UMP45", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6X2EZPq2s8UKrP67uxz5FI/f0df4c57d5890c79311e4eb62d4470e7/UMP45.png", "imageLocal": "img/loadout/UMP45.png"}, {"name": "M1014", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2pUiVbwNnQnDTesmWXktqW/f27c1fab9a354bb89cbe309a688f5e02/M1014.png", "imageLocal": "img/loadout/M1014.png"}, {"name": "5.7 USG", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/tkYcSAJSe5yGkeUhzZqBO/e81feb86df4a7eb6951052bec26b6ed7/5.7_USG.png", "imageLocal": "img/loadout/5.7 USG.png"}, {"name": "Super Shorty", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Dq8LDmIxAveRqXM17orUW/8169927dba6976cee92cc53c7b0960aa/r6-operator-weapon-sa-supershorty.png", "imageLocal": "img/loadout/Super Shorty.png"}, {"name": "M45 MEUSOC", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3u5cecgWYl3WuJK50mKEGd/a4a0eb15c710edfc0d29e98c2ee7ea33/M45_MEUSOC.png", "imageLocal": "img/loadout/M45 MEUSOC.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "Armor Panel", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/29N9nMqB8ZZxGCPz128ccD/439cb1fcb2f6d5385378cf073a5fbc30/Armor-Panel.png", "imageLocal": "img/loadout/Armor Panel.png"}], "iconLocal": "img/operators/castle_icon.png", "imageLocal": "img/operators/castle_render.png"}, {"slug": "caveira", "name": "Caveira", "realName": "Taina Pereira", "side": false, "isAttacker": false, "squad": ["ghosteyes"], "faction": "BOPE", "speed": 3, "armor": 1, "health": 100, "difficulty": 3, "roles": ["intel", "crowd-control"], "ability": {"id": "3AnCgQ30Iaun2c0KiGgMH4", "ccid-m": "3AnCgQ30Iaun2c0KiGgMH4", "ccid-l": "6sYXRcokMynJHTO7pWuauo", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "\"The “Luison” is wrapped in a rock-based mineral fiber to both insulate and soundproof the silencer. This weapon allows Caveira to incapacitate her target discreetly and conduct an interrogation.\nThe “Luison” is not only formidable to neutralize your opponent while remaining undetected; it also ensures that no one gets away.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "b90822ca-c416-4c7b-99e7-3317f56c08af", "buttonNumber": 1, "id": "36RYS3LBxwNof9FxYaO1bX", "ccid-m": "36RYS3LBxwNof9FxYaO1bX", "ccid-l": "3ROFU9uBq4H93sS24zCzDt", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/54yubuFBBr4qOd2TjkT9g7/477f90d87731791702b002026c0879a3/R6-operators-gadget-caveira.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "October 15th (Age 27)", "placeOfBirth": "Rinópolis, Brazil", "biography": "### Biography\n“Not every child gets to choose who they grow up to be.”\n\nPereira is seventh of ten kids, born to a widowed mother in a small town of the state of São Paulo. After moving to Rio de Janeiro at a young age, Pereira was arrested for robbery and offered a choice between juvenile reformatory and working with the Polícia Militar as an informant. Years of undercover operations within Brazil’s notorious gangs made her a master of interrogation techniques and surveillance, and Pereira is now frequently called upon to conduct training exercises within the force. Her skills in confined environment tactics, extraction, and extreme risk situations are exemplary. It was Pereira’s actions during the Rio de Janeiro Security Crisis that caught the attention of Rainbow, though multiple reports note that she is considered a dangerous, free-roaming operator.  Outside of her professional record, little is known of Pereira’s life, except that she enjoys learning different languages and fighting in unofficial Jiu Jitsu tournaments.\n\n### Psychological report\nIt’s too obvious to describe Specialist Taina “Caveira” Pereira as fearless and intelligent when a slew of reports describe how daring she is on operations; how she isn’t one to ruminate before she reacts; that she’s about getting the job done. And while her successes haven’t gone unnoticed, she’s been denied commendations due to her rebellious nature. With all that, on our first meeting I was expecting – who was I expecting? \\[…\\]\n\nStarting her military career as an informant tells me she’s a survivor. In that context, it made more sense to ask why she continued once her mandatory sentence had ended. She told me it went from being a way out to being a way of life. She’s still defiant, up against the system. But it’s also clear, even as she teases others about their “superhero sense of justice,” that she takes her role seriously. \\[…\\]\n\nPereira is often criticized for being blunt by those who don’t understand large family dynamics – particularly with so many brothers. Though very close with her siblings, Pereira had to fight to be heard or even noticed. It’s understandable that she treasures privacy, and exudes great satisfaction with having her own way. At the same time, her family dynamics made her comfortable with noise and spontaneity, and she understands the subtleties of group dynamics far better than others her age. It’s one of the reasons she’s so skilled with interrogation. I do hate to imagine how the streets may have sharpened that skill, though. \\[…\\]\n\nPereira has made it clear we won’t be discussing her private life. By the way she played with her necklace, I think she was protecting someone close rather than slighting me. \\[…\\]\n\nSo, who was I expecting when I met Specialist Pereira? She isn’t someone who can be anticipated or predicted. That’s not an ominous warning. Quite the opposite. I have utmost faith in her abilities, in her poise and inner focus. Where others see rebellion, I see resourcefulness. Pereira is full of surprises, but it’s my opinion we can trust her to do the right thing.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4H1dOkcdZIKblKkAWjD390/10e57f4829eabda30f4aa1044e49893d/Y1S3_BADGE_Caveira_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3BfIIo48RsMmkntTXU54g5/93826b4340e2fda49d959054b15151c0/R6-operator-caveira.png", "loadout": [{"name": "M12", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4FxqA5pa8JY9QQ7FEcjwPw/ffc779fcde5b970e7b95db6653637dab/M12.png", "imageLocal": "img/loadout/M12.png"}, {"name": "SPAS-15", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/CyofBgipHq4RTafvPFWd4/bc3d0ecc871b70e57735855f852efacf/SPAS-15.png", "imageLocal": "img/loadout/SPAS-15.png"}, {"name": "Luison", "slot": "secondary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5cSDFUWb8P1BAQUgnTozeM/fd3a3348f42c95d6afa9f105ae23f2e5/Luison.png", "imageLocal": "img/loadout/Luison.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "Silent Step", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6PTsBBBGTT5oixxzvYv1Y4/18e31c74ba1ca73ed2694134acd9c078/Silent-Step.png", "imageLocal": "img/loadout/Silent Step.png"}], "iconLocal": "img/operators/caveira_icon.png", "imageLocal": "img/operators/caveira_render.png"}, {"slug": "clash", "name": "Clash", "realName": "Morowa Evans", "side": false, "isAttacker": false, "squad": ["wolfguard"], "faction": "MPS", "speed": 1, "armor": 3, "health": 125, "difficulty": 3, "roles": ["intel", "crowd-control"], "ability": {"id": "32tuEPD17oq1ENgNIfR6yS", "ccid-m": "32tuEPD17oq1ENgNIfR6yS", "ccid-l": "7jEymP72lap1xERiKWX4am", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Reworked for greater mobility, Clash's CCE Shield can anchor to the ground, letting her roam free and taser the enemy remotely to slow them down while she takes them out from a distance. While carrying the CCE Shield, Clash can use the same free look ability as other Operators, and benefit from her shield expanding and collapsing depending on the situation she finds herself in.", "trackingLocationDetail": "operators detail", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "33bb8dbe-a519-49ed-a36a-7efe379f5067", "buttonNumber": 1, "id": "IHVCd4sqPRH9DmFr0fP4L", "ccid-m": "IHVCd4sqPRH9DmFr0fP4L", "ccid-l": "4EArcOnI9fDLC7lo0XVOLR", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5f4BsVvWXfDfh8gAaKddSU/83ebfe359ac42fbbf39693f15e427edc/r6s-ops-clash-gameplay-thumb.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "operators detail", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2ZvHC2WSBtJr0vbkqmDgMe/404cda1f079851b01bd761f4377cfcdb/r6s-ops-clash-gameplay.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "June 7th (Age 35 )", "placeOfBirth": "London, England", "biography": "### BIOGRAPHY\n\n*“Change will come if you’re willing to fight for it.”*\n\nAt a young age, Morowa Evans became fixated on helping people. She spent her teenage years leading protests for social change, which would often result in violent clashes with the police and counter-protesters, landing her in juvenile detention on multiple occasions. It took the death of her mentor, Tray Pearson, who was killed by masked rioters while trying to protect a local shop, to show her she needed a different way of accomplishing her goals. This led Evans to join the Metropolitan Police Service (MPS) in hopes of making a difference from within the system.\n\nEvans thrived in her new position, eventually becoming a Detective Constable and earning herself the Queen’s Police Medal for exceptional bravery. This accomplishment granted her the opportunity to attend Gold Command meetings, during which she proposed new crowd-control strategies; her years as a riot leader gave her a unique perspective on the most efficient ways of handling these situations. Her renown got her assigned to protect a member of GSAC during a citywide riot. With her knowledge of rioter behavior, Evans kept the Council member away from any violent altercations. Impressed by her resourcefulness, they offered her a chance to undergo Rainbow’s Recruit training.\n\n### PSYCHOLOGICAL REPORT\n\nWhen first introduced to Morowa Evans as a prospective Rainbow Operator, I was against it. I confronted Harry about how we didn’t need an unpredictable cop with a record of insubordination in our ranks. He just smiled at me and said, “Passion is often misunderstood… I agree she is headstrong, but there is so much more to her. All I ask is that you give her the opportunity to show you.”\n\nThe following day, I was assigned to mentor her. It took a few missions, but I eventually understood what he was trying to teach me… when you look past the constant swearing and the reputation, you get to know someone desperately wanting the world to do better. Someone afraid to show weakness, who uses anger as a shield and refuses to let anyone pass without a fight. \n\nWe talk a lot now and Evans occasionally shares stories from her past. Looking back, she would’ve been less confrontational with the older officers that held her record against her. All those disciplinary reports made her have to work even harder to prove herself. If it hadn’t been for her unit vouching for the strength of her character and her importance to the team, those reports could have cost her her career.\n\nI once asked Evans about what her old mentor, Tray Pearson, had tried to teach her. She couldn’t find the words to tell me, but since then she’s started a foundation in his name to teach children nonviolent ways of helping their community. She’s never been great at communicating her feelings, but she always finds a way to show you what she means. I’m not too proud to admit I was wrong to ever doubt her place in Rainbow.\n\n-- Captain Gustave “Doc” Kateb, Wolfguard Squad Leader", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7G4lGl5HPLFTTUdcZW8UOK/3901b44cf2a9423486ffd78531e42f87/Y3S3_BADGE_Clash_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/snhm8UctuxdKTEcvnWi2K/0fb6214a5de9e3903209c329699fcfd9/r6s-operator-clash.png", "loadout": [{"name": "CCE SHIELD MK2", "slot": "primary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/31W7L9jDgiPp267Ejt3zYf/ebd5d0fed00a7a1df4fb8d5ebe8ea27c/CCE_Shield.avif", "imageLocal": "img/loadout/CCE SHIELD MK2.png"}, {"name": "P-10C", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2l4qwB50zSFhFZVYRLNwqg/20df8114f69f96f2adc54779ccc5bbaa/P-10C.png", "imageLocal": "img/loadout/P-10C.png"}, {"name": "SPSMG9", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5EtwSgylXckBNg4n6gDR9J/bc6fc6c5c12ae11da59aee95828ebd76/SPSMG9.png", "imageLocal": "img/loadout/SPSMG9.png"}, {"name": "Super Shorty", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Dq8LDmIxAveRqXM17orUW/8169927dba6976cee92cc53c7b0960aa/r6-operator-weapon-sa-supershorty.png", "imageLocal": "img/loadout/Super Shorty.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "CCE SHIELD MK2", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5KSWTzQrMUrG3jMEO1zX9f/e103cb858cbb3b66f29340e2baa48fb5/CCE-Shield.png", "imageLocal": "img/loadout/CCE SHIELD MK2.png"}], "iconLocal": "img/operators/clash_icon.png", "imageLocal": "img/operators/clash_render.png"}, {"slug": "deimos", "name": "Deimos", "realName": "Gerald Morris", "side": true, "isAttacker": true, "squad": null, "faction": "KERES LEGION", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["intel", "map-control"], "ability": {"id": "13Ix56UGHlszguROwuWdcs", "ccid-m": "13Ix56UGHlszguROwuWdcs", "ccid-l": "2WReac8Ubp9jGe9BgG4dvr", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The miniature flying probe seeks out a chosen target and reveals their location to Deimos while also revealing his location. with his custom .44 Vendetta being the only weapon available while tracking, Deimos makes it personal.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "e5038e60-f609-437f-b652-f2f2b0249017", "buttonNumber": 1, "id": "3fsqYPCgDqecpeQFBVmJi7", "ccid-m": "3fsqYPCgDqecpeQFBVmJi7", "ccid-l": "4Zh8cdmJkMogocvoaYXexG", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4IBwa0Z59OdwEokzXMbPuc/4c9f8b4272d63f98fbf33bc48d7cb540/R6S_DeadlyOmen_OperatorGameplay_h264.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "deimos : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3uWi5g48EZGIcBPgLbWvPJ/ffb9907a65950f02a36a7af06d5c00b5/R6S_DeadlyOmen_OperatorGameplay_h264-100-.mp4", "description": null, "videoControls": false}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "December 24th (Age 51)", "placeOfBirth": "Birmingham, Alabama", "biography": "### BIOGRAPHY\n\n*“I was there when Rainbow began. I’ll be there when it ends.”*\n\nGerald Morris was born in Birmingham, Alabama. He was close to his godfather, a military veteran, who would sneak Morris off to Western matinees and gun ranges. Discovering sheriff Bass Reeves in a history book was a watershed moment for the young Morris, giving him an idol for years to come.\n\nMorris spent significant periods with the Special Forces and the ATF. A standout, he eschewed promotions to hone his practical skills and complete an MS in Inorganic Chemistry. His role in dismantling the \\[REDACTED\\] criminal organization made him a priority recruit for Rainbow’s first iteration. \n\nAs the team’s demolitions expert and a cornerstone operator, Morris was key to its early successes. He was demoted from team lead when he became outspoken about the operational limitations that come with government oversight. He and fellow operator Daniel Bogart were thought killed in Operation \\[REDACTED\\]. \n\nThe circumstances of that event have been called into question since Morris’ capture at Emerald Plains.\n\n### PSYCHOLOGICAL REPORT\n\nMorris’ arrival has had a toxic effect on Specialist morale. Tensions are high.\nI believe that his capture offers us a unique opportunity. On a personal level, to define who we are, who Rainbow is. And, more pressingly, access to intel that will identify those who supported him. Nothing can be more important than that. The clock is ticking.\n\nI am concerned about Jordan. He has burdened himself with the responsibility for Rainbow’s failures. Speaking frankly as his friend, it is not his cross to bear. As operators in the field, there is little we could have done differently given the circumstances we faced.\n\nThis is the Deimos effect. Our trust in each other is being tested. Adding to the turmoil is an unspoken acknowledgement between Operators that the man in that cell is one of the best soldiers the Rainbow program ever produced. His skill is apparent in how he moves, how he speaks, and how he thinks. Before we became aware of his terrible actions, Morris was an aspirational figure, a legend. It is difficult to come to terms with. \nI cannot shake what he said at Emerald Plains, “Rainbow is already dead.”\nI’ve seen enough this past year to know it isn’t an empty threat. We have little to act on as he spends most of our interrogations in silence and this deadlock has led some to suggest what I consider a reckless gambit: involve Deimos in the mission against his backers. Who in their right mind would green light that initiative? And yet, suggesting this to him has produced our first instance of actionable intel.\n\nCould what we need be obtained with him in the field? An impossible choice that has split Rainbow down the middle. Now, more than ever, we need the leadership of a Six.\nWe may not have a clear path forward, but I remain hopeful. Because the strength of Rainbow, the strength that has always defined us, comes from our shared purpose: to do whatever it takes to protect those who need protecting.\n\n-- Captain Yumiko “Hibana” Imagawa, Viperstrike Squad Leader", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/18uYWtYnEjmMQBTTdkIfWF/ba8c07729ff3c6de5872ffbcdc7956fb/r6s-operators-badge-deimos.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/30I7qa77OwH9EWPvcHYBbH/45c27a7d2d3df007b0138f2c6ab2b94a/r6s-operator-deimos.png", "loadout": [{"name": "AK-74M", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1j5HiQP8aFphTe65fqDdg0/23eecb5c603c5ba9f59fc6cbc5e4a531/AK-74M.png", "imageLocal": "img/loadout/AK-74M.png"}, {"name": "M590A1", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2zRHmgqENNiZqXQxC9Rsbj/e6542407c642f9b7c5a4546afb6db30a/M590A1.png", "imageLocal": "img/loadout/M590A1.png"}, {"name": ".44 VENDETTA", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2kx8YFXaz4l9A3iJctZ33h/30f25aff1e25daf0dff88d258423adcf/44VENDETTA.png", "imageLocal": "img/loadout/.44 VENDETTA.png"}, {"name": "Frag Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4GZsPHbm9H0k5EWz7TMkwO/33b9007bc6ee03dab15cfa15eb69e096/Frag_Grenade.png", "imageLocal": "img/loadout/Frag Grenade.png"}, {"name": "HARD BREACH CHARGE", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3OvnVPWY1UyrDE913kU0a1/eae4b2a1584234ea2ff4ad6481239f3b/SecondaryBreacher.png", "imageLocal": "img/loadout/HARD BREACH CHARGE.png"}, {"name": "DEATHMARK TRACKER", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/vfUd3exyKBnSVj7Uj0rD3/c109abe7787520f3e0a3150a343cc4d6/r6s-operator-ability-deimos.png", "imageLocal": "img/loadout/DEATHMARK TRACKER.png"}], "iconLocal": "img/operators/deimos_icon.png", "imageLocal": "img/operators/deimos_render.png"}, {"slug": "denari", "name": "Denari", "realName": "Leon Winzenried", "side": false, "isAttacker": false, "squad": ["nighthaven"], "faction": null, "speed": 3, "armor": 1, "health": 100, "difficulty": 3, "roles": ["anti-entry", "crowd-control"], "ability": {"id": "32roqidURrE3LEEYpyGqZQ", "ccid-m": "32roqidURrE3LEEYpyGqZQ", "ccid-l": "1LG2r2blhJHEcTjaIOXUZC", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Cover an entire room with Denari's unique ability, the T.R.I.P. Connector. When two devices are deployed within line of sight of each other, a laser connects between them. Once tripped, the laser will slow and injure enemies. Deploying more devices will create a larger web of lasers, creating an area of denial to best fit defensive needs for any room.", "trackingLocationDetail": "operators details", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "05835bec-fcec-4e2a-a89c-024e0f111804", "buttonNumber": 1, "id": "5asP5RrIcwnbnf4lKoe7HN", "ccid-m": "5asP5RrIcwnbnf4lKoe7HN", "ccid-l": "26J0IMZEvAKUiUuDb0rU23", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3wBIodRvIM6DEGjr3fAXZ4/abed48dbd4afc822a3c6a87ce8799442/r6s-ops-denari-gameplay-thumb.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "operators details", "trackingValue": "denari : unique ability and playstyle", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5WnjlMwCCC6FhgmqFIcBeW/ff95ec4eca3b5360f07af43c69e230ef/r6s-ops-denari-gameplay.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "November 30th (Age 38)", "placeOfBirth": "Lugano, Switzerland", "biography": "### BIOGRAPHY\n\n*“Take a seat, play a round. What’s the worst that can happen?”*\n\nThe son of an upper-class family, Winzenried’s role as Jaimini Kalimohan “Kali” Shah’s hidden enforcer was not part of his expected life path. Growing up, he was primarily used as a political prop for his parents' careers. Due to his monotonous upbringing, Winzenried found solace in games of chance, where he developed a propensity for analyzing and misdirecting his enemies. As a teenager, he was detained multiple times for sneaking into pool halls and swindling tourists out of their money. He has not been in contact with his family since his conscription into the Swiss Military.\n\nWinzenried’s knack for deconstructing his enemies’ tactics made him an outlier among his military peers, earning him a spot in the ARD 10. His pristine success record in safeguarding hostages and his ability to adapt quickly under pressure earned him the approval of his commanding officers. After his contract ended, he left military life behind and traveled the world for several years, joining various mercenary groups and honing his skills. On multiple occasions he found himself working with Charlie Tho “Grim” Keng Boon, and the two developed a respect for each other’s abilities. As he wandered from unit to unit, he developed a reputation for turning seemingly impossible missions into successes. These exploits eventually landed him on Nighthaven’s radar.\n\n### PSYCHOLOGICAL REPORT\n\nI first met Leon “Denari” Winzenried when I was searching for talent to build up Nighthaven. Stories of a cunning mercenary with a compulsion for taking risks were making the rounds, and I wanted to see if he was worth investing in. From the way he spoke, I could tell Denari had an innate talent for finding people's weaknesses and using them to his advantage. Our negotiation was just another poker game to him, and he intended to win. \n\nDenari only considered my offer after I mentioned a job in Bayan-Ölgii, which had already cost me several Agents. He offered to handle it, even though it meant doing the mission alone. It only took him two months to complete. According to my contacts, he systematically tracked down key targets and used what intel he could extract to force the head of the organization out of hiding... and into my hands. \n\nLooking deeper into Denari's record, I discovered a pattern. His word is his bond. Be it a wager or a mission, if he agrees to do something, he’ll follow through no matter what. However, he expects the same in return. A gambler with principles, an oddity, but one with the skill and ability to deliver at a level Nighthaven needed to reach the top. I leveraged Denari’s compulsions to my advantage and, with an ironclad contract that cleared up his other obligations, ensured my organization would be the only one benefiting from his talents.\n\nThat brings us to now. Rainbow needs help cleaning up their mess, and I have a grudge to settle with the Keres Legion. I’ve kept Denari in the shadows for too long. This time we show the world what it means to go “all in.”\n\n-- Jaimini Kalimohan “Kali” Shah, Nighthaven CEO", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/17XNHqqrkLQ7lYFqciEwmP/21d50fb6c296d26a47f8dd84dd19298b/r6s-operators-badge-denari.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2tXE8ZM09IZLZNqb3xWzeC/4c96e9e2c07fe43811c6c5dcfd8256d4/r6s-operator-denari__3_.png", "loadout": [{"name": "Scorpion EVO 3 A1", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6OdwaLWxcnFvhlVwWbP2Du/4f7e94bdb6d34d5c0aa7b7b147b4092e/Scorpion_EVO_3_A1.png", "imageLocal": "img/loadout/Scorpion EVO 3 A1.png"}, {"name": "FMG-9", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/0oneJNsBR06QjuowxwtHG/bd3b391c6eec2bd615f2ed83197a13ac/FMG-9.png", "imageLocal": "img/loadout/FMG-9.png"}, {"name": "Glaive-12", "slot": "secondary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1vhycVQvB7uCsUpVE2jAw1/ed60286111e0049a3f312a81e828476f/glaive-12.png", "imageLocal": "img/loadout/Glaive-12.png"}, {"name": "P226 Mk 25", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/RTQvPQcywlRwUS1FjIKCX/6fc72fee2191c2e723276bc10ae4114e/P226_Mk_25.png", "imageLocal": "img/loadout/P226 Mk 25.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "Deployable Shield", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/W0WE0X2VQlxwWIAFCJ6Jm/523650a39d ttps://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6xDPUNLR00b0Gylx34vrwA/c58c6a0781dccd422fe965b3ab2830fc/operator-video-small-doc.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "September 16th (Age 39)", "placeOfBirth": "Paris, France", "biography": "### Biography\n“My job is to keep you alive. Make it as hard as you like.”\n\nOf Algerian and French descent, Kateb grew up in an affluent family in Paris’ 16th arrondissement. He comes from a well-respected lineage in both the military and medicine. In his second year of medical studies with the prestigious Université Paris Descartes, Kateb answered the appeal for volunteers in Médecins Sans Frontières (MSF). He has subsequently volunteered numerous times on emergency frontline aid missions around the world. Upon graduation, Kateb declined a prominent private medical practice in favor of a career with the French Defense Health Service. Kateb’s main discipline is toxicology and ecotoxicology. He has authored studies on biological agents and their effects on at-risk populations and damaged environments, and contributed reports to the European Centre for Disease Prevention and Control (ECDC). Recognizing the ongoing need for doctors, Kateb continues to volunteer with MSF. He is a highly regarded medical officer for the commandement des forces spéciales Terre.\n\n### Psychological report\nSpecialist Gustave “Doc” Kateb’s wealthy upbringing could easily have turned him into a narcissist, yet he’s one of the most accessible and thoughtful people I’ve encountered. Surprisingly, he didn’t have much interest in being a doctor. The impetus seems to stem from family tradition, though it’s clear his grandfather’s military service was a strong motivation. Kateb admitted that he almost quit at the end of his first year because he didn’t feel any passion for his work. I gather his father thought the mention of “passion” was absurd. \\[…\\]\n\nIn his second year, Kateb volunteered for MSF and that first mission still resonates with him. The squalor, the chronic lack of supplies, the desperate need. He remembers how the look of worry on the mothers’ faces subsided as they gathered near the tents. That was when he found his passion at last. \\[…\\] Encountering people with so little, it’s understandable that Kateb said he felt shame. What’s interesting is that he described embarrassment as well for the life he still had. \\[…\\]\n\nField reports reflect Kateb’s selfless acts, yet he has explicitly chosen a combat role. That piqued my interest. It was some time before he was willing to share his story with me. During a frontline op in East Africa, the hospital where Kateb worked was stormed by local militia. All of the patients he had fought so hard to save were killed. From this horrendous event he realized it was within his power to save lives with a scalpel or a bullet. \\[…\\]\n\nKateb’s proclivity for conflict resolution is just one of a dozen skills that make him an asset to Rainbow. It’s clear the team trusts and respects him. He’s developed a strong bond with Specialist Emmanuelle “Twitch” Pichon, due in part to Pichon’s use of technology to lessen the risk on human lives. Unfortunately, there is also unresolved animosity with Specialist Olivier “Lion” Flament over quarantine procedures that saw several of Kateb’s aid worker friends killed. For now, the situation is stable, if nonreciprocal. That may be the best we can hope for.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/71Nl3v0LqHyo9eXV6xTFQd/1ba4f057b6acad3ec700ca9e60b53d6c/Y0R6_BADGE_Doc_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7cZ1TDHehPRrgv6uJ2GIoy/d6feddd3fc1a0769a8ad56afa658e572/R6-operator-doc.png", "loadout": [{"name": "MP5", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J U2pZ2Ieem48Dwy9uqj5PNUQTn/N8FLbo4fsNyBe8msKgRhT/8f403dc0b58087bcafab786dd95ba33f/Bailiff_410.png", "imageLocal": "img/loadout/Bailiff 410.png"}], "iconLocal": "img/operators/doc_icon.png", "imageLocal": "img/operators/doc_render.png"}, {"slug": "dokkaebi", "name": "Dokkaebi", "realName": "Grace Nam", "side": true, "isAttacker": true, "squad": ["viperstrike"], "faction": "707TH SMB", "speed": 3, "armor": 1, "health": 100, "difficulty": 2, "roles": ["intel", "map-control"], "ability": {"id": "29glZzS02oaBBdAwfn3BSB", "ccid-m": "29glZzS02oaBBdAwfn3BSB", "ccid-l": "600NbN1L3WdIdPzkck29L2", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Coming from the Korean 제거,“elimination”, Jegeo Payloads replace Logic Bombs as the malware Dokkaebi can upload to enemy devices to block Observation Tools. Targeted phones with the payload explode, causing 40hp of damage to the carrier and creating a fire that can damage other nearby Operators. This unique ability has more charges and a faster cooldown, but a shorter duration—every activation matters more. It’s about precise and coordinated timing. \n", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "b8807c76-7cb9-4729-84af-5ddd269997d4", "buttonNumber": 1, "id": "1JfysrvzPalqWHsp2wawyw", "ccid-m": "1JfysrvzPalqWHsp2wawyw", "ccid-l": "2iPR4RIz3cHz0sUvYAX4ou", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4RSEzrQS0D2it8iM5gEh4C/350ed889f215b8f75031ad574e619903/Y11s2_Broll_Dokkaebi.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3M4hl7azUfgAzfRFrkKkst/b4435b76f64ce6c8c970df7533a9a334/Y11s2_Broll_Dokkaebi.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "February 2nd (Age 29)", "placeOfBirth": "Seoul, South Korea", "biography": "### BIOGRAPHY\n\n*“Potato, botnet, who cares… As long as I come out on top.”*\n\nNam has been an overachiever since childhood. The academic pressure she faced from her parents instilled in her a compulsion to control her environment and outperform her peers, which often caused schoolyard fights, but it also set her up for success.\n\nWith an early graduation from high school and a National Academic Excellence Scholarship at KAIST, Nam was already an asset when she entered the ROK; her natural affinity for formal sciences and expertise in hacking soon earned her a confidential assignment with the NIS at 22 (under the guise of the 5163 Army Division).\n\nFollowing her return to the army, she joined two separate Special Forces units by the age of 27. The rigorous training she received in the Ghost corps (mountaineering, survival techniques, guerrilla warfare) paved her path into the 707th SMB, where she trained and worked with other CTUs like the JTF-2 and GIGN.\n\nThe early days of Nam’s previous stint with Rainbow were marked by friction as she resisted scrutiny, but she ultimately settled in and became instrumental in the final crusade against \\[REDACTED]. Final notes by Captain \\[REDACTED] comment on a matured Specialist who learned the difference between friend and foe, and “which way to point the gun.”\n\n### PSYCHOLOGICAL REPORT\n\nWhen considering former Rainbow operatives for recruitment, Specialist Grace “Dokkaebi” Nam wasn’t top of mind. Her good standing with GSAC as a key member of the ArchNet cybersecurity taskforce is one thing, but trust is in short supply right now, and last time she got in by hacking the system. Still, there was a factor I couldn’t ignore: one of the new leaders of the Keres Legion, Nyx, is a tech savant of her own, and I needed fire to fight with.\n\nDuring the initial interview, I got a colorful display of the “mask” highlighted in the reports and transcripts I had read. Nam plays the geek and the joker, wanting to be underestimated; sure, she threw some computer terms my way to show she knew what she was talking about, but I didn’t have time for games. I needed the real Dokkaebi. Once she realized I was serious about her, she leveled with me, and I got to meet the woman described in Hibana’s final report. Assertive, quick, sharp. I would’ve taken her on right then, but there was still the question of her readiness.\n\nI put together a program to assess and retrain exceptional candidates who have been off the field in Rainbow’s absence or have experienced trauma like Nam did when she was held and interrogated by Phobos. She hadn’t shot a gun since she put him down so it took her a moment to shake off the nerves, but like riding a bike, it all came back to her soon enough. In her practiced movements, I saw her mentors – Vigil, Ram, Thatcher. That she let them teach her was a sign that she was ready for more.\n\nStill, I expect there will be some growing pains as other Specialists sign on, ones she’s not as trusting with. The “trickster” will make an appearance from time to time, but I’ll bring her back to reality if need be.\n\n-- Paul Bishop, Rainbow Six", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/aoQeHLohcuqvubBoyrzsM/d4a230ecba495c58c5521e10d5d84baa/Y2S4_BADGE_Dokkaebi_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2s5BCj0po76sK50EyDeNH5/631c421568fdd20a64f8694d62adc7c5/r6s-operator-dokkaebi.png", "loadout": [{"name": "BOSG.12.2", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubis
