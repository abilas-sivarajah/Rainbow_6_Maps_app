 "health": 125, "difficulty": 1, "roles": ["support"], "ability": {"id": "2x8MvI3IAnIQKrE8Vajd2o", "ccid-m": "2x8MvI3IAnIQKrE8Vajd2o", "ccid-l": "4VNg9MBm0Gvc2zIZzwjmMy", "title": " UNIQUE ABILITIES AND PLAYSTYLE", "content": "Rook is an anchor and buff Operator, capable of providing a boost to the Defenders, giving them a valuable advantage in a firefight.\n\nRook is capable of protecting himself and his team mates through his unique ability: R1N \"\"RHINO\"\" Armor.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "899c62d7-1c7d-4c5a-92db-24f17f688036", "buttonNumber": 1, "id": "6LEgUrAbcAcKus4nJ8j9Rs", "ccid-m": "6LEgUrAbcAcKus4nJ8j9Rs", "ccid-l": "5Xp9q8yAknYMUY6AmveO1p", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6YPJok4eqE7BtviRbb02Mt/dcb4f467de54f2b01b93e2fa9d363916/roo.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "-q2ZfpRCwh4", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "January 6th (Age 27)", "placeOfBirth": "Tours, France", "biography": "### Biography\n“If you're going to get shot, you may as well do it right.”\n\nNizan’s father is a respected stone mason while his mother held numerous jobs. They both informed his sense of architectural design and precision, helping him earn top rankings in school. Along with Nizan’s intellectual interests, he excelled in athletics from an early age, including Track & Field, fencing, and cycling. He later dropped out of university to cycle across France before returning and joining the Gendarmerie. Nizan thrived in his training, which included specialized qualifications in weapons, surveillance, and criminal investigations. His adaptability put him at the top of the list in military and defense courses, quickly catching the attention of the GIGN. His first operations with that unit combined all of the elements to satisfy his endless pursuit of challenges and adventure, according to staff psychologists. Specializing in hostage rescue and surveillance, Nizan’s list of successful interventions is extensive.\n\n### Psychological report\nIn reviewing Specialist Julien “Rook” Nizan’s file, what stands out is his ability to adapt to demands. Very quickly into our conversation it was clear that Nizan’s interests are wide-reaching. From his descriptions, it sounds like his parents imparted their eclectic tastes. Julien and his sister, Élodie, were especially encouraged to be curious about everything. I would argue that it’s this openness to the world around him that led to the creation of his protective – yet still highly flexible – armor plating. \\[…\\] \n\nNizan’s father is a stone mason, which requires imagination, precision, and dedication. His mother’s ability to explore different vocations with verve – bookkeeping, street busker, florist, tour guide, sommelier, and chef – all strongly influenced how Nizan adapts to challenges and what goals he sets out for himself. \\[…\\] The field reports reflect some of Nizan’s chameleon-like way of merging into whatever role is required. This kind of versatility is rare – I’ve asked leads such as Specialists Gustav “Doc” Kateb and Miles “Castle” Campbell to challenge Nizan more during operations. \\[…\\]\n\nI’m curious about how Nizan went from studying architecture to joining law enforcement. He grew up passionate about cycling, auto racing, and rock concerts, and he spent an inordinate amount of time trying to devise a scheme by which these could become careers. Ultimately, his interests evolved. Dropping out of university to cycle around France gave him his first sense of freedom. And then his world expanded further when he returned. At that time, the Gendarmerie enlisted his civilian father for an anti-corruption sting with local businesses. Nizan told me he was fascinated by the level of planning required by the police. \\[…\\] \n\nRight from the beginning, Nizan remembers appreciating the broad spectrum of skills and range of expertise required to be in law enforcement and the military. Every day is different. \\[…\\] Nizan is one of the more constant optimists on the team. His ability to energize other specialists is important, and he’s certainly well liked. I’d like to see Nizan’s sense of adventure put to better use, however. Complacency benefits no one.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3Yk1noMd9re0RLlrXJSWtR/7a55e80593c487827293a114835dba63/Y0R6_BADGE_Rook_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/17CNRjTOFVKS1Q8Zou4ZVD/663dae86e2902f210bf2b1504904dbd0/R6-operator-rook.png", "loadout": [{"name": "MP5", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/60YbOvSBQt6ZUlu8YDXoZm/51ef3857b2986de700262432e8433714/MP5.png", "imageLocal": "img/loadout/MP5.png"}, {"name": "P90", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4nGrNspOvII2oS3lEMkg5x/2398a493c298bc654f97c58767aa40f3/P90.png", "imageLocal": "img/loadout/P90.png"}, {"name": "Reaper MK2", "slot": "secondary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5RC060K72yG2OXMq43lgrv/83df616f6d4a2dde6293cc97449159eb/reaper-mk2.png", "imageLocal": "img/loadout/Reaper MK2.png"}, {"name": "SG-CQB", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5JoL3b36Fsztt9Q2XYmrbJ/dacec96948d3f8fe92914a69b9aac593/SG-CQB.png", "imageLocal": "img/loadout/SG-CQB.png"}, {"name": "P9", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6Fd1cl17KA0CtgodEiiY6v/d0f145ea72f2aacbd04260ba7d8f1c74/P9.png", "imageLocal": "img/loadout/P9.png"}, {"name": "LFP586", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1zc7UtdBfCZakwbiYqBvSz/1fd3f1584de38ca7c9315d498f094276/LFP586.png", "imageLocal": "img/loadout/LFP586.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "Armor Pack", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/MeoKw7iPY6EFYvjS07CRg/b2d7eba623f3c63d6b7097a8f2253954/Armor-Pack.png", "imageLocal": "img/loadout/Armor Pack.png"}], "iconLocal": "img/operators/rook_icon.png", "imageLocal": "img/operators/rook_render.png"}, {"slug": "sens", "name": "Sens", "realName": "Néon Ngoma Mutombo", "side": true, "isAttacker": true, "squad": ["wolfguard"], "faction": "Belgian Special Forces Group", "speed": 3, "armor": 1, "health": 100, "difficulty": 2, "roles": ["support", "map-control"], "ability": {"id": "5idQqcBcA0X9hwMGSJQhQq", "ccid-m": "5idQqcBcA0X9hwMGSJQhQq", "ccid-l": "1RzbWbyHPhbWNq0lq2yKsN", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "R.O.U. Projector System rolls after it's thrown by Sens and drops small projectors to create a screen along its path. Although physical objects can still pass through the screen, it's highly flexible—cutting off multiple lines of sight at once.", "trackingLocationDetail": "unique ability", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "a896b53a-a4d9-424a-a16d-b84b628c867c", "buttonNumber": 1, "id": "49FlCZDqOwrPrWm7ALRIB3", "ccid-m": "49FlCZDqOwrPrWm7ALRIB3", "ccid-l": "3iSeEFOKKLF5VLLgn9S62P", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7bptvvvDwiqaEnROQx2Ysi/e7915878db864c627b6ea033bc96ebb3/r6s-y7s2-gadget-sens.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "action", "trackingLocation": "promotion", "trackingLocationDetail": "unique ability", "trackingValue": "sens : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3CoJVFW7BwPxkkFcB5P3Fe/5f6b34ba03367d6e68fdb4691c6d103b/r6s-y7s2-gadget-sens.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "March 3rd (Age 30)", "placeOfBirth": "Brussels, Belgium", "biography": "### Biography\n\n*“Brute force only gets you so far. Victory is determined in the mind of a strategist.”*\n\nGrowing up in a tight-knit family unit, Ngoma was able to pursue their interests without much resistance. They learned everything they could about psychology and physics, all the while receiving classical music training with their two younger siblings. Ngoma also learned the basics of mechanics in their father’s garage, effectively rounding out the skillset that they would later apply in their career.\n\nThey excelled in tactical training and military sciences, going on to become a combat engineer. Bright and imaginative, Ngoma proved invaluable in every task they tackled. They would support their comrades with strategies and technologies to divert enemies’ attention and break down hostile defenses. Their specialization in such tactics, which had the reputation of minimizing casualties on all sides without compromising objectives, earned Ngoma several service medals. They eventually caught the attention of the Belgian Special Forces Group, under which they have served ever since.\n\n### Psychological report\n\nAssessing Specialist Néon “Sens” Ngoma was difficult at times. They have a habit of diverting the conversation to theories of psychology, rather than how it applies to them. Still, I was able to get the information I was looking for in the moments in-between. When speaking of their understanding of human behavior, they often bring up childhood memories of people-watching and solving puzzles. Much like a puzzle cube needs to be aligned in a precise sequence, Ngoma predicts how people will react with the right push. \\[…\\]\n\nWhen asked about their upbringing, they only have good things to say about their family. Their parents, one Belgian and the other Congolese, were happy to support all three siblings in their (quite different) career choices. Ngoma recalls that when they and their youngest sibling came out, their father insisted that the only thing he expected of his children was honesty.\n\nWhatever difficulties they might have encountered between then and now have done nothing to quell their spirit. Being warm and open is, as Ngoma says, not just a great way to make friends, but also their way of spiting those who try to get in their way. It seems to be working out well for them so far. \\[…\\]\n\nAs I often try to do these days, I inquired about Ngoma’s hobbies, and I was surprised to learn that music has a big place in their life. They praised it as the universal language of love. They connect to the world by listening to artists from all over, to their father’s heritage with songs from his home, and to their youngest sibling by playing her EDM sets at every opportunity. \\[…\\]\n\nNgoma is a complex person, and I understand that certain things must be experienced in order to be understood. Still, I’m confident that they will feel at home with Wolfguard. There’s something about their kindness that I can only describe as defiant. That’s the sort of attitude that is sure to mesh well with Doc.\n\n-- Dr. Harishva \"Harry\" Pandey, Behavioral Analyst", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7pqZFaPgQwaLi1pFKuAv7e/d3d9af214737fe6a069e5346c50bfd20/r6s-operators-badge-sens.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5jnAuLrtadxfg1XOieDnL0/4694dde0c71e3e9998a1e5fd6cb1a7d2/r6s-operator-sens.png", "loadout": [{"name": "417", "slot": "primary", "subtype": "Marksman Rifle", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5djkS4YtAtOF0vBmg0T60x/ea2b1ff7e5367e66c99bc7ad7e95bfe3/417.png", "imageLocal": "img/loadout/417.png"}, {"name": "POF9", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1bhuAox7U6aHN6UriXsAry/3c213cd27f5f64ba01a29b42e5b24ac5/POF9.png", "imageLocal": "img/loadout/POF9.png"}, {"name": "SDP 9mm", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/Tgsdyz3XEqmgUYi9aZZgb/6755f4da age": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "788710d3-e9b1-4048-91f6-5d661d93bffd", "buttonNumber": 1, "id": "3IHe67xHPvXFl1aimLsOoF", "ccid-m": "3IHe67xHPvXFl1aimLsOoF", "ccid-l": "3znivQM3lqeeiHUaFGlkCV", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/24eJxFqij3LRlhsOzgodfu/bb1a893c4f8246e640edbfd504430668/R6S_NewBlood_OperatorGameplay_YT_sentry.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "sentry : ability", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3qdrnNw6nknMPKkTdtLaVc/c00707b2bc311ec3c025381aa16a56d0/R6S_NewBlood_OperatorGameplay_YT_sentry.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "Undefined", "placeOfBirth": "Undefined", "biography": "### BIOGRAPHY\n\n*“We eat, sleep and dream Rainbow during training. And one day, it’ll pay off.”*\n\nThe current crop of Defense Recruits, also known as Sentries, in Rainbow are undergoing a revamped training regimen and finding their place in an organization that needs their drive, adaptability and resilience. Besides adding bodies to larger-scale defensive missions, Recruits are the foundation of Rainbow. Their ranks may seem faceless and nameless at times, but that won’t last forever, as the organization will often promote from within, drawing a Recruit up into being a Specialist.\n\nWhile they are made up of a varied group with many personalities, backgrounds, heights, weights, languages and skillsets, there are some commonalities between the Defense Recruits. To succeed in the program, one must exhibit patience, attention-to-detail and a deft ability to communicate clearly and succinctly both prior to and during a mission.\n\n### PSYCHOLOGICAL REPORT\n\nSince the training of the Defense Recruits fell under my purview I created a new series of training modules, specifically designed for the threats Rainbow currently faces in the field. It is imperative that a Recruit masters these training modules before heading into a hot mission. After Emerald Plains and our long journey to capturing Deimos, we ideally need our Recruits to be on an equal footing with the Keres Elite, who are quite clearly receiving expert and well-funded field training. I can only hope that with Deimos under our roof, that edge will dull.\n\nWhile our experienced Specialists will have their unique gadgets and abilities to help ensure their success, a Recruit given the opportunity to join a mission must showcase a mastery of a variety of weapons. They are not the scalpel; they are the Swiss Army Knife, which is why they bring additional utility into the field to support Specialists.\n\nNo matter what some of our more opinionated Operators may say, these Defense Recruits are not all the same; they come from a variety of military and police backgrounds and have distinct goals they are pursuing within the organization. What Defense Recruits all share, however, is a keen focus on hostage protection, and a will to do whatever it takes to complete the mission objective. Do not mistake them for shrinking violets though. With my training, they are learning to be just as aggressive as the Attack Recruits when the situation warrants it.\n\n-- Elena Maria “Mira” Alvarez, Defense Recruit Training Lead", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3RhB8rT969t71r0b3iiiQo/3bf85d17ade85b4e5943712b664b6166/r6s-operators-badge-sentry.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4D6K0a93Nwh0vXbuudP1tE/02310bdbd60ede48be879721d7ba248 WIAFCJ6Jm/523650a39de5a23dd9520d7299c9e25a/Deployable_Shield.png", "imageLocal": "img/loadout/Deployable Shield.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Nitro Cell", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4pBSTw9U6l9GRnT12G6Xln/e0991bc03b48d217f510af8b611c8828/Nitro_Cell.png", "imageLocal": "img/loadout/Nitro Cell.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}], "iconLocal": "img/operators/sentry_icon.png", "imageLocal": "img/operators/sentry_render.png"}, {"slug": "skopos", "name": "Skopós", "realName": "Kure Galanos", "side": false, "isAttacker": false, "squad": ["wolfguard"], "faction": null, "speed": 3, "armor": 1, "health": 100, "difficulty": 2, "roles": ["intel", "support"], "ability": {"id": "w6buBXoRb5knWCfqFpuqe", "ccid-m": "w6buBXoRb5knWCfqFpuqe", "ccid-l": "6HqAWWewLRHsRcuSil95Yv", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "With a pair of V10 Pantheon Shells, Skopós enters the battlefield in control of one as an Operator and the other as an Observation Tool protected by a reinforced shield. While she can only operate one at a time and will lose connection to both shells if one is destroyed, she can switch between them at will, making Skopós an effective intel and support Operator.", "trackingLocationDetail": "unique ability", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "166b03e5-0073-4804-8261-ef08b0f1db20", "buttonNumber": 1, "id": "260oxUD3G4ZMtkskC5kyAe", "ccid-m": "260oxUD3G4ZMtkskC5kyAe", "ccid-l": "3Sov0sUfMTJ6zH4oBc8M1Z", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2axYKQ374Ld23UIZw6yF6i/b9874b269ef2af3dedbbd03f26cb0940/r6s-y9s3-gadget-skopos.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "unique ability", "trackingValue": "skopos : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2ElqEbqVNV8hhF8G50t6vB/4a59561d80b93f2bb531b916005c3978/r6s-y9s3-gadget-skopos.mp4", "description": null, "videoControls": false}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "July 25th (Age 42)", "placeOfBirth": "Nicosia, Cyprus", "biography": "### BIOGRAPHY\n\n*“Here’s my quote: Don’t waste my fucking time.”*\n\nKure Galanos was born in Nicosia, Cyprus. At a young age, she was forced to flee her home with her family due to civil unrest. She later joined the civilian police and made a name for herself as a marksman, which led to her recruitment into the Hellenic Force. After showing an exemplary capacity to factor in complex operational variables in the 2000 Mediterranean hostage crisis, she was approached by Rainbow.\n\nGalanos served with Rainbow for eleven years under Daniel Bogart, participating in the Rogue Spear and Raven Shield campaigns. After \\[REDACTED], Galanos shifted her career, studying mechanical engineering at NTUA and undergoing BDR training to operate ordnance defusal drones. Galanos first deployed her “Shells” in Operation Daedalus. The successful mission confirmed their unparalleled potential and caught the attention of Aurelia Arnot and the Global Security Alliance Council (GSAC) for Galanos’ reintegration into Rainbow.\n\n### PSYCHOLOGICAL REPORT\n\nThe reception to Specialist Kure “Skopós” Galanos’ return has been mixed. Some are in awe at the very mention of her name; others are wary of her former proximity to Deimos and Nighthaven. There are also whispers about the wheelchair.\n\nI will admit, I too was a skeptic. Despite her endorsement by the Council, it was my task as Captain to confirm her field readiness. Setting aside her legendary status among the ranks of Rainbow, and the nature of her separation from the immediate dangers of the battlefield through her Shells, any number of physiological and psychological issues could have impacted her performance. […]\n\nI found a quote about Galanos in Rainbow’s archives: “[...] her piercing gaze does more damage than her bullets”. Nothing has changed. Although she understood the reasoning behind my questions, it felt like she had taken ownership of the interview by its conclusion. She produced journals, cataloguing all nine operations she underwent and the rehabilitation periods that followed each. From the moment she received confirmation that her C5 vertebra could tolerate high-intensity training, she dedicated herself to returning to active duty, though it didn’t sway the critics.\n\nGalanos told me that she’s gotten used to the scrutiny, and that GSAC and Aurelia Arnot were especially demanding in their assessment. Their initial recommendation had been that she stick to lab work and engineering, but after a brief closed-door session she was given a full endorsement to return to active duty. I have followed suit. Operator Galanos is here to stay, and I am convinced that she is among our best. \\[…]\n\nAs her Captain, I have access to privileged information regarding the nursery bombing in Bratislava and the incident three years later in \\[REDACTED]. Descriptions of the events alone were distressing, and participating in just one would have challenged my resolve. How Galanos navigated these traumas shows fierce determination that I can’t help but be in awe of, but I do worry about her inevitable reunion with Deimos. She had believed Morris to be dead, and they were well known to have been close friends. Now that she knows the truth, what will she do when she sees him again? \\[…]\n\n-- Captain Gustave “Doc” Kateb, Wolfguard Squad Leader", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/k0AOat3ISkt7WMR6X4dJg/aa4596095d3861f7de24e007730e3f89/r6s-operators-badge-skopos.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/24aepg0uhygjIpm0de121o/721cf782e6c9f7434fb970ab8da9f859/r6s-operator-skopos__1_.png", "loadout": [{"name": "PCX-33", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/jKFNRujDQyioHLu0PULiR/a3dce57946beba1378566c386cfa0270/pcx-33.png", "imageLocal": "img/loadout/PCX-33.png"}, {"name": "P229", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/76ja0RxqzHW9PpvWgpG7Sk/cb753b50b20fe67deaef54d8b2a46b54/P229.png", "imageLocal": "img/loadout/P229.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "V10 Pantheon Shells", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/56v8dxuabTfIHtPSmQX7AJ/9079454089effc91c685d7e759728797/r6s-operator-ability-skopos.png", "imageLocal": "img/loadout/V10 Pantheon Shells.png"}], "iconLocal": "img/operators/skopos_icon.png", "imageLocal": "img/operators/skopos_render.png"}, {"slug": "sledge", "name": "Sledge", "realName": "Seamus Cowden", "side": true, "isAttacker": true, "squad": ["redhammer"], "faction": "SAS", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["breach", "anti-gadget", "starter-operators"], "ability": {"id": "25y6nP3osumcJTYI6XyuEp", "ccid-m": "25y6nP3osumcJTYI6XyuEp", "ccid-l": "4Or9W9SsTQRO2W5fcOFvfq", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Sledge is a soft breacher and flanker, he excels at creating new lines of fire and entry points, harassing the defenders.\nSledge is capable of breaching non-reinforced surfaces thanks to his tactical breaching hammer: The Caber.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "bc02509c-ccd3-4ac2-9c90-62d99b681e2a", "buttonNumber": 1, "id": "4nV8KzKGUrep1KRswBAXS5", "ccid-m": "4nV8KzKGUrep1KRswBAXS5", "ccid-l": "12FlgQeQapSl9GIrJmx5Yw", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/38vVi2vYXuYuuPVcYdkeTS/0ef0e4d2a706e0b0330b81944c925452/operator-video-ability-sledge.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "ybhzh5F7rzU", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "April 2nd (Age 35)", "placeOfBirth": "John O’Groats, Scotland", "biography": "### Biography\n“Coming through!”\n\nBorn in the far north of Scotland, Cowden’s military father and nurse mother moved to Inverness with him and his three siblings when he was five. His athleticism elevated him to the position of Captain of the 1998 Scotland Under-20s Rugby Union Team. Following a long family tradition of military service, Cowden joined the 3rd UK Mechanised Division of the British Army. His drive and physique suit the division’s historical nickname of “Iron Sides.” Cowden’s first assignment was in the Armoured Division where he studied engineering and specialized in upgrading the infantry combat vehicles. From there, he developed various breaching tactics. He was then recruited into the SAS, where he holds multiple records in speed and strength. An expert in mechanical, ballistic, explosive and thermal breaching strategies, Cowden is the operator to choose for quick and relatively silent destruction.\n\n### Psychological report\nIt’s part of my job to understand where the country shapes the person and Specialist Seamus “Sledge” Cowden seems indelibly shaped by the rugged terrain where he was born. It isn’t just his imposing presence and athleticism. I can’t help but feel that his personality evokes the wilderness as well. He’s stoic and proud, though admits that he can be hot-headed at times. Field reports describe his courage, leadership, and extensive operational experience as much as they mention his unpredictability. He’s much more than a “gentle giant” as some suggest. \\[…\\]\n\nCowden is something of a raconteur, and for much of our discussion he told me one rowdy tale after another. When he was twelve he cobbled a hang glider together out of boat sails and launched himself off his house. He broke both ankles. During military training, he accidentally collapsed his entire sleeping barrack while testing a new breaching technique, and another time he sank a captain’s motorcycle by riding it off the pier because he wanted to see how far it would travel on the surface – not far, I gather. His stories aren’t just to entertain. They help to establish a comfortable connection. It’s such a casual, offhand leadership style. \\[…\\]\n\nCowden views his fellow operators as family, Specialist Mike “Thatcher” Baker in particular, who he credits for convincing him to switch to the Caber. Numerous Rainbow operators refer to Sledge as one of the easiest operators to work with. \\[…\\]\n\nOverall, Cowden is easy-going and unpretentious, though he gets ruffled at the mention of politics. A self-proclaimed news junkie, he doesn’t shy away from debates. In fact, it’s the reason he joined the military, and why one of his brothers is currently an elected MP. Cowden understands that while on assignment Rainbow operators don’t voice their political opinions and so far there hasn’t been any issue. We should trust that he can control his hot-headedness. At least before he’s down at the pub.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4lgK1mOTVAoBhoj5qjYuyd/83c83d56e977f96ac0e9621c0d1c07d2/Y0R6_BADGE_Sledge_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2p5MyJkqbsfL8kCRNJVhcz/90aa196a11f2ea49ea107aab69789053/R6-operator-sledge.png", "loadout": [{"name": "L85A2", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5vYQpoyk36foDzDq49jBd0/1479a2d7189e545555ceccecf6bd7cc3/L85A2.png", "imageLocal": "img/loadout/L85A2.png"}, {"name": "M590A1", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PN anti-entry", "trapper", "starter-operators"], "ability": {"id": "4lsDCwxQvDc5BAJgXQNb23", "ccid-m": "4lsDCwxQvDc5BAJgXQNb23", "ccid-l": "5PbxmFHpOXjfiLw23e4PbD", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "- Detonator\n- Remote receiver\n- Double-sided tape allows vertical or horizontal mounting", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "0afcc8ed-7905-4e81-be0a-d78b42c50e31", "buttonNumber": 1, "id": "4HhVxFBUuDtElXrAWKg89O", "ccid-m": "4HhVxFBUuDtElXrAWKg89O", "ccid-l": "38xXkLN5WDZbz7XiqdsMn3", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TyzyuAsIYm6bWj6QPYPzn/9468d5d2b649b1b16735a62ac973cc28/operator-video-small-smoke.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "3B1wIBrjmPM", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5dWBrmTjwwipSugmn8zvj1/074ac9ad21c160b5a0b110a95f5fdcc6/operator-video-small-smoke.mp4", "description": null, "videoControls": false}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "May 14th (Age 36)", "placeOfBirth": "London, England (King's Cross)", "biography": "### Biography\n“Sure, I care about the environment. Immediately around me, anyway.”\n\nThough Porter wasn’t an exceptional student, aptitude tests revealed his propensity for sciences. Encouraged by faculty and his parents, he was able to follow a more unorthodox manner of education with tutors, home-schooling, and field science. He flourished in this break from formal classroom studies and quickly developed his skills in chemistry, biology, and math. Uninterested in pursuing a formal university education, Porter forged a fake ID and enlisted in the British Army. Though the rigidity of army rules wasn’t always a good fit, it was offset by the diverse range of training and experiences army life gave him. While he has been reprimanded for breaking rules, his superiors quickly recognized both his innovation and strategic perspective. He was then encouraged to join the SAS. Porter prefers to acquire knowledge and skills, such as language and music, in his own way and does not excel in a formal training capacity.\n\n### Psychological report\nIt’s important for me to not have any preconceived expectations before a face-to-face with any specialist. Since assessments of Specialist James “Smoke” Porter contain some contradictions, I couldn’t have settled into any viewpoint anyway. So essentially he entered my office as somewhat of a mystery. \\[…\\]\n\nPorter is consistently described as detached.  I reviewed his files and found that his “aloofness” occurs during high-intensity situations. It’s likely not detachment, but focus. I’m reminded of my uncle who used to tap his forehead and tell me to master my mind. Porter, I think, is mastering his mind to stay on task and filter out dangerous distractions. He strives to keep emotions away from decision-making, opting for outlets such as live music events to deplete the tension, thus enabling him to be the person he needs to be on the job. \\[…\\]\n\nIt’s clear that Porter’s parents encouraged him to be a free spirit and develop his education and personality on his own terms. While it resulted in some unfortunate mishaps – one science experiment left some physical scars but no emotional ones that I can see – there was great benefit in it. \\[…\\] Porter’s free range education helped create a complex, dynamic person who isn’t easily categorized. \n\nPorter is popular among his teammates and considered valuable despite some recklessness. Descriptions such as thrill-seeker and fearless seem simplistic to me, however. There’s more nuance to Porter than that. He’s measured and understands calculated risks. Porter – and our other operators – understand that it’s more important to respect fear than to try to pretend we never feel it. \\[…\\]\n\nSelf-taught from an early age, Porter continues to spend time cultivating his own identity. He enjoys acquiring experiences and once he’s mastered them, moves on. The exception is his adopted daughter. He would only share one photo of her. I’ve never seen an infant surrounded by so much dangerous paraphernalia, but Porter assures me she is now in high school, excelling within the system he himself was unable to comprehend. Through her, he sees the world in new ways – exactly the kind of challenge he adores.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6mOMxoc3t27R9Gr9wFtt6T/f5f90a6be6a6710bee686ce69df29906/Y0R6_BADGE_Smoke_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5NUuXBKokP1KmAGR8Q7fqE/9628143388fc1c2f50162c1ccdf94942/R6-operator-smoke.png", "loadout": [{"name": "M590A1", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2zRHmgqENNiZqXQxC9Rsbj/e6542407c642f9b7c5a4546afb6db30a/M590A1.png", "imageLocal": "img/loadout/M590A1.png"}, {"name": "FMG-9", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/0oneJNsBR06QjuowxwtHG/bd3b391c6eec2bd615f2ed83197a13ac/FMG-9.png", "imageLocal": "img/loadout/FMG-9.png"}, {"name": "P226 Mk 25", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/RTQvPQcywlRwUS1FjIKCX/6fc72fee2191c2e723276bc10ae4114e/P226_Mk_25.png", "imageLocal": "img/loadout/P226 Mk 25.png"}, {"name": "SMG-11", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3WExw7Kepz9uAiWAbWW457/875fc631a3cf9fcc2849d9db2989cbcd/SMG-11.png", "imageLocal": "img/loadout/SMG-11.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "Remote Gas Grenade", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3ZbADU6FxBqdvcA8vCpYhn/6c69d61202364fa420e2a319d817c6f3/Remote-Gas-Grenade.png", "imageLocal": "img/loadout/Remote Gas Grenade.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}], "iconLocal": "img/operators/smoke_icon.png", "imageLocal": "img/operators/smoke_render.png"}, {"slug": "solid-snake", "name": "Solid Snake", "realName": "[REDACTED]", "side": true, "isAttacker": true, "squad": null, "faction": null, "speed": 3, "armor": 1, "health": 100, "difficulty": 2, "roles": ["intel", "front-line"], "ability": {"id": "4DVBGoJsRIpTaQQiiq2inA", "ccid-m": "4DVBGoJsRIpTaQQiiq2inA", "ccid-l": "6WWc8fousTO45q1yVojzi2", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Find nearby enemy threats with Solid Snake's Soliton Radar Mk. III, a handheld device with a minimap that marks any hostiles present. Use the device's precision mode to pinpoint threats, but be wary, as this will alert enemies that they've been detected by Solid Snake. The Radar provides a view of immediate surroundings, making it an excellent tool for recon that allows allies to lay groundwork and take map control quickly. While hunting down enemies, Solid Snake can also scavenge gadgets from fallen Operators to adapt to the ever-changing needs of the battle.", "trackingLocationDetail": "operators details", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "ac3bd607-85d4-4fe0-a161-ae9622dbb4a5", "buttonNumber": 1, "id": "4PQPMYD3zjSluziyCQnFqH", "ccid-m": "4PQPMYD3zjSluziyCQnFqH", "ccid-l": "7wMMbNfk4Vn3CQgUwtqWLT", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1TpiUq5bPes6tuWqsA3u4J/1c18a4038474ac7271660ac76c436772/r6s-solid-snake-gadget.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "operators details", "trackingValue": "solid snake : unique ability and playstyle", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5xiVkjMOQN2hYG9fftvR4T/b1bf901f19631a36a590a0d1004f5f53/r6s-solid-snake-gadget.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "[REDACTED]", "placeOfBirth": "[REDACTED]", "biography": "### BIOGRAPHY\n*“It's easy to forget what a sin is in the middle of a battlefield.”*\n\nDocumentation regarding \\[REDACTED], aka “Solid Snake,” is so heavily redacted that we can only speculate on the full scope of his career. Multiple soldiers we’ve interviewed claim that he is nothing more than a myth, a legend to aspire to. However, the existence of his dossier disproves those perspectives and suggests that he may serve as a potential ally. The little information that has been verified is due in part to the assistance of Samuel “Zero” Fisher, who has interacted with him in the past.\n\nSolid Snake joined the military at a young age, where he excelled as a Green Beret and demonstrated an aptitude for linguistics, paratrooper techniques, and combat diving. He continued to develop his expertise in the fields of espionage and intelligence gathering until eventually joining FOXHOUND, where he was given the code name “Solid Snake.” Studying under the head of the unit and CQC expert \\[REDACTED], his infiltration skills became unmatched.\n\nSolid Snake left FOXHOUND under mysterious circumstances following a mission in South Africa. Even Sam Fisher was unable to provide additional information on what caused him to leave and then briefly join the CIA before disappearing from the world once again.\n\nAfter leaving the CIA, rumors started floating around the Agency that he was a part of a wet work mission in remote Alaska. More recent reports allege he created his own NGO under the name of Philanthropy to combat nuclear threats. As stated previously, we are unable to confirm nor deny this information’s validity.\n\n### PSYCHOLOGICAL REPORT\n\nThe following document is a transcribed interview of Specialist Samuel “Zero” Fisher regarding “Solid Snake.” All information presented here should be regarded as anecdotal.\n\n“You want to know about Snake, huh? He’s always been good at covering his tracks; I’m not surprised you couldn’t get much intel on him. There are only so many of us “covert espionage” types out there, so we try keeping tabs on each other. You never know when you’ll need a favor.\n\nWe met a while back, when we were both part of the CIA. I’ve worked with the best, but none quite match up to Snake. Infiltration, reconnaissance, hand-to-hand combat… I saw him take on a squad of potential CIA candidates and make them look like amateurs. He’s capable of handling the work of a whole team on his own, but he’s never let that get to his head. He’s selfless to a fault. One time in \\[REDACTED], we were pinned down, and he insisted on staying behind to give me a better chance of escaping. \\[…]\n\nDo I think he’s better than me? Not sure; we never had the chance to face off. Snake’s more resourceful than I am. He’s used to taking whatever he can from the battlefield and using it to his advantage. There was this time with an empty mag… never mind, that’s classified. Forget I said anything. All you need to know is he’s as good as I am. \\[…]\n\nIt's my understanding that Snake concerns himself more with nuclear threats these days, but you didn't hear that from me.”\n\n-- Stephen Romero, Sr. Analyst", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7l8uzV1767cot7GpTcnK7t/9be16729f34b76e97dbcbbd0a81bd74c/r6s-operators-badge-solidsnake.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/14s4oSyeat1seTsWpQ5g86/c252e34b3aa0e15358cad9aa907d4f8f/r6s-operator-solidsnake.png", "loadout": [{"name": "F2", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5HTvw1cJInVAGxOLXR0war/2f142437f5c0944fdcfcce8a03c37676/F2.png", "imageLocal": "img/loadout/F2.png"}, {"name": "TACIT .45", "slot": "secondary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6IMvC7a7IdpJWoMXjjloTE/be8a688d5c64478a254514d48b7bbf47/TACIT_45.png", "imageLocal": "img/loadout/TACIT .45.png"}, {"name": "PMR90A2", "slot": "primary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/g1CRNF5Bg8mYPXY8qxsTt/a3fd65c5715d31c8afeb9fad9c478be5/PMR90A2.png", "imageLocal": "img/loadout/PMR90A2.png"}, {"name": "Frag Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4GZsPHbm9H0k5EWz7TMkwO/33b9007bc6ee03dab15cfa15eb69e096/Frag_Grenade.png", "imageLocal": "img/loa es. With the ability to mark and ping opponents' electronic devices, there is nowhere to hide.", "trackingLocationDetail": "unique ability", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "d9ef894b-d825-4b4f-aea2-dc7f2bfdb0d9", "buttonNumber": 1, "id": "2tjXqnjEvRR52XUOtsQQFo", "ccid-m": "2tjXqnjEvRR52XUOtsQQFo", "ccid-l": "l2LLWvawUV2bft2IePHR0", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/15NxRqdvoBQha0QoLisGhq/50d006715a44706c563a052df0559440/SOLIS_GAMEPLAY.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "action", "trackingLocation": "promotion", "trackingLocationDetail": "unique ability", "trackingValue": "solis : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4uPZqzQtxhCYLFf51YTbnO/270df78e1943f95331db952363bd8539/SOLIS_GAMEPLAY.mp4", "description": null, "videoControls": false}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "September 18th (Age 37)", "placeOfBirth": "Zipaquirá, Colombia", "biography": "### Biography\n\n*“People lie. Data does not.”*\n\nDíaz grew up comfortably in an otherwise dangerous time for Colombia, where her close-knit family unit taught her the value of truth. As the eldest of four she felt a duty to protect others, which prompted her to join the National Police. Balancing her passion for computers and literature with her unflinching drive, she excelled in investigative work. After receiving a commendation for uncovering corruption among her peers, she pushed through special operations training and earned herself a spot in the AFEAU.\n\nDíaz was surprisingly proficient in ballistics and close combat for someone with her cerebral profile, which made her a well-rounded specialist. She worked in counterintelligence with the National Intelligence Directorate and led an initiative to partner with developers of Augmented Reality technology to enhance her unit’s efficiency. She simultaneously led a secret life online, monitoring systemic corruption through the dark web and ultimately discovering transactions that tied several officials to trafficking rings in South America. The crackdown that followed got her on Specialist Santiago “Flores” Lucero’s radar, who recommended her to Specialist Taina “Caveira” Pereira for recruitment.\n\n### Psychological report\n\nAs a scholar of linguistics, Specialist Ana “Solis” Díaz speaks in precise terms, leaving nothing to the imagination. As she explained, “every moment of confusion is a risk, a danger, so clarity is always essential.”\n\nShe brought up an Operation in Bogotá to illustrate this, where she was assigned to the protection of a VIP. Her charge’s refusal to explain who was pursuing him (and why) meant that Díaz’s unit was acting with limited information, and several of them were gravely injured as a result. This reminded Díaz of why she initially wanted to leave this career path. \n\nDíaz was shaken when she discovered her first commanding officer’s involvement with a local criminal element. Her community was endangered when the police force engaged in a shootout with the criminals they were supplying, and civilians were caught in the crossfire. Among the losses was Díaz’s aunt after whom she was named. The familial nickname of “Anita” never felt right to her afterwards, calling it a mark of shame, something she must make up for.\n\n“A corrupt system is one where trust is scarce, inequality is the norm, and the people we are meant to protect become expendable.” She refuses to make allowances for anyone who enables such environments. She chose to reach higher echelons to effect change not out of ambition, but because she feels like if she doesn’t do it, no one will. \\[…\\]\n\nI noticed Díaz was quick to bond with Zero, and she confessed that she was already familiar with his career through her extracurricular research. She sees in him a legend from which she can learn, taking every opportunity to train with him and interrogate him over coffee. He doesn’t seem to mind a student who listens, and a mentor could do Díaz some good. \\[…\\]\n\nAs confident as she is in her abilities, Díaz displayed some agitation when discussing the upcoming Operation. She puts a lot of pressure on herself and hinges her self-worth on success, so I’m not surprised that she’s afraid of failure. I expect she’ll feel more at ease when she realizes she’s surrounded by competent specialists.\n\n-- Dr. Harishva \"Harry\" Pandey, Behavioral Analyst\"", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6YOBUP5JMskklFx9nDJQ49/d9d4b0968f581597feaa0ef4ec0891f3/r6s-operators-badge-solis.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1OfBCr46se4TbYO1ff5Ral/3f4e4e9ed19672f8e49e9b608c5b8f6b/r6s-operator-solis.png", "loadout": [{"name": "ITA12L", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4Y6ziRzm9RiPii83fm8BV1/1f472744d2c2dec8d9206f4d8733d92c/ITA12L.png", "imageLocal": "img/loadout/ITA12L.png"}, {"name": "P90", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4nGrNspOvII2oS3lEMkg5x/2398a493c298bc654f97c58767aa40f3/P90.png", "imageLocal": "img/loadout/P90.png"}, {"name": "SMG-11", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3WExw7Kepz9uAiWAbWW457/875fc631a3cf9fcc2849d9db2989cbcd/SMG-11.png", "imageLocal": "img/loadout/SMG-11.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "Spec-IO Electro-Sensor", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6yJdnB2YJGY5lMh9mmKIQT/e41be5242462d00e9343acf8377f90a9/r6s-operator-ability-solis.png", "imageLocal": "img/loadout/Spec-IO Electro-Sensor.png"}], "iconLocal": "img/operators/solis_icon.png", "imageLocal": "img/operators/solis_render.png"}, {"slug": "striker", "name": "Striker", "realName": "Undefined", "side": true, "isAttacker": true, "squad": null, "faction": null, "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["support", "starter-operators"], "ability": {"id": "LdR3IZ4C5VmvPRUOl9bXl", "ccid-m": "LdR3IZ4C5VmvPRUOl9bXl", "ccid-l": "499JYi5nH1u4CB0JDwNljh", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Striker is the Attacker Operator with access to all secondary gadgets for Attack Operators. They have access to the M4 and the M249 as primary weapons, and the 5.7 USG and ITA 12S as secondary weapons.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "01b11f3f-7ae1-4503-826a-ec035d2f0c8d", "buttonNumber": 1, "id": "5mMlWTkQk083QvG8vAacjB", "ccid-m": "5mMlWTkQk083QvG8vAacjB", "ccid-l": "1BEwUUQL64DLWFyn5raMcP", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3aDGN53JpPMyNp0SYYdURH/1ab0ee1b34694ed16f9a581af0cd687c/R6S_NewBlood_OperatorGameplay_YT_striker.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "stiker : ability", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1qHhDdej2rqKoazlTyHJvn/f1d0be50b768d01627d1df6195b5ebbf/R6S_NewBlood_OperatorGameplay_YT__striker.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "Undefined", "placeOfBirth": "Undefined", "biography": "### BIOGRAPHY\n\n*“We earned the right to be here. Now we just have to earn the right to stay”*\n\nRainbow’s Attack Recruits, known as Strikers, are a cornerstone of the institution and despite internal perception, are not a generic monolith of identical soldiers. Generally speaking, they are much more youthful than our experienced Specialists and Operators, but that doesn’t make them any less integral to the smooth running of our missions. Furthermore, there are worse things than being overly enthusiastic, even if occasionally there will be some Recruits who get a little too excitable around our elite Specialists. Despite the confidential nature of Rainbow’s missions, some Recruits have been known to treat our Ops like near-celebrities, coming up with their own theories about who did what in various missions and pressing them for details and stories. Due to this and other concerns from Specialists, the Recruits now have their own mess hall and generally only interact with the Ops directly involved in their training. Though all of these Recruits hail from the most elite of elite military and counter-terror institutions, they all know that Rainbow is a cut above and treat the organization with the respect and discipline it demands. \n\nAlthough not full-fledged Operators, many Recruits have gone through trials by fire, like the survivors of Deimos’ attack on Tower. They performed valiantly, collaborating effectively with Vigil to down the helicopter that led the attack and took so many young lives. While this event was tragic, it was also a true test of field composure, leading one such survivor, Ram, to become a Specialist.\n\n### PSYCHOLOGICAL REPORT\n\nAs I’m running Rainbow’s Attack Recruit training, I’d be the most useful to weigh in here. I’ve got them mastering vertical breaching, flanking maneuvers, and drone use.  While Recruits arrive from all sorts of CTUs, military, or other enforcement units, bringing a ton of solid experience, it’s important we still put ‘em through a bit of a wringer.\n\nOnce they’ve moved beyond training, Recruits are the frontline in any ground, air or naval assault. While some of our more hardened and jaded Specialists may dismiss them as mere cannon fodder, a successful Recruit will create the windows of time that allow Rainbow’s Specialists to run a successful mission. I know I’ve counted on them more than once in my tenure.\n\nRainbow’s Specialists are the best of the best, and the bottom line is that most Attack Recruits won’t make the cut. Those that do, however, could find a home on numerous Squads. Thanks to their single-minded focus on completing mission objectives, Ghosteyes and Redhammer are the most logical spots, but no two Recruits are the same, so predictions like this can often prove futile. I’m more focused on getting them in fighting shape, anyhow.\n\n-- Specialist Sam “Zero” Fisher, Attack Recruit Training Lead", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2ZC6qMkmnam9bLc1fZJJ0C/fd0719a5b03789e65aa7f41e7c2dc49c/r6s-operators-badge-striker.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48 ": "Deployable Shield", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/W0WE0X2VQlxwWIAFCJ6Jm/523650a39de5a23dd9520d7299c9e25a/Deployable_Shield.png", "imageLocal": "img/loadout/Deployable Shield.png"}], "iconLocal": "img/operators/tachanka_icon.png", "imageLocal": "img/operators/tachanka_render.png"}, {"slug": "thatcher", "name": "Thatcher", "realName": "Mike Baker", "side": true, "isAttacker": true, "squad": ["viperstrike"], "faction": "SAS", "speed": 1, "armor": 3, "health": 125, "difficulty": 1, "roles": ["anti-gadget", "support"], "ability": {"id": "52wXSaN1VhjFhSzRMDLBsp", "ccid-m": "52wXSaN1VhjFhSzRMDLBsp", "ccid-l": "3MuPHghORNLvqveZD0XUIE", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Thatcher’s new gadget, the E.G.S. Disruptor, allows him to detect enemy electronic devices through obstructions and deactivate them with an EMP blast. Thatcher should be on the front line, inspecting defenses to allow other Attackers to move in. Thatcher's new device allows for a more precise, disruptive, and modernized gameplay, updating his role while keeping his identity intact.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "b3cb3b51-186e-4c75-a5ff-2962e0e36e4c", "buttonNumber": 1, "id": "2OFQVAhLhf8E61wALVKp09", "ccid-m": "2OFQVAhLhf8E61wALVKp09", "ccid-l": "2L6HHduyAyWuCCgZKBvaJ9", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3fZqFP1njJnqH6HAQMiyM/326780d761480de400482de198f453f0/R6S-thatcher-unique-ability.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7H8wNxJYs5bhhjFafrwiNq/418b87f0ec1f4137053e765d5099df01/R6S-thatcher-unique-ability.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "June 22nd (Age 56)", "placeOfBirth": "Bideford, England", "biography": "### BIOGRAPHY\n*“What you can feel, what you can touch – those are the things that are real. Everything else is just a distraction.”*\n\nBaker comes from a long line of dockworkers and soldiers. At the age of eighteen he enlisted for active military duty despite family pressure to join the family trade as a stevedore. Immediately thrown into politically-charged conflicts, Baker’s performance was exemplary. Further training and another conflict gave him a Distinguished Flying Cross and Conspicuous Gallantry Cross. His keen sense of observation and decisive manner, combined with his close-quarter combat techniques, made him invaluable on VIP protection detail.\n\nWith extensive field experience and proficiency in SAS tactics, Baker is a critical asset to any Rainbow operation. He has honed his expertise with protective measures and electronic counter-measures and frequently works with engineers to advance the equipment. As a Warrant Officer Class 1 (Regimental Sergeant Major) Baker serves as a respected and effective mentor to new recruits. Baker maintains his agility training, continuing abseiling, and has broken numerous mountain climbing records.\n\n### PSYCHOLOGICAL REPORT\n\nKnowing that Specialist Mike “Thatcher” Baker is cynical toward bureaucracy, I wasn’t surprised that he was reluctant to meet me. I needed a different approach. Baker lives aboard the Iron Maggie, a boat in drydock that he repairs in his spare time. It’s his “retirement plan.” I suspect he moved there temporarily when his wife divorced him, but now he knows no other civilian home. \\[…\\]\n\nBaker has a distinguished record of military service. He’s respected and in some cases idolized by those he mentors. When he welcomed me to his home, I could see why people describe him as down-to-earth. There’s more to Baker’s gruff, no-nonsense exterior – it just required some effort for him to trust me. \\[…\\]\n\nRaised in a coastal town, Baker has a strong connection with the water. We spent our entire meeting on the deck of his ship, overlooking the cold sea. Being someone who isn’t handy – mastering a paper airplane as a kid was the peak of my craft – I wanted to know what Baker likes about boat building and working with his hands. He told me that besides appreciating the precision of it, he liked shaping the wood into something that has a purpose. I suggested it was similar to how he mentors recruits. He replied that he doesn’t care about the “why” of things the way us “Uni types” do. \\[…\\]\n\nSpecialist Seamus “Sledge” Cowden is one of his few close friends. Thatcher’s tolerance of Specialist Mark “Mute” Chandar surprised me, since Thatcher is impatient with youthful bluster. When asked, Thatcher would only say: “Mute’s a clever kid.” He sounded almost envious. I wonder if Mute reflects someone Thatcher wishes he had been. \\[…\\]\n\nWhile by no means a Luddite, Baker does have an aversion to technology. To him, it’s a tool – like a hammer or screwdriver – nothing more. The idea that people come to rely on it as a crutch is what annoys him. I suggested that he spend time in the engineering lab with Specialists Masaru “Echo” Enatsu and Emmanuelle “Twitch” Pichon. They have a lot to teach one another.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5NbqTdEPmYy9qOZmN9StVT/38b3b2a70cfb4ffbfe6e8a6bd8654d1d/r6s-operators-badge-thatcher.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Iee
