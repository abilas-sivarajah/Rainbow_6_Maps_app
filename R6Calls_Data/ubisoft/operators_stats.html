"gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7izurbA5jDmnsmdeBdgKZO/29bca81243dda4084a92521ac0c03592/R6S-EMP-Impact-grenade.png", "imageLocal": "img/loadout/Impact EMP Grenade.png"}], "iconLocal": "img/operators/dokkaebi_icon.png", "imageLocal": "img/operators/dokkaebi_render.png"}, {"slug": "echo", "name": "Echo", "realName": "Masaru Enatsu", "side": false, "isAttacker": false, "squad": ["viperstrike"], "faction": "S.A.T.", "speed": 2, "armor": 3, "health": 110, "difficulty": 3, "roles": ["intel", "crowd-control"], "ability": {"id": "7h8IyQ5dZQV2cWFYnABdRC", "ccid-m": "7h8IyQ5dZQV2cWFYnABdRC", "ccid-l": "4qTn2M9NvyV9inQRIjSte1", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Equipped with an acoustic hailing device, this signature drone can fire ultrasonic bursts that disorient all targets in a given perimeter. Yokai also transmits a video feed to Echo, who keeps his immediate perimeter secure.\nEmbrace the power of technology and embody a turret Defender who can both hold up the siege and support roamers.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "2eb68833-56bc-416c-880d-016ecc43a103", "buttonNumber": 1, "id": "6KyOaMN3PEMW56TPPX37Ey", "ccid-m": "6KyOaMN3PEMW56TPPX37Ey", "ccid-l": "3PlUfME4x8boXz8eblWzU8", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/y0sdPfk1a5LaGuPDIC7VH/c4ddf66c3ad8aa05cfb2e6eee1f2080a/R6-operators-gadget-echo.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "October 31st (Age 36)", "placeOfBirth": "Tokyo, Japan (Suginami-ku)", "biography": "### Biography\n“Don’t ask me what I’m doing on my phone. You don’t want to know.”\n\nEnatsu grew up in Suginami, outside of Tokyo. Fascinated with robotics from an early age, he designed and programmed both terrestrial and flying drones and went on to win numerous competitions. After studying Electrical and Electronic Engineering at Tokyo Metropolitan University, Enatsu was encouraged to join the National Police Agency Security Bureau where he worked tirelessly in their research and development lab. Trained in counter-terrorism and intelligence gathering, Enatsu began designing specific tech that would better aid the Bureau. Joint training after the Nagoya hostage crisis prompted Enatsu to transfer to the Aichi Prefectural Police Department Special Unit where his tenacious focus enabled him to find creative solutions and alternate strategies. He eventually returned to Tokyo, where his exceptional intel gathering techniques as well as his quick and unpredictable methodology caught the attention of Rainbow.\n\n### Psychological report\nTo say that Specialist Masaru “Echo” Enatsu’s file has a few flags regarding his conduct is an understatement. Prior to our first session together I had met with every other member of Rainbow – some more than once. So when the conversation began with Enatsu admitting he’d been avoiding me, I knew we were going to get along.\n\nOften, I would rather not read a file first, to give someone a chance to tell me who they are in their own words. In this case it was important that I know what people think, because Enatsu was braced for my reaction. \\[…\\]\n\nI gather he and his family aren’t close. He joked that a calculator has more emotional range than his parents. This upbringing has made him resistant to working in groups, because a friendly, mutually beneficial dynamic isn’t one he’s familiar with. It’s my hope his time with Rainbow will help, but his desire to explore the “AI” of his fellow operators by pushing their buttons is something that may need to be handled from within the group. \\[…\\]\n\nEnatsu’s tactics have been described as tricky and unpredictable. This can work as a strong team strategy but it demands communication. \\[…\\] I’d also encourage the team to think of how best to utilize Enatsu’s potential. Some operators assume there will be issues with him before they even begin, which leads to predictable results. \\[…\\]\n\nSpecialists Yumiko “Hibana” Imagawa and Grace “Dokkaebi” Nam work with Enatsu on R&D quite often, actually. I’ve also noticed that he’s developed a rapport with Specialist Taina “Caveira” Pereira. I suspect he appreciates Pereira’s candor, since it ties into his own assumption that people who are offended simply don’t “get the joke.” \\[…\\]\n\nEnatsu frustrates easily. He has few outside interests, and consequently thinks only about improving his operational efficiency. It’s important that he recognize that everyone needs diversions – those in high-stress jobs even more so. It isn’t a sign of weakness to “switch off” every now and again, even if he has been conditioned to believe that a restful mind indicates a lack of intelligence.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3MRqAdUybJ7GR9gX4wPAI4/992938a70a4e53b91478358634e77ca7/Y1S4_BADGE_Echo_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2dZawp2HB63pTV3Zwgro6L/8278d19b2e9ae6b1f4ef45784a217c89/R6-operator-echo.png", "loadout": [{"name": "MP5SD", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5HaMldwFltBwiiyDDfkPpD/6de3aa9aaa17458e7f6186ba59b8deff/MP5SD.png", "imageLocal": "img/loadout/MP5SD.png"}, {"name": "SuperNova", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2tpjCRFLcc3hogjJGbKDsi/5ad0ab63b7245022aca5c1c1fb42d473/SuperNova.png", "imageLocal": "img/loadout/SuperNova.png"}, {"name": "Bearing 9", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4mdftEOh5Vu9KhhpgKLKrT/abedcc75868774018295ec2a08a7b3de/Bearing_9.png", "imageLocal": "img/loadout/Bearing 9.png"}, {"name": "P229", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/76ja0RxqzHW9PpvWgpG7Sk/cb753b50b20fe67deaef54d8b2a46b54/P229.png", "imageLocal": "img/loadout/P229.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Deployable Shield", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/W0WE0X2VQlxwWIAFCJ6Jm/523650a39de5a23dd9520d7299c9e25a/Deployable_Shield.png", "imageLocal": "img/loadout/Deployable Shield.png"}, {"name": "Yokai", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/TdDZyrKpjt9EQo8tHpIJk/d987db4da22046a0663be8be82dcda88/Yokai.png", "imageLocal": "img/loadout/Yokai.png"}], "iconLocal": "img/operators/echo_icon.png", "imageLocal": "img/operators/echo_render.png"}, {"slug": "ela", "name": "Ela", "realName": "Elżbieta Bosak", "side": false, "isAttacker": false, "squad": ["nighthaven"], "faction": "G.R.O.M", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["crowd-control", "trapper"], "ability": {"id": "523eC5KpAv0OTO073dtV2l", "ccid-m": "523eC5KpAv0OTO073dtV2l", "ccid-l": "7phLRqbf1ph6vwdV0ERNjf", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Inspired by the 1939 anti-tank Polish grenades used by the iconic Cichociemny during WWII, the sticky Grzmot mines can be anchored on surfaces, impairing hearing and causing a dizzying effect.\nThese concussion mines are triggered upon proximity, affecting anyone within its radius.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "db7ba76a-75fa-41f2-938b-e3fa06091c0c", "buttonNumber": 1, "id": "2VhSe3RAAIVb3yv2tQKUVf", "ccid-m": "2VhSe3RAAIVb3yv2tQKUVf", "ccid-l": "2e923H1j2SDkCPIUDjCJRB", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3FpaYC1WiwA07djenf4Ss6/178500a7e17e271f96035d87d4ae3d2c/R6-operators-gadget-ela.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "November 8th (Age 31)", "placeOfBirth": "Wrocław, Poland", "biography": "### Biography\n“Together, we can shake the very stars from the sky.”\n\nElżbieta Bosak is the youngest daughter of respected Jan Bosak, former commander of the Polish Special Operations Forces unit GROM. Like her sister, Zofia, Ela excelled in the grueling training imposed upon them by their father. She attended officers’ school but couldn’t reconcile military life with her need for independence and left to study Fine Arts in Berlin. Her reputation for using military paraphernalia in her art attracted the owner of a small private security company, who offered her a job. She was valued in the private sector for her expertise in survivalist tactics and unique adaptive style during protective detail and intelligence gathering, until her father’s death convinced her to return to Poland and join GROM. Ela is a reliable team player with leadership potential, even if her distrust of authority continues to be a point of contention. Her successful collaboration with SEAL prompted her invitation to join Rainbow.\n\n### Psychological report\nWe civilians can understand Specialist Elżbieta “Ela” Bosak’s independent nature more than some starch-collared military commander might. Of course, following orders is expected of those within the rank-and-file, and for someone so quick to buck against authority she also expresses a deep respect for the military and her role within it. It’s her autonomy that rubs traditionalists the wrong way, and perhaps her anger. Even at our first meeting, I detected her resolve. She is fighting against something, but it may not be authority – at least not entirely. \\[…\\]\n\nI won’t dismiss the concerns of commanding officers who mention that Bosak can be impulsive, but I would urge them instead to appreciate her creative resilience. Anyone who has worked with artists can attest to this quality. It manifests in the field in the protection of her team and her high number of successful operations. Her impulsiveness – her adaptability – is the very quality that causes her to excel. \\[…\\]\n\nBoth Ela and her sister, Zofia, carry the deep impression of their father’s influence. Ela is more inclined to accept that her father, though exceptional, wasn’t perfect. In reviewing Commander Jan Bosak’s file, I saw a proud, insightful man. That’s the key. Ela is finely tuned to the patterns and behaviors around her and when she seems defiant it’s because she’s frustrated with those who lack this “vision.” Joining Rainbow, and working with other elite operators, has somewhat tempered this frustration as she no longer feels constrained by the attitudes of those around her. \\[…\\]\n\nEla’s defiance extends into her personal life. She isn’t interested in self-improvement, she told me. She was surprised when I said I know about her “volunteer work.” She roams the streets late at night, with food and blankets to hand out, or even just a cigarette. Then she listens. Her conversations with strangers offer fresh perspectives. She stockpiles them, to add to her insight and therefore her skills, but also as fuel for her work. The status quo isn’t what she wants it to be, but that won’t stop her from trying to kick it into shape.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7zbkJJWMCOj04DNhYDz994/d2cba213d30d7b8cf2ba8cd568c78f20/Y2S3_BADGE_Ela_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3cpkHAvjm3RLhEoTqs090m/35a7595eb2f2431213656d66da8a9af8/R6-operator-ela.png", "loadout": [{"name": "Scorpion EVO 3 A1", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6OdwaLWxcnFvhlVwWbP2Du/4f7e94bdb6d34d5c0aa7b7b147b4092e/Scorpion_EVO_3_A1.png", "imageLocal": "img/loadout/Scorpion EVO 3 A1.png"}, {"name": "FO-12", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4TDWnhbgvLkc6HBWDJp2ST/f50cbd83d6d295ab59f17f7e21d713bc/FO-12.png", "imageLocal": "img/loadout/FO-12.png"}, {"name": "RG15", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2LNSsp7B7wUnnPUweir7Jm/9f66d53be7a63a17a55253a0bea6eec1/RG15.png", "imageLocal": "img/loadout/RG15.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "Deployable Shield", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/W0WE0X2VQlxwWIAFCJ6Jm/523650a39de5a23dd9520d7299c9e25a/Deployable_Shield.png", "imageLocal": "img/loadout/Deployable Shield.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Grzmot Mine", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/10Md7ccaUO0pE0nCWimeoZ/35dddc67a4141e844d7904051a0314dc/Grzmot-Mine.png", "imageLocal": "img/loadout/Grzmot Mine.png"}], "iconLocal": "img/operators/ela_icon.png", "imageLocal": "img/operators/ela_render.png"}, {"slug": "fenrir", "name": "Fenrir", "realName": "Emil Svensson", "side": false, "isAttacker": false, "squad": ["redhammer"], "faction": null, "speed": 2, "armor": 2, "health": 110, "difficulty": 3, "roles": ["trapper", "crowd-control"], "ability": {"id": "6qAohDFepmG1T4XyFlZNzK", "ccid-m": "6qAohDFepmG1T4XyFlZNzK", "ccid-l": "4jhtkszoNkAmxriaeG6wbw", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The F-NATT DREAD MINE is a throwable device that sticks to walls, so it can be hidden in places where fear can fester. Fenrir comes equipped with 5 mines and can activate 3 at a time anywhere on the map.", "trackingLocationDetail": "unique ability", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "633a4d7a-8c49-4e59-b319-49c81e58268a", "buttonNumber": 1, "id": "5CZ7REITbVHIgMO5lkz29J", "ccid-m": "5CZ7REITbVHIgMO5lkz29J", "ccid-l": "3zvRRXaa8e9BrSXni7jJtr", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2OZCrRZKuVIiBQxnl5gGIa/22389a85f9e399979ecd0114905767d7/fenrir-gameplay.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "unique ability", "trackingValue": "fenrir : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/333z0i5WIXJFueKR80lGKm/51d38bebefa77cc1ce3a3cb82fcdd331/fenrir-gameplay.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "December 3rd (Age 34)", "placeOfBirth": "Uppsala, Sweden", "biography": "### BIOGRAPHY\n\n*“Fear is a teacher. There’s always a lesson to be learned.”*\n\nSvensson was a curious boy growing up in Uppsala, where his parents encouraged his fascination with animal biology by enrolling him in every science class they could find. On track to attend his hometown’s University to pursue his passion, his focus shifted following his mandatory service. He learned that he had an affinity for physical fitness and tactical organization and became especially interested in how combat affects soldiers’ emotional states. Following his service period, he studied neurochemistry and joined the Swedish Armed Forces, quickly earning his way up.\n\nAs a communicator in the Special Operations Group, he expanded his skillset and aimed to develop strategies that would improve his peers’ performance. When his project to create formulas that alter soldiers’ emotions was denied, his insistence caused him to be discharged. Estranged from his family and made a pariah in the scientific and military communities, he had few options when Deimos approached him. With his newfound partner and funding, Svensson developed his technology until it became evident that he was being used to create a dangerous weapon. Taking his research with him, Svensson escaped Deimos’s facility and sought out Rainbow.\n\n### PSYCHOLOGICAL REPORT\n\nI understand the squad’s reluctance in accepting Specialist Emil “Fenrir” Svensson as one of our own. I was just as skeptical when he approached us, but I couldn’t ignore the possibility that his information on our enemy might give us the upper hand. I figured we could decide what to do with him later.\n\nDeimos is dangerous, and I considered that Svensson might be a spy, so I had Buck join me during interviews. On paper, Fenrir is exactly the type of person Rainbow would seek out to recruit. He’s an intellectual, and an ambitious tactician in peak form. As I learned more about his career path, I realized the traits that led to his military discharge are ones I expect in a member of Redhammer: unflinching drive, conviction, and readiness to put himself in harm’s way when necessary.\n\nI can’t fully absolve him of his work with Deimos, but I can relate to the regret Svensson feels. He had no prior knowledge of the enemy’s operations, so I can’t blame him for accepting the offer. It's easy to get tunnel vision when pursuing groundbreaking research, but eventually you have to come to your senses and notice what's around you. The turning point for him was witnessing Deimos use an unstable version of his fear toxin on his colleagues. As he puts it, his work was meant to help people, not hurt them.\n\nThe way I see it, I have my hands on an excellent specialist who knows more about our enemy than any of us do. I’d call that an asset. He passed every test I threw his way, and Buck didn’t raise any red flags. Kaid has protested openly against Fenrir, but he’ll have to come around. We need to take Deimos down.\n\n-- Captain Jordan “Thermite” Trace, Redhammer Squad Leader", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4vtvBhY56S2slW3y0eKsMp/6a0f4180754 ategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "flores : unique abilities", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/51iAUL6UbOJ9jRY2lp5NT2/9f8330de5e4ca7245e5596bb8bfc21d5/r6s-operators-ability-flores.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "October 2nd (Age 38)", "placeOfBirth": "Buenos Aires, Argentina", "biography": "### Biography\n\n*“In life, you have to commit to the things that make you happy. For me, that’s robbing the rich and corrupt.”*\n\nProviding for his mother as her health slowly declined, Lucero was unfulfilled with work in the public sector and unimpressed with military school. This drew him to burglary as an occupation, and he found purpose in robbing powerful criminals to give back to the poor. Operating in the Flores district of Buenos Aires, Lucero’s notoriety grew and he came to be known as ‘the Man from Flores.’\n\nWhen his identity was exposed and he had to flee, Specialist Eliza “Ash” Cohen offered him asylum in the United States. In exchange, he provided evidence against Buenos Aires’ most ruthless crime lords. With a new life in Los Angeles, Lucero opened his own food truck from which he operated heists for five years. When Cohen became aware of his activities, she offered him a seat at her table, and a stable future in which he could build a family\n\n### Psychological report\n\n\"Because of his stubborn and perfectionist nature, Specialist Santiago “Flores” Lucero struggles to separate the personal from the professional. He likes to put people at ease and regularly cracks jokes, but he often gets in his own way by overanalyzing mundane situations.\n\nI can understand the impulse to cover all possibilities, considering his mother was killed in retaliation of his activities in Buenos Aires. He needs to realize that he’s in good hands here. In the long run, I’m certain his interactions with the others, particularly Specialist Eliza “Ash” Cohen, with whom he’s already familiar, will help him let down his guard.\n\nAs a bonding exercise, I had Santiago cook his favorite Argentinian meals for us to share and it became easier to dive into deeper subjects. I learned that despite his charms, he’s not afraid to be vocal about social issues and his efforts to give back to impoverished communities. He also confessed that his marriage was as much of a surprise to him as it was to me. Maybe in time we’ll find out why his husband isn’t bothered by his criminal career. \n\nWe also delved into how his childhood shaped who he is today. While he adheres to this traditional idea of “machismo,” he’s quick to point out that his mother taught him to think independently. He has no memories of his father and his political activism, but he likes to talk about how his mother was proud of him for also doing what he felt was right, regardless of the consequences. \\[...]\n\nI’m glad Santiago has been taking the time to observe everyone else’s methods in order to improve his own. He learned a lot at the Colegio Militar in El Palomar and I’m sure his years of criminal activity helped in that regard. However, I believe his budding friendship with Specialists Grace “Dokkaebi” Nam and Tori “Gridlock” Fairous, based mostly on technology and food, will be greatly beneficial.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/75vqJXXKCM2EDO0iiNqRDe/d6289dc9a4fed72ef72b9c1e11738456/Y6S1_BADGE_Flores_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4lZEmYIYYUloCcSarIJfiK/f8cbc4701200b414e6efe0d599ac8106/r6s-operator-flores.png", "loadout": [{"name": "AR33", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/16U6xEvX8I5xQd9duveBLN/45d22960872cfa3fb6be9eb47fa0be4e/AR33.png", "imageLocal": "img/loadout/AR33.png"}, {"name": "SR-25", "slot": "primary", "subtype": "Marksman Rifle", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3H3sICdj6BK8LhtQPRd2aJ/26826ebba73e0e5fd503256d069f3256/SR-25.png", "imageLocal": "img/loadout/SR-25.png"}, {"name": "T-95 LSW", "slot": "primary", "subtype": "Light Machine Gun", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/23HCxaNTRUHBlFAvCTMZQm/fe319cc164fac034a29e9b114ae7d5cb/T-95_LSW.png", "imageLocal": "img/loadout/T-95 LSW.png"}, {"name": "GSh-18", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5s5Q33j3MNcXf9lwfxfd7m/4eb3a6af1d431481b6ddcec44fbc7602/GSh-18.png", "imageLocal": "img/loadout/GSh-18.png"}, {"name": "Stun Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3XnK8s1iQJQu5cfr6UyQfK/429480b96d6d6d6b830c32c75d2608f5/Stun_Grenade.png", "imageLocal": "img/loadout/Stun Grenade.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "RCE-RATERO CHARGE", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1z7eSI5D8IRIOHi0PJu4yq/3c4a273098a840957a248583f73fa8ff/r6s-operator-ability-flores.png", "imageLocal": "img/loadout/RCE-RATERO CHARGE.png"}], "iconLocal": "img/operators/flores_icon.png", "imageLocal": "img/operators/flores_render.png"}, {"slug": "frost", "name": "Frost", "realName": "Tina Lin Tsang", "side": false, "isAttacker": false, "squad": ["wolfguard"], "faction": "JTF2", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["anti-entry", "trapper"], "ability": {"id": "4k9tFu3f2uqwX3lvU6Nghh", "ccid-m": "4k9tFu3f2uqwX3lvU6Nghh", "ccid-l": "1SRcRmPChHua51X39kd7eE", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The rubber mat and concealed metal jaws are bolted in place. When the pressure plate is engaged, two sets of jaws at ankle and shin height deploy, locking the person in place.\nOperators who fall onto a Welcome Mat will be able to remove it from their leg by themselves or with the help of a teammate.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "32d3088f-6cb2-4bda-9e23-097fbaf362a6", "buttonNumber": 1, "id": "7uhoXO1Qn7I0N7xfcymbYh", "ccid-m": "7uhoXO1Qn7I0N7xfcymbYh", "ccid-l": "1VmxH1qhWSQIhdzC20YLnL", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3xlKismScJsEbZgXdMgu5v/261f291604550bc4039b7dde00ba551e/R6-operators-gadget-frost.webp", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "GAQEsRmoJvk", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "May 4th (Age 32)", "placeOfBirth": "Vancouver, British Columbia", "biography": "### Biography\n“There are two things the human body needs most in a survival situation: Water, and hope.”\n\nTsang was raised in Vancouver, British Columbia, and enlisted with the Royal Canadian Air Force (RCAF) on her eighteenth birthday. At the Royal Military College of Canada (RMC), she graduated top of her class. Upon completion of her bachelor’s degree and officer training, Tsang was stationed on Canada’s west coast at CFB Esquimalt with the Joint Rescue Coordination Centre Victoria (JRCC Victoria). From there she served on the primary Search & Rescue response team covering BC and the Yukon Territory.\n\nTsang has been praised for exceptional situational awareness and is valued for her mission planning and threat reaction. Her SAR training in mountain-climbing, parachuting and diving extends into her recreational time. Drawing on her background in Mechanical Engineering, Tsang helped design and modify the Sterling Mk2 LHT, or “Welcome Mat,” whose portable design allows for discreet deployment in a variety of areas and environments.\n\n### Psychological report\nI confess I find Tina Lin “Frost” Tsang’s energy exhausting. Not many adults make me feel like an old man. She rearranged my shelves during our meeting… It does look better. Not that Tsang is nervous. Far from it. It’s more akin to a fine-tuned athlete. \\[…\\]\n\nField reports highlight Tsang’s focus and perseverance. The team trusts her planning, if not necessarily her fastidiousness. Any disagreements don’t appear to hinder the team dynamic since Tsang is open to feedback, though I do detect some resentment from her concerning people who might be less patient or who opt for shortcuts. \\[…\\]\n\nTsang’s mission planning is meticulous and she brings this same careful viewpoint to her everyday life. A good example was when she told me about her parents’ recent anniversary party. She described the traditional Chinese banquet and its ten-course meal in such detail, I think she could recreate it from memory. \\[…\\]\n\nBeyond that, it was a challenge finding a subject outside of operations that excites her. Music? Depends on her mood. Books? Not really. Finally, I asked about her hunting trips. Growing up in British Columbia, Tsang developed a respect for Canada’s indigenous cultures and urged me to visit Haida Gwaii territory should I visit West Coast Canada. When I asked about the vague note in her medical records regarding a hunting accident, she was reluctant to talk. Her bush plane made an emergency landing in a range called the Nahanni. Bad weather rolled in and then, a week later, help arrived. Her reluctance to offer details and frequent use of “should have” indicate she feels some shame. Rather than push the issue, I introduced her to Specialist Sanaa “Nomad” El Maktoub. Their similar experiences made them instant friends. Both women share a deep connection to the outdoors. It’s not simply being outside -- it’s the wild that appeals. \\[…\\]\n\nTsang’s precision-oriented personality is a huge asset, but I’d like her to consider deeper introspection. Her ability to self-actualize will be critical if we continue to have her working alongside other strong personalities such as Specialist Taina “Caveira” Pereira.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1OWFtfiEXleLSENciCSQQR/8fcced59c0125073e506f2dee0201015/Y1S1_BADGE_Frost_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4IrcYxDo6aVBQyxDOFirQE/852e6c6c0e8a46303469921efae3d6dc/R6-operator-frost.png", "loadout": [{"name": "Super 90", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1TLWSu0xHJlAsfEfafeC9X/f9647e70a18962bf1627095c8b46832e/Super_90.png", "imageLocal": "img/loadout/Super 90.png"}, {"name": "9mm C1", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/60sbThKtOpNOwKu3OP0oGV/672fd9263f7786402a0d855273473a6f/9mm_C1.png", "imageLocal": "img/loadout/9mm C1.png"}, {"name": "Mk1 9mm", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3tWoNeF3jQYs3w4EOydQYs/434409c96693df1fd3e969d778e70795/Mk1_9mm_BI.png", "imageLocal": "img/loadout/Mk1 9mm.png"}, {"name": "ITA12S", "slot": "secondary", "subtype": "SHOTGUN", "image": "ht ulty": 2, "roles": ["anti-entry", "trapper"], "ability": {"id": "y2ehwnLAzpKdFMsqdGPRR", "ccid-m": "y2ehwnLAzpKdFMsqdGPRR", "ccid-l": "110TnANZZtpA25BNl5zYOA", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Like the ordinary Deployable Shield, the Volcán Shield provides cover and allows Defenders to block pathways, but Goyo turns up the heat with an attached incendiary bomb. From the front, however, there’s little indication of which it might be. Until someone shoots the bomb to make it explode, the shield continues to be an obstacle for the Attackers.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "0cedccda-ef93-492b-92e1-1249365b8c2c", "buttonNumber": 1, "id": "2v2cQaA6eN6SM8KkiSqQ2q", "ccid-m": "2v2cQaA6eN6SM8KkiSqQ2q", "ccid-l": "53m2XTL0rBd2KWUNVklSyW", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1j9nSf8pFdngbx916IxJVD/6af2cbf6b6de1923f7f53ee9da915332/operator-video-ability-goyo.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/61IYCzL0OtdtXYbf8aPx4Z/5372fb68d509cb090e283a2b4ff6115f/operator-video-ability-goyo.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "June 20th (Age 31)", "placeOfBirth": "Culiacán Rosales, Mexico", "biography": "### Biography\n“A person is never more honest than when they think they’re alone.”\n\nCésar Ruiz Hernández was eleven years old when a bomb destroyed his home, killing his father and sister and severely injuring his mother. With the help of Specialist Azucena Rocío “Amaru” Quispe, César’s mother Sofia taught him to observe his surroundings, and to avoid the other boys his age who had been drawn into gang-related affairs. She encouraged him to enroll at the Heroic Naval Military School, where he graduated as a teniente de corbeta. He joined the Naval Infantry, then the Amphibious Commando Battalion, participating extensively in anti-smuggling operations and several high-profile arrests. Becoming a member of the Fuerzas Especiales introduced him to the reality that drugs were no longer the primary source of income for the cartels. He began working with UNESCO and INTERPOL to combat antiquities trafficking, where he gained the attention of Rainbow as a mind with a keen tactical sense and exceptional forward-thinking.\n\n### Psychological report\nSpecialist César \"Goyo\" Ruiz Hernández is a rare find. His jacket reads like any normal military trajectory, until you notice the devil behind the details. To confirm my theory, during our first meeting I challenged him to a game of chess. I won’t mention how few moves it took him to beat me. César himself seemed to think nothing of it. \\[…\\]\n\nThis humble attitude is at the heart of his character. His mother, Sofia – who protected him from the brunt of the bomb’s blast – has cultivated an overtly optimistic worldview. Growing up where he did, when he did, she also instilled in him a cat-and-mouse mindset, to keep him clear of the negative influences that would have been especially tempting to a young fatherless boy with too much time on his hands. She was helped in this by Specialist Azucena Rocío “Amaru” Quispe, whose intermittent presence and strong familial values shored up a gap that Sofia alone couldn’t fill. \\[…\\] It’s clear to me that Quispe, with her inherent attachment to her country and her family history, provided a stabilizing influence during Hernández’s undoubtedly troubled adolescence. \\[…\\]\n\nHernández is the kind to think carefully before speaking, a trait which can lead people to underestimate him. He is neither churlish nor aloof, but constantly considering the many angles of the problem set before him. \\[…\\] His ability to track and guide his quarry, from determining their routine to understanding how they will react to threats, is uncanny. In a prosaic example, he brought Specialist Tina Lin “Frost” Tsang a bottle of apple-flavored soda on the first day of Fall, despite them only having met once before. She was unperturbed, but I could see that Hernández had braced himself for a far less positive outcome. \\[…\\]\n\nSpecialist Hernández has otherwise become a staple of our briefings, his incisive questions highlighting new tactical considerations or encouraging out-of-the-box thinking from the other members of the team. I must admit, it’s refreshing to see what changes a new perspective and an impeccable poker face can bring to an otherwise very self-assured group of individuals.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6AAY4FZt5piHdabOdDokE4/f7f8bd90c20b8a429c78a08684b75aca/Y4S3_BADGE_Goyo_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3Hz6j8A8mmpN0zsxoQWXgC/1d29dff2a852f5fe25c5c4640dfe2d12/R6-operator-goyo.png", "loadout": [{"name": "Vector .45 ACP", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7D1cDf13FqUhoLihzvuPln/068aa7e507155598449c58c0a49a90d6/Vector_.45_ACP.png", "imageLocal": "img/loadout/Vector .45 ACP.png"}, {"name": "TCSG12", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2NDbY7BTBJ9R09LUilTlRf/3728337cd3ba14ed6ab9de0c22e879af/TCSG12.png", "imageLocal": "img/loadout/TCSG12.png"}, {"name": "P229", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/76ja0RxqzHW9PpvWgpG7Sk/cb753b50b20fe67deaef54d8b2a46b54/P229.png", "imageLocal": "img/loadout/P229.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Volcán Canister", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1JqlRdbaVA73jDq8y46vX4/82e89f39c479526ace294ba246d0b085/Volcan-Shield.png", "imageLocal": "img/loadout/Volcán Canister.png"}], "iconLocal": "img/operators/goyo_icon.png", "imageLocal": "img/operators/goyo_render.png"}, {"slug": "gridlock", "name": "Gridlock", "realName": "Tori Tallyo Fairous", "side": true, "isAttacker": true, "squad": ["redhammer"], "faction": "SASR", "speed": 1, "armor": 3, "health": 125, "difficulty": 1, "roles": ["support", "map-control"], "ability": {"id": "hQu5jhX6WE67Q33pVyiq6", "ccid-m": "hQu5jhX6WE67Q33pVyiq6", "ccid-l": "1vuqmB01FW0WqLJThnBMgo", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Trax Stingers' design is a portable version that when activated, deploys a hexagonal cluster of spikes, covering uneven ground better than a straight mat. Once deployed they can replicate and spread out over a large area. This feature, unique for an Attacker, enables them to use the Trax as an obstacle to reshape the map and control an area. Effects on the enemy include slowing them down and causing damage when stepped on. Trax Stingers will be destroyed when shot or dealt impact or thermal damage.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "24675c39-acbe-4350-b1c0-090c59ecfb3c", "buttonNumber": 1, "id": "6Vg0di0Cl7sJkYkNSsjEKt", "ccid-m": "6Vg0di0Cl7sJkYkNSsjEKt", "ccid-l": "7loA5ZesjPo0dknLdnNiwD", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3wWAQGDxeaQfflYONKHFKZ/00eb92c97c175df72018886a20112ecb/operator-video-ability-gridlock.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/I21KRxTDcUVU6v8z7SnkT/b3bd59da3e019869b54cad30fe67d3df/operator-video-ability-gridlock.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "August 5th (Age 36)", "placeOfBirth": "Longreach, Central Queensland, Australia", "biography": "### Biography\n“You’ve gotta have a couple of roos loose in the top paddock to sign up for this life, but there’s nowhere I’d rather be.”\n\nThe eldest of five, Fairous has demonstrated leadership potential throughout her life. From an early age Fairous worked with engines and competed in robot championships. Her mechanic background was heavily influenced by her father, a military aircraft mechanic. Fairous joined the Australian army reserves to further develop her mechanical engineering skills and to have access to the best equipment. After graduating from university she chose Army branch of the Australian Defense Force, where she honed her mechanical prowess. Fairous also has expertise in a range of weapons, intelligence gathering and close protection duties, and has the ability to adapt to unexpected situations and remain calm in dangerous situations. This unique skill set made her an essential recruit into the SASR Mobility Platoon. Fairous was awarded the National Emergency Medal for her part in saving firefighters. She has been offered lead positions but has repeatedly turned them down.\n\n### Psychological report\nSpecialists Tori “Gridlock” Fairous and Max “Mozzie” Goose caught my attention after the Esperance Bushfire Operation when their daring feat to rescue trapped firefighters earned them a medal. For outsiders, their plan looked horribly reckless, but to me it illustrated what I like in a team.\n \nThese two have a long history, having first met in high school at a robot wars competition and then again during army training. They’ve been a team ever since. Individually, they’re assets to Rainbow… but together they dominate. Both consistently demonstrate creativity and skill under pressure, so… what happens when we position them against one another? And I want to see if Specialist Fairous can maintain her cool among a new team… not to mention how the team feels about someone with such a formidable presence. \\[…\\]\nField reports often refer to Fairous’s natural leadership so I’m curious why she consistently turns down promotions. She jokes that it’s too much paperwork, but she seems to back into the role anyway. \nAfter her father died, she and her mother discovered the family farm was in debt. Fairous took the lead, rallying her four siblings and extended cousins while using her army salary to save the farm. Fairous isn’t afraid of responsibility and her desire to look out for her family extends to how she interacts with her team. This makes me want to look more closely at her life on the farm. I can hear the fondness for it even when she’s griping about how she has to keep fixing backed-up toilets and broken-down tractors.\n\nFairous’s “get on with things” attitude means that she doesn’t shy from hard work and manages to find humor in every situation. So I wonder if she turns down the promotions because she has plenty of opportunity to be boss at home and that at work she’d prefer to just get on with it.\n\n-- Dr. Harishva Pandey", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5LIyheUROsdMDkX6o0zh6R/f201ce65af771459c374ef71c89827b4/Y4S1_BADGE_Gridlock_LL.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/221q2yd28L3IAkjUGEFCke/51f431695fe53b30f7b384141b5e63ee/R6-operator-gridlock.png", "loadout": [{"name": "F90", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/62tE3th2ThcGHlrcqWkmEX/d69c9de199542e25fa55f6d293f15671/r6-operator-weapon-ar-f90.png", "imageLocal": "img/loadout/F90.png"}, {"name": "M249 SAW", "slot": "primary", "subtype": "Light Machine Gun", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3p0oG7GsLIoHaRullf7xsF/e2a9e135af63e8897355023cd34538c4/M249_SAW.png", "imageLocal": "img/loadout/M249 SAW.png"}, {"name": "Super Shorty", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Dq8LDmIxAveRqXM17orUW/8169927dba6976cee92cc53c7b0960aa/r6-operator-weapon-sa-supershorty.png", "imageLocal": "img/loadout/Super Shorty.png"}, {"name": "SDP 9mm", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/Tgsdyz3XEqmgUYi9aZZgb/6755f4da7af7a7179ffab92acf8d477e/SDP_9mm.png", "imageLocal": "img/loadout/SDP 9mm.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c4636845a04478432c48be8c29aee/Smoke_Grenade.png", "imageLocal": "img/loadout/Smoke Grenade.png"}, {"name": "Trax Stingers", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/QGVvmZeZ91FC2X4mvMzgn/601fa45e635872aea31f15ffebb9c366/Trax-Stingers.png", "imageLocal": "img/loadout/Trax Stingers.png"}, {"name": "Frag Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4GZsPHbm9H0k5EWz7TMkwO/33b9007bc6ee03dab15cfa15eb69e096/Frag_Grenade.png", "imageLocal": "img/loadout/Frag Grenade.png"}, {"name": "Impact EMP Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7izurbA5jDmnsmdeBdgKZO/29bca81243dda4084a92521ac0c03592/R6S-EMP-Impact-grenade.png", "imageLocal": "img/loadout/Impact EMP Grenade.png"}], "iconLocal": "img/operators/gridlock_icon.png", "imageLocal": "img/operators/gridlock_render.png"}, {"slug": "grim", "name": "Grim", "realName": "Charlie Tho Keng Boon", "side": true, "isAttacker": true, "squad": ["nighthaven"], "faction": "Singapore Armed Forces", "speed": 3, "armor": 1, "health": 100, "difficulty": 1, "roles": ["map-control", "front-line"], "ability": {"id": "1WTweUulNYiTOA1EC4Mk2a", "ccid-m": "1WTweUulNYiTOA1EC4Mk2a", "ccid-l": "4STcJrkSnPDDMvwhVvx2Xr", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "You've heard the buzz, and the Kawan Hive Launcher is here! Firing off a projectile releases a swarm of bots that track the location of opponents who walk through it. Just don't get them in your eyes.", "trackingLocationDetail": "unique ability", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "f3980acd-47fa-499a-bb7f-9b12ff71e020", "buttonNumber": 1, "id": "4wb52TDkT02FF5bBIBIxSh", "ccid-m": "4wb52TDkT02FF5bBIBIxSh", "ccid-l": "6aI1rj9Aq0Xr3h1vDo5R22", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4n5lXlCh3BqR65tGQWTbB1/04bb598cbc50e773144426faafc380a0/r6s-y7s3-gadget-grim.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "action", "trackingLocation": "promotion", "trackingLocationDetail": "unique ability", "trackingValue": "grim : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/ygOFh2ul9jAjYOw8GMh1b/48ebb1e9eea40c5b0d9c7ecdfb277537/r6s-y7s3-gadget-grim.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "April 5th (Age 39)", "placeOfBirth": "Jurong, Singapore", "biography": "### Biography\n\n*“Get out of my way.”*\n\nGrowing up in Jurong, Singapore, Keng Boon could often be found in the wilderness learning and practicing the skills he was taught by his survivalist father. At 18, he was conscripted into National Service and thrust into the NDU - Singapore's elite naval special forces formation. A prime candidate for the Frogman School (FMS), Keng Boon’s endurance and focus assured successful completion of FMS training and advancement to the Clearance Diving Group (CDG). \n\nAs part of the Naval Explosive Ordnance Disposal unit (EOD), Keng Boon worked closely with countermeasure platforms. He then attended the SAF Military Intelligence Institute's School of Army Reconnaissance where, as the “eyes and ears” of the SAF, he was trained to be stealthy, obtain information, and provide accurate and timely intelligence reports. His skills in reconnaissance and security brought Keng Boon to Kali’s attention as a potential Nighthaven agent.\n\n### Psychological report\n\nAgent Charlie Tho “Grim” Keng Boon is a difficult man to get to know, let alone bond with. Within minutes of our initial meeting, I had the sense he was conducting his own evaluation. There is a coldness to him that makes me wonder what would have occurred had I not met his qualifications. \n\nEven as a child Keng Boon displayed a predatory disposition. When he talked about afternoons spent helping his mother tend her beehives, he referred to an incident worth exploring. One of those afternoons was interrupted by an armed assailant. Using a strategy he observed in bees, Keng Boon took down the man, who was twice his size, by focusing on the sensitive areas around the head. His aggression was so precise and overwhelming that his mother’s attacker never recovered from the resulting coma. When I asked if this event affects him today, Keng Boon answered “No.” Whether guilt regarding the event was dismissed or present at all is undetermined.\n\nDespite his lack of sociability, he demonstrates no discomfort working within a combat unit. In \\[REDACTED], Commander \\[REDACTED] states “Keng Boon’s ruthlessness is an asset to \\[REDACTED]. The \\[REDACTED] casualties resulting from \\[REDACTED] were justifiable risks with no unsanctioned kills. Despite \\[REDACTED]’s brutality he knows the rules and operates within them.” He seems to regard other soldiers as tools in his well assembled arsenal, deploying them in a dehumanizing yet effective manner. I admit to some concerns regarding Agent Keng Boon, his sense of detachment could signal unaddressed traumas that diminish his efficacy in the field…\n\n(Comment_J.K.Shah: His tough exterior doesn’t come from any unaddressed trauma, he just doesn’t give a shit. - Kali)\n\n\\[…\\] I did expect some friction in the lab with Janković given how protective she is of her space. So far he’s displayed nothing beyond exemplary professionalism. While she does most of the talking and Keng Boon all the frowning, there seems to be a mutual understanding between them; Janković was even seen reading a detective novel that was previously on Keng Boon’s desk. \\[…\\]\n\n-- Nighthaven Psych Division", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5VoAYPvRZXIwjcwTD3PWaZ/b9748f007c0c116ca1bcd77b0f91e766/r6s-operators-badge-grim.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2Mh6QhvaGrU16dvqAlDq6M/65d751edc5d985badc95db15b0784f54/r6s-operator-grim.png", "loadout": [{"name": "552 Commando", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1LT0N89YaOHvRwn3Pphr8K/02d4a3da9cda132d8201fd134f24fede/552_Commando.png", "imageLocal": "img/loadout/552 Commando.png"}, {"name": "SG-CQB", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5JoL3b36Fsztt9Q2XYmrbJ/dacec96948d3f8fe92914a69b9aac593/SG-CQB.png", "imageLocal": "img/loadout/SG-CQB.png"}, {"name": "Bailiff 410", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/N8FLbo4fsNyBe8msKgRhT/8f403dc0b58087bcafab786dd95ba33f/Bailiff_410.png", "imageLocal": "img/loadout/Bailiff 410.png"}, {"name": "P229", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/76ja0RxqzHW9PpvWgpG7Sk/cb753b50b20fe67deaef54d8b2a46b54/P229.png", "imageLocal": "img/loadout/P229.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "HARD BREACH CHARGE", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3OvnVPWY1UyrDE913kU0a1/eae4b2a1584234ea2ff4ad6481239f3b/SecondaryBreacher.png", "imageLocal": "img/loadout/HARD BREACH CHARGE.png"}, {"name": "Impact EMP Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7izurbA5jDmnsmdeBdgKZO/29bca81243dda4084a92521ac0c03592/R6S-EMP-Impact-grenade.png", "imageLocal": "img/loadout/Impact EMP Grenade.png"}, {"name": "Kawan Hive Launcher", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2Ws6ae13XPN5rcsw0WVt3d/dfacf2c29837553c667d77ca83ee3d0d/r6s-operator-ability-grim.png", "imageLocal": "img/loadout/Kawan Hive Launcher.png"}], "iconLocal": "img/operators/grim_icon.png", "imageLocal": "img/operators/grim_render.png"}, {"slug": "hibana", "name": "Hibana", "realName": "Yumiko Imagawa", "side": true, "isAttacker": true, "squad": ["viperstrike"], "faction": "S.A.T.", "speed": 3, "armor": 1, "health": 100, "difficulty": 1, "roles": ["breach", "front-line"], "ability": {"id": "4CBYups8hqzSwi5eFeUS7H", "ccid-m": "4CBYups8hqzSwi5eFeUS7H", "ccid-l": "2NmhSKXV9kaaGWWsxSoo2D", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The X-KAIROS - a 40 mm caliber launcher - fires explosive pellets that can be detonated simultaneously from a distance.\nDeliver innovative assaults by creating lines of sights, or new pathways!", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "84175b54-338b-45e8-b230-0db904fb1bda", "buttonNumber": 1, "id": "1aFTzclXJ7rZIAbLxwhvZJ", "ccid-m": "1aFTzclXJ7rZIAbLxwhvZJ", "ccid-l": "4FjcNvHwZP4F1ljdjrF56P", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/557QbWSKs8UidULEclu8KU/ed0f9e687dfdec5d4a1a27ac496fbef6/R6-operators-gadget-hibana.png", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "4gNbU1Eie8A", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "July 12th (Age 34)", "placeOfBirth": "Nagoya, Japan", "biography": "### Biography\n“Kyūdō is meditation in action. Explosions are part of that action.”\n\nImagawa is an expert in paramilitary techniques and infiltration of high-risk areas, demonstrating brilliant leadership skills in the field. Encouraged by her family, she has been practicing the long-range martial art of Kyūdō from an early age and possesses the ability to assess multiple factors simultaneously while executing precise, controlled, and fluid motions. Having trained with CTUs around the world including the SAS, FBI SWAT, and GIGN, Hibana has acquired a rare tactical versatility, with proficiency in tubular (bus, train, and airplane) assaults. During her studies at the National Police Academy, she gained the nickname Hibana due to her improvised explosive devices. Fluent in several languages and lethal with any weapon, Imagawa was recruited by the Aichi Prefectural Police Department Special Assault Team, where her diverse techniques and charisma resulted in her to moving quickly up the ranks.\n\n### Psychological report\nSpecialist Yumiko “Hibana” Imagawa has considerable talents. I only know a few others with as many commendations. Inspiring operatives from diverse backgrounds and putting people at ease comes naturally to her, and she’s certainly gracious with my poor attempts at Japanese. \\[…\\]\n\nI enjoy our conversations. Imagawa is very lyrical in the way she recounts her experiences. For someone who’s been around the world and encountered so many cultures, her favorite stories are of her childhood home. Like when her father would come home from his work as a butcher, and Imagawa’s mother wouldn’t allow him inside until they had hosed him down in the garden. The image of her drenched, barefoot father dancing under the spray of frigid water was a great amusement to the family. I like the story.\n\nMemories likese these keep us grounded and I wondered if training in Kyudo had fostered this appreciation in her. When I suggested that she had an aura of inner serenity, she laughed and called me a “hippie.” \\[…\\] I’d like to see if she can influence some of the others to maintain that calm sensibility. Her training with so many CTUs makes her an ideal fit for the role. Already within Rainbow Imagawa is universally respected. \\[…\\]\n\nI sense that Imagawa’s motivations are stoked by some inner fire, but she also has a competitive drive with fellow operatives. The debrief reports indicate as much. \\[…\\] Imagawa does appear to be uncustomarily impatient with Specialist Grace “Dokkaebi” Nam, despite them often spending lab time together.\n\nThe dynamic surprises me because I can’t quite pin it down. When I asked, Imagawa said I was mistaken, and Dokkaebi seems not to notice or to care. I’ve read the reports and my hunch hovers over some joint training exercise with the GIGN. Imagawa may envy Nam’s easy self-assurance, which corresponds with records concerning Imagawa’s younger sister. Still, I’d like to explore this further. They aren’t necessarily at loggerheads, but it may affect future operations in some way we can’t foresee if I can’t determine the source of the rupture in Imagawa’s calm.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1TSA4pMR58vgfrEai69REl/f82b1eba6694b4aa77259d3d0f dget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "X-Kairos", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1QSzVxpGhswXix3vn8XGKj/c4f64fa0895bdaf164448e3ae49950a0/X-Kairos.png", "imageLocal": "img/loadout/X-Kairos.png"}], "iconLocal": "img/operators/hibana_icon.png", "imageLocal": "img/operators/hibana_render.png"}, {"slug": "iana", "name": "Iana", "realName": "Nienke Meijer", "side": true, "isAttacker": true, "squad": ["ghosteyes"], "faction": "REU", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["front-line", "intel"], "ability": {"id": "53ojc8QIC7swrS0flQo2bC", "ccid-m": "53ojc8QIC7swrS0flQo2bC", "ccid-l": "msHzZZUqC8B6UQecImT90", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The Gemini Replicator is a remotely-controlled holographic copy of Iana. It can move and produces sound like she would, but it cannot shoot, melee or use secondary gadgets. It has a time limit, or it can be exited at any time. There is always a cooldown between two uses, which is longer if it’s destroyed.\n\nThe Replicator is all about fooling Iana’s opponents and collecting information. During its deployment, she can find her opponents and cause confusion to her heart’s content. If the Gemini is spotted and destroyed, it can help Iana deduce the threat’s location, but it will buy her opponents a few precious seconds to reposition.\n", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "e9346c9f-99c9-43ce-8a34-f75b14c9feaf", "buttonNumber": 1, "id": "5tAQSkivlLTNQadJLIOXV7", "ccid-m": "5tAQSkivlLTNQadJLIOXV7", "ccid-l": "4holLU18cNcNFeMFOYVNRX", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4PFjj9dtbO18r5MzEvUmkw/c8998802f9a234d737c57e2f9562cec9/r6s-operator-video-ability-iana.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "Iana : unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5dwRdYmg4M9CWvpV0aBZKe/88eb494cbbb74a9fd974131703d7e5a9/r6s-operator-video-ability-iana.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "August 27th (Age 35)", "placeOfBirth": "Katwijk, the Netherlands", "biography": "### Biography\n\n*\"All systems are complementary, if you know how to connect them.”*\n\nMeijer’s mother was lead engineer on the Huygens Atmospheric Structure Instrument that landed on Titan. Encouraged to reach for the stars from an early age, she studied Aerospace Engineering with a view toward becoming a fighter pilot. Unfortunately, her albinism meant she had compromised retina and her application was refused. She changed her focus to systems engineering, developing contact lenses that overcorrected her genetic deficit while integrating a state-of-the-art AR overlay.\n\nIt was a collaboration during her doctorate that gave Meijer the first taste of where she longed to be. Returning from the International Space Station only fuelled her desire to explore the farthest reaches of the cosmos, no matter the cost. She pioneered topographical mapping software that allows her to project a real-time, virtual copy of herself to anywhere visible by satellite or drone. It was this technology which caught the eye of Elena “Mira” Álvarez, and subsequently Six.\n\n### Psychological report\n\n\"The first time I met Specialist Nienke “Iana” Meijer she told me that the silver spoon I use to stir my tea has more in common with the nails that hold my chair together than the flatware of kings. She suggested a gold spoon for a less metallic aftertaste, but upon seeing me add sugar she amended it to zinc or copper. Marvellous. Her reductionist and frank approach is sure to challenge her fellow operators! \\[…\\]\n\nHer face lights up when she tells the story of watching the landing on Titan with her mom, or of her precious few days on the International Space Station. It’s clear these events triggered a growing impatience to go further and see more. Had she been born 200 years earlier, she would have been one of the intrepid souls mapping every corner of our tiny blue marble, but as it is she’s had to settle for distant and less familiar worlds. \\[…\\]\n\nReading Meijer’s file, it’s apparent that she succeeds through sheer intellect, resolve, and fearlessness. Yet cocooned within her collaborative and outgoing exterior is a fragile core she keeps guarded and private. Growing up albino wasn’t an easy proposition, regardless of how outwardly tolerant society may seem. There was social stigma and childish name-calling, but these hardships fostered self-determination and self-assurance. Alone, she is a like a raging river: Hell-bent on overcoming any obstacle that blocks her way, regardless of the personal cost. \\[…\\]\n\nShe was eager to share her experiences and knowledge, and to grow within a very different sort of team than is her natural habitat. Especially thrilling is her ability to analyze a myriad of scenarios and to create discreet aspects of herself to tackle each of them simultaneously. Often, those who multitask have reduced outcomes in all areas, but here, also, Meijer is the exception. \\[…\\]\n\nI have every confidence that she will make an excellent addition to Rainbow. However, much like Specialists Eliza “Ash” Cohen and Elena “Mira” Álvarez, it will be paramount to ensure that she synergizes with her team, rather than struggling alone to cross-purposes.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow\n", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6deSi1vse5iJTkErFksrGq/75bf1038e9698b6b2be75aa0493b092d/Y5S1_BADGE_Iana_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6Fiy7YExswMn1Cf13GUU9t/7bb697bf32c0d79c2852b354e3045fff/r6s-operator-iana.png", "loadout": [{"name": "ARX200", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6VgkPBsr1WApI3rWc9kcM0/b18b8e25f3e951e8e722213f2ee59eb0/ARX200.png", "imageLocal": "img/loadout/ARX200.png"}, {"name": "G36C", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2SZoqSXKoNPvZFIJsFsDE5/cb109885bf19c8697abf832f10cfd9a6/G36C.png", "imageLocal": "img/loadout/G36C.png"}, {"name": "Gonne-6", "slot": "secondary", "subtype": "Hand Cannon", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/23AlSVw8MwI1y3ZakEfqgW/c4561ae6e8da8db2627a146b8b55ee6c/GONNE-6_HUD_Icon__1_.png", "imageLocal": "img/loadout/Gonne-6.png"}, {"name": "Mk1 9mm", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3tWoNeF3jQYs3w4EOydQYs/434409c96693df1fd3e969d778e70795/Mk1_9mm_BI.png", "imageLocal": "img/loadout/Mk1 9mm.png"}, {"name": "Impact EMP Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7izurbA5jDmnsmdeBdgKZO/29bca81243dda4084a92521ac0c03592/R6S-EMP-Impact-grenade.png", "imageLocal": "img/loadout/Impact EMP Grenade.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c463684
