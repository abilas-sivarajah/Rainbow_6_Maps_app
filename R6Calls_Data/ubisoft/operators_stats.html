evlar\n- Provides protection against small-arms fire and close combat attacks", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "0a5b67b5-a7c4-4e9b-8599-1b317a087705", "buttonNumber": 1, "id": "6oC0uievU7y10wF2vcGc8I", "ccid-m": "6oC0uievU7y10wF2vcGc8I", "ccid-l": "zTIWwodyRVjIXyinXJen1", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7hp0B7pHFlaGNoUFdHOP1F/7bf3aa6da598773ce5ee89a1832c041c/operator-video-small-montagne.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "uSr2c6UpXWM", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "October 11th (Age 48)", "placeOfBirth": "Bordeaux, France", "biography": "### Biography\n“Every conflict is an iteration upon the last. Every scar, a victory.”\n\nTouré began his career in law enforcement as a uniformed police officer with the National Gendarmerie. They used his imposing form whenever there was a need to show a strong police presence, earning him a spot in the Mobile Gendarmerie where the focus was on crowd control as well as military and counter-terrorism patrol missions. Touré’s push for extensive training provided him with a broad skillset and earned him a position in the GIGN. Though he’s best utilized for his breaching techniques, Touré also has training in combat engineering and reconnaissance. When not deployed with Rainbow, Touré is an instructor at GIGN.\n\n### Psychological report\nSpecialist Gilles “Montagne” Touré’s imposing presence, along with his unwavering gaze, is impressive and (as a tactic) I can see how it can be unsettling. He’s a man of few words, even among his friends. I chose to visit him at one of the GIGN Training Centers so that he’d be more comfortable talking. \\[…\\] Observing Touré with his trainees gave me a better sense of him. In this capacity he was accessible, fair, and even gregarious. \\[…\\]\n\nWe started by discussing his role as an instructor. Touré was excited that Rainbow continues to evolve and is proud to be a part of it. He told me there’s always a lot to learn from his peers and that, lately, he’s been trying to stretch beyond his comfort zone. He has certainly taken the lead on including more virtual simulation in our training. He’s hoping to incorporate the unique skills of operators such as Specialist Grace “Dokkaebi” Nam in his next sessions. \\[…\\]\n\nTouré has a naturally protective nature. His choice to enter law enforcement speaks more to that than his family’s military history. The middle of four – his two brothers are also in the military – Touré said that the family raised them to be protectors. Their parents recounted stories of various ancestors who fought for what was right. \\[…\\] He believes that education is the solution to many of the world’s problems. His sister finished her police training but switched to teaching when she felt that was where she could do the most good.\n\nBecause Touré has an understated confidence, I was surprised when he expressed doubt about his role in Rainbow. Many of our operators are exceptionally skilled with languages. Touré isn’t. None of the reports suggest this is an issue, but even a perceived weakness can become debilitating. I encouraged him to select one – only one – language to focus on studying, and asked some of the other specialists to make an effort to include him in their conversations. If all goes well, it’ll feel less like he’s being tested and more like he’s being folded into the group.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7qWONT0mrNYtUZVTVVT8Yj/e0da552d6bb6548ddf74cf4cc44d75c5/Y0R6_BADGE_Montagne_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/37v1tD14BQ9A59vqXO7I9p/ba1d199bf7697f5ede61b93cdec60686/R6-operator-montagne.png", "loadout": [{"name": "LE ROC SHIELD", "slot": "primary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1bmXJOakdA6SOrGxBKA70T/1e489e366d6db287f475963df2040d3d/Extendable-Shield.png", "imageLocal": "img/loadout/LE ROC SHIELD.png"}, {"name": "P9", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6Fd1cl17KA0CtgodEiiY6v/d0f145ea72f2aacbd04260ba7d8f1c74/P9.png", "imageLocal": "img/loadout/P9.png"}, {"name": "LFP586", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1zc7UtdBfCZakwbiYqBvSz/1fd3f1584de38ca7c9315d498f094276/LFP586.png", "imageLocal": "img/loadout/LFP586.png"}, {"name": "HARD BREACH CHARGE", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3OvnVPWY1UyrDE913kU0a1/eae4b2a1584234ea2ff4ad6481239f3b/SecondaryBreacher.png", "imageLocal": "img/loadout/HARD BREACH CHARGE.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c4636845a04478432c48be8c29aee/Smoke_Grenade.png", "imageLocal": "img/loadout/Smoke Grenade.png"}, {"name": "LE ROC SHIELD", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1bmXJOakdA6SOrGxBKA70T/1e489e366d6db287f475963df2040d3d/Extendable-Shield.png", "imageLocal": "img/loadout/LE ROC SHIELD.png"}, {"name": "Impact EMP Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7izurbA5jDmnsmdeBdgKZO/29bca81243dda4084a92521ac0c03592/R6S-EMP-Impact-grenade.png", "imageLocal": "img/loadout/Impact EMP Grenade.png"}], "iconLocal": "img/operators/montagne_icon.png", "imageLocal": "img/operators/montagne_render.png"}, {"slug": "mozzie", "name": "Mozzie", "realName": "Max Goose", "side": false, "isAttacker": false, "squad": ["ghosteyes"], "faction": "SASR", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["anti-gadget", "intel"], "ability": {"id": "7gPX3J4epyDLze4kuRuoE0", "ccid-m": "7gPX3J4epyDLze4kuRuoE0", "ccid-l": "HSOAwcOPCHmO39UQOll0Q", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Mozzie’s launcher, Pests, are tiny 4-legged bots that can be used to target a single drone, or deployed into an area to prevent access by a drone. When launched, the Pest latches onto the nearest enemy drone and obscures its camera. It then initiates an override sequence to hack the drone and give control to Mozzie. Counter-intelligence is enabled with no risk of a counter hack. Single-use only, Pests self-destruct by dissolving into thin air once their target is in Mozzie’s control.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "6c90a9bf-a051-4d30-8a71-466abee2da47", "buttonNumber": 1, "id": "4lGAULzE3ZRJU0YP7FL0A2", "ccid-m": "4lGAULzE3ZRJU0YP7FL0A2", "ccid-l": "JQxvv6PtFRkFe9m9KRI1o", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/62T9CNmz9YPCNT9w9IuGfk/97c031af18ddd81f78133c83c2cbceb7/operator-video-ability-mozzie.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2DulpZTbf5wwXoMgT3IH35/82b4a6f074ede5233675a73c0c230164/operator-video-ability-mozzie.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "February 15th (Age 35)", "placeOfBirth": "Portland, Australia", "biography": "### Biography\n“C’mon, I'm not here to fuck spiders.” \n\nRight after Year 10, Max Goose applied to enter the Australian Defence Force Academy, later working in Combat & Security. He joined an infantry regiment that incorporated dirt bikes and all-terrain vehicles in their reconnaissance operations. Goose excelled in land navigation and became the two-wheeler expert in raids, scouting, and convoy operations. \n\nFollowing Operation Catalyst, he was handpicked to join the Special Air Service Regiment (SASR), so long as he passed selection and refrained from talking back. His specialized off-road skillsets and quick thinking were highly prized, even though his driving style appeared reckless. He deployed to Operation Slipper and served until the operation’s conclusion. He later received the National Emergency Medal for saving firefighters during the Esperance bushfires. \n\nGoose is a calculated daredevil who loves testing upcoming military stealth bikes, but he says there’s no bigger honor than being asked to join Rainbow Six.\n\n### Psychological report\nOn their own, Specialist Max \"Mozzie\" Goose and Specialist Tori “Gridlock” Tallyo Fairous perform exceedingly well, but together, they pull off some amazing, even hare-brained stunts sure to make the sternest of commanders crack a smile… when they succeed, of course. Just like their operation at the Esperance bushfires. \\[…\\] These two specialists create this remarkable balance seldom seen between two operators. I’m curious to see if they would still help each other as opponents, or if duty will take precedence over their friendship. \\[…\\]\n \nHe’s a speed demon, not just on his bike, but how he processes information. By the time others are done parsing a problem, he has already considered the feasibility of a particular course of action, having weighed all the pros and cons, and he’s already kick-started his bike. Those seconds he’s saving are precious. All the while, he’s smirking beneath that moustache, and there’s this shine to his eyes that makes everyone uneasy. I believe he’s a troublemaker in spirit, but a real showman at heart. \\[…\\]\n\nGoose grew up as the middle sibling in his family and I do believe he had to put extra effort to be heard or noticed, which explains the showman side of his personality. He jokes that his parents paid more attention to him the moment he engaged in extreme sports like freestyle mountain biking, dune buggy racing, and the occasional hang gliding. He told me that the moment he told his mum he did skydiving with dirt bikes, she completely lost it. \\[…\\]\n\nI’ve had the… “pleasure” of hearing the extent of his profanity, though like many behavioural psychologists, I’ve seen enough evidence to support the theory that swearing is good for you… that it’s not maladaptive. \\[…\\] I’ve even seen Specialist Goose use humour to cover pain, though I wonder if he uses vulgarity to make up for his physical stature, likely to appear more intimidating. So far, all my observations indicate that he becomes quite furious when his height is made all the more obvious.\n\n-- Dr. Harishva Pandey", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/15hUu2PsypX2c1LIJFQNUT/8538c52057420dbf3995cf3117b155c5/Y4S1_BADGE_Mozzie_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/22Gyn0Z317IfLRGwHPBlmL/1e9e9f041403e8846824337cb53600b8/r6-operator-mozzie_343388.png", "loadout": [{"name": "Commando 9", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4P9dpUph5w3MSsLNnW6be/04baba24990fcb75a9c0bcfd01b7d190/Commando_9.png", "imageLocal": "img/loadout/Commando 9.png"}, {"name": "P10 RONI", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7K86OBjL3zmYWt0ZvUcCLj/16a947334e39f27da177d787773593e4/r6-operator-weapon-smg-p10roni.png", "imageLocal": "img/loadout/P10 RONI.png"}, {"name": "SDP 9mm", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/Tgsdyz3XEqmgUYi9aZZgb/6755f4da7af7a7179ffab92acf8d477e/SDP_9mm.png", "imageLocal": "img/loadout/SDP 9mm.png"}, {"name": "Super Shorty", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Dq8LDmIxAveRqXM17orUW/8169927dba6976cee92cc53c7b0960aa/r6-operator-weapon-sa-supershorty.png", "imageLocal": "img/loadout/Super Shorty.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "Nitro Cell", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4pBSTw9U6l9GRnT12G6Xln/e0991bc03b48d217f510af8b611c8828/Nitro_Cell.png", "imageLocal": "img/loadout/Nitro Cell.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Pest Launcher", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5L0fFKVOwozKMcmJoenfef/56e4efdf77363556b35a76fd4e0e60f6/Pest-Launcher.png", "imageLocal": "img/loadout/Pest Launcher.png"}], "iconLocal": "img/operators/mozzie_icon.png", "imageLocal": "img/operators/mozzie_render.png"}, {"slug": "mute", "name": "Mute", "realName": "Mark R. Chandar", "side": false, "isAttacker": false, "squad": ["viperstrike"], "faction": "SAS", "speed": 1, "armor": 3, "health": 125, "difficulty": 1, "roles": ["anti-gadget", "crowd-control", "starter-operators"], "ability": {"id": "3j1IxwpPB8RZtfSyeQbOnY", "ccid-m": "3j1IxwpPB8RZtfSyeQbOnY", "ccid-l": "7B0RIKOnjvAd5Y4erxJ25L", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "- Collapsible antennas\n- Device can be planted on floors\n- Digital display\n- Activation levers", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "b4361f16-53c6-4c9a-81ab-f4702d7f487e", "buttonNumber": 1, "id": "1aEG4qYkfidSFWf2ONBrpM", "ccid-m": "1aEG4qYkfidSFWf2ONBrpM", "ccid-l": "48rcVE7SioL0QsTQnecqNC", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/23dXbBssgkYq2UIHRZWnd2/8ba39985bee426b77973a1b1501a8b0f/operator-video-small-mute.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "JAljvCbVM1g", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2SLr6HfhWSZv9l6k0rx6tJ/5aaf3e4577e3f477f38f39f9aa2d46b5/operator-video-small-mute.mp4", "description": null, "videoControls": false}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "October 11th (Age 25)", "placeOfBirth": "York, England", "biography": "### Biography\n“People think my codename is because I don’t like to talk. Maybe I just don’t like you.”\n\nAn exceptional and well-rounded student, Chandar was one of the youngest accepted into the University of Cambridge. He majored in electronics and computer engineering, completing an internship at a prestigious tech company where he contributed to the design and function of security system prototypes. His ingenuity caught the attention of Britain’s national security office, the Government Communications Headquarters (GCHQ). Having demonstrated acuity in code breaking, Chandar became an intelligence officer within the signals intelligence (SIGINT) unit. He continues to contribute to the applied technical research team and has recently expanded his field of study to include learning Korean.\n\n### Psychological report\nIt may not be immediately clear why Specialist Mark Chandar’s codename is Mute. While he dislikes small talk, he isn’t particularly reserved and in fact can be brash – a trait that is off-putting to some. Whatever social agitation he experiences, there are some indications that he’s unable to shake it off. I suspect it’s because he’s impatient. He needs to appreciate that there are different approaches to solving a problem. Interestingly, Specialist Mike “Thatcher” Baker seems begrudgingly tolerant of him and has been known to speak up in Chandar’s defense. \\[…\\]\n\nChandar tends to gravitate to certain personalities. In particular, I’ve noticed that he’s been interacting with Specialist Timur “Glaz” Glazkov lately. Because Chandar revels in deconstructing equipment to create something new, I think he’s drawn to abstract thinkers and Glazkov has a similar talent for seeing complex situations in a unique way. \\[…\\]\n\nGiven his background in information security, Chandar understands secrecy and seems uncomfortable with expressing himself or with personal questions. In his field, and here at Rainbow, information is a critical – life and death – commodity. So of course, I respect this but only up to a limit. I had to find another way in and we managed to find common ground in discussing History, of all things! \n\nFor someone so focused on science he surprised me. His hometown of York is one of the most historic cities in England and it’s a city I adore. He described in wonderful detail how he had to pass the Gothic church on his walk to school. He liked to lean back and look up at the bell tower for so long that it made him wobbly. \\[…\\] My meeting with Chandar reminded me that we here at Rainbow tend to focus on how our operators excel in the STEM fields, but there is great value in our operators having passion and interests across a broad spectrum of studies. Chandar demonstrates why he’s much more than someone who is used to being the smartest person in the room. Despite his young age, I’m certain he has something to teach the others.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3exeHnxH1tmUmQTequWRKa/e1b6c6f057eb24722dd7860af0276316/Y0R6_BADGE_Mute_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3gItFrDP0bBZsDXPdPp8ni/4314eb876028a87ae7fb20cc3215d3f6/R6-operator-mute.png", "loadout": [{"name": "MP5K", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1pk8nOI7ybQjYOSI4fuzOm/fcd78df0f729be545e75c09aae85c360/MP5K.png", "imageLocal": "img/loadout/MP5K.png"}, {"name": "M590A1", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2zRHmgqENNiZqXQxC9Rsbj/e6542407c642f9b7c5a4546afb6db30a/M590A1.png", "imageLocal": "img/loadout/M590A1.png"}, {"name": "P226 Mk 25", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/RTQvPQcywlRwUS1FjIKCX/6fc72fee2191c2e723276bc10ae4114e/P226_Mk_25.png", "imageLocal": "img/loadout/P226 Mk 25.png"}, {"name": "SMG-11", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3WExw7Kepz9uAiWAbWW457/875fc631a3cf9fcc2849d9db2989cbcd/SMG-11.png", "imageLocal": "img/loadout/SMG-11.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "Nitro Cell", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4pBSTw9U6l9GRnT12G6Xln/e0991bc03b48d217f510af8b611c8828/Nitro_Cell.png", "imageLocal": "img/loadout/Nitro Cell.png"}, {"name": "Signal Disruptor", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1M5fsUELbaAzImzMte2ESa/9de588693ec317c87ef1a2021bd43b86/Signal-Disruptor.png", "imageLocal": "img/loadout/Signal Disruptor.png"}], "iconLocal": "img/operators/mute_icon.png", "imageLocal": "img/operators/mute_render.png"}, {"slug": "nokk", "name": "NØKK", "realName": "[REDACTED]", "side": true, "isAttacker": true, "squad": ["ghosteyes"], "faction": "JAEGER CORPS", "speed": 2, "armor": 2, "health": 110, "difficulty": 3, "roles": ["front-line", "map-control"], "ability": {"id": "3tY8VVlqVRnKg2wh6RRDTi", "ccid-m": "3tY8VVlqVRnKg2wh6RRDTi", "ccid-l": "5uBFq1yjgIUtBLfRU4tlgh", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The HEL is a glove attachment, which, when activated, reduces her ambient noise output and hides her image from the opponents’ observation tools. Drones, Bulletproof Cameras, Evil Eyes and more will thus be unable to register Nøkk’s presence as she roams through the map, unseen. Her footsteps will be silenced as she stalks opposing operators, unheard. Roaming will be more risky than ever for Defenders, as Nøkk could be hiding behind every corner or worse, sneaking up right behind them.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "eeb3564d-9ff6-4f62-adc9-df849fd2c414", "buttonNumber": 1, "id": "40IOkKym62rJZuX3nuUEig", "ccid-m": "40IOkKym62rJZuX3nuUEig", "ccid-l": "2vZx2diaBwuWJsDPxyVq7d", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/61qeOaEWdVeU7C9RAzrl7Q/e01b0ae7106e946eacc16236d2c8c6fd/operator-video-ability-nokk.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3NddXWdwEF6sYub9Pt63Gq/f69772f14b6f8dc24f9a45e8fad2e0a6/operator-video-ability-nokk.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "[REDACTED]", "placeOfBirth": "[REDACTED]", "biography": "### Biography\n“The only thing I feel when I pull the trigger is recoil.”\n\nFor reasons of National Security and currently active missions, Nøkk’s records are sealed at NATO Confidential security clearance, but her files have been released to Six. Nøkk enlisted at the Army NCO School in Sønderborg, then enrolled at the Royal Danish Military Academy where she graduated at the rank of First Lieutenant. With four deployments under her belt, Nøkk underwent additional special operations training, earning her Jægerkorpset maroon beret with skills in covert ops, combat search and rescue, direct action, special recon, arctic warfare, and advanced breaching. Nøkk served in Afghanistan and Iraq, often alone in deep undercover behind enemy lines. She received commendations for eliminating hostile insurgents in surgical strikes and was responsible for uncovering Erik “Maverick” Thorn’s location, forwarding that intel to the Unit.\n\nNøkk keeps her identity hidden from all but her fellow operators. NATO’s O&P division recommended Nøkk for Rainbow as one of its deep cover specialists.\n\n### Psychological report\nWhen they looped me in on Nøkk’s real identity, I cracked open her secret dossier with schoolboy glee. I love a good mystery and I was not disappointed. Nøkk’s real identity has been a prickly issue given the potential scandal should it ever be made public. Frankly, had I not known who Nøkk’s father was, I wouldn’t have noticed the family resemblance. But it smacks you in the face when you know the truth.\n\nI wondered how Nøkk felt about all this and how it influenced her upbringing. Nøkk tried to dismiss it as one of the realities of the job, but eventually I learned enough to start painting a portrait. Nøkk’s mother raised her, and the pair are close to the point of being best friends. It’s almost tribal how protective they are of each other. Nøkk knew about her father and his family, but it took a while before the family knew about Nøkk. They tried to give Nøkk a better life, but without bringing her into the fold out of fear of courting a major scandal for the family.  \n\nNøkk is fiercely loyal to her mother, so I found it surprising Nøkk was loyal to her father out of respect for the family name itself. You’d think there’d be some resentment there, but Nøkk is comfortable quietly serving Queen and Country and everything else that falls under the umbrella; her Darwinist outlook isn’t rooted in her own safety, but rather the betterment of the soldiers of her unit and her country. \n\nNøkk’s ability to keep a secret and maintain a façade is what makes her a highly capable undercover operative but she is involved in an active mission. Fortunately, Nøkk’s cover identity is currently “in jail,” building up credibility while giving us an incredible opportunity to work with someone of Alibi’s and Bandit’s caliber. I have no doubt Nøkk is a strong fit for Rainbow, and I hope we can use her to the full extent of her stay with us.\n\n-- Dr. Harishva Pandey", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2qfSHHTdCRVhx9EWycVDNr/9e361e73fb91e571f7470de21edf5c7a/Y4S2_BADGE_Nokk_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5X4tMHTglYiy22CYHvvn6b/74f36f4695c6f1eb79533be5e9f97002/R6-operator-nokk.png", "loadout": [{"name": "FMG-9", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/0oneJNsBR06QjuowxwtHG/bd3b391c6eec2bd615f2ed83197a13ac/FMG-9.png", "imageLocal": "img/loadout/FMG-9.png"}, {"name": "SIX12 SD", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1GTua079Xbtkpjhx96sRsW/079ed1a71a0d12b5e48e1b0d40b87110/SIX12_SD.png", "imageLocal": "img/loadout/SIX12 SD.png"}, {"name": "PMR90A2", "slot": "primary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/g1CRNF5Bg8mYPXY8qxsTt/a3fd65c5715d31c8afeb9fad9c478be5/PMR90A2.png", "imageLocal": "img/loadout/PMR90A2.png"}, {"name": "5.7 USG", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/tkYcSAJSe5yGkeUhzZqBO/e81feb86df4a7eb6951052bec26b6ed7/5.7_USG.png", "imageLocal": "img/loadout/5.7 USG.png"}, {"name": "D-50", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6mMQRDsrComRFa7bC6cNkG/8cd17e545e3d28dcc11a040d000cfa16/D-50.png", "imageLocal": "img/loadout/D-50.png"}, {"name": "HARD BREACH CHARGE", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3OvnVPWY1UyrDE913kU0a1/eae4b2a1584234ea2ff4ad6481239f3b/SecondaryBreacher.png", "imageLocal": "img/loadout/HARD BREACH CHARGE.png"}, {"name": "Frag Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4GZsPHbm9H0k5EWz7TMkwO/33b9007bc6ee03dab15cfa15eb69e096/Frag_Grenade.png", "imageLocal": "img/loadout/Frag Grenade.png"}, {"name": "HEL Presence Reduction", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/57miqbOn8xWBh7ne7za3CV/35364108d49380a0ed33998f970e104f/HEL-Presence-Reduction.png", "imageLocal": "img/loadout/HEL Presence Reduction.png"}, {"name": "Impact EMP Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7izurbA5jDmnsmdeBdgKZO/29bca81243dda4084a92521ac0c03592/R6S-EMP-Impact-grenade.png", "imageLocal": "img/loadout/Impact EMP Grenade.png"}], "iconLocal": "img/operators/nokk_icon.png", "imageLocal": "img/operators/nokk_render.png"}, {"slug": "nomad", "name": "Nomad", "realName": "Sanaa El Maktoub", "side": true, "isAttacker": true, "squad": ["wolfguard"], "faction": "GIGR", "speed": 2, "armor": 2, "health": 110, "difficulty": 3, "roles": ["front-line", "map-control"], "ability": {"id": "2Ezts2QSt9phPbyqnWtFMa", "ccid-m": "2Ezts2QSt9phPbyqnWtFMa", "ccid-l": "5shHu5qG87AFJyMdiDvg6", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Nomad’s custom rifle attachment allows her to launch Airjab repulsion grenades. They can stick to a surface and will detonate when an enemy is within range. Nomad enters the field with three Airjab grenades. These pushback devices are non-lethal but they disorient those affected.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "1ca6d916-9324-413f-b98e-caaa92c8b494", "buttonNumber": 1, "id": "1rr0Jb3R5BnKL6aaylaEMj", "ccid-m": "1rr0Jb3R5BnKL6aaylaEMj", "ccid-l": "6bQhC4FTtYj4Vjl15GixyM", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6BsdZCPR0tnAaagHLtNCHp/f6be7692d305041737dc98d73e31c380/operator-video-ability-nomad.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1kcMQ6vWHj3oqVSCHTAhkF/9a7b1bd271c4d1130165e7e0157370f3/operator-video-ability-nomad.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "July 27th (Age 39)", "placeOfBirth": "Marrakesh, Morocco", "biography": "### Biography\n“Deep down in my veins, I knew I had to travel. Now that I have, I’m certain I haven’t travelled enough.” \n\nBrought up in a wealthy Moroccan family, Sanaa El Maktoub travelled considerably at a young age, visiting Europe and North Africa, and dreaming about braving remote regions. She enlisted in the military at 19 and later joined the Groupe d'Intervention de La Gendarmerie Royale (GIGR) after graduating from the legendary Fortress. She served 4 tours with the Mountain Infantry Battalion and took part in Flintlock exercises and joint missions with Trans-Saharan Counterterrorism Initiative partners. She became her unit’s expert on environmental operations.\n\nBetween tours, she undertakes solo expeditions. El Maktoub is among the few explorers who can cross the Sahara, climb up the Alps, trek through Asia’s rainforests, march along the Arctic Circle… and still return to her unit in operational shape. Rain or shine, desert or polar climates, she can walk through it all. Perceptive and resourceful, she’s an expert survivalist who sketches out her trips in her notebook.\n\n### Psychological report\nSpecialist Sanaa El Maktoub is constantly on the move, thus her codename, “Nomad.” The only time she stands still is when she’s sketching in her notebook, and following the recovery of her fingers no less. \\[…\\] I think her privileged upbringing instilled her with a private need to succeed, pushing her to conquer mountains and terrains her parents never faced. She likely got accused of being soft in her childhood, and she’s set out ever since to disprove it. In her it’s created a world-class extreme environment expert whose reputation precedes her. \\[…\\]\n\nSpecialist El Maktoub possesses unmatched resilience to survive the elements, and her endurance is famous within military circles. In fact, the first time I encountered Specialist El Maktoub’s name was through a research paper about military fitness assessments. \\[…\\]\n\nI can see why she’s invaluable to GIGR. She claims that anyone can develop her survivalist and planning skills with experience, but she’s being genuinely modest. Bragging seems antithetical to her and I think that it somehow diminishes her own sense of accomplishment when she has to talk about it. She certainly doesn’t do things the easy way… her drawing are her photographs. Truth be told, I’m envious of her spirit. \\[…\\]\n\nFirst deployed to the Fortress at the start of her military career, she did extensive training under the leadership of Specialist Jalal El Fassi. It would be interesting to see them working together again under different circumstances. \\[…\\]\n\nDuring her expeditions, she encountered a number of secluded cultures, like the Maasai in Kenya and the Nenets of Siberia. It’s resulted in self-taught skills in cultural diplomacy. While Rainbow Six recruits specialists from around the world, I’d guess no one else has seen as much of the world on their own as she has. And still, she wants to become the first woman to cross Antarctica, alone on foot. I have no doubt she can accomplish that, but I hope it doesn’t cost her more appendages. I privately worry that she considers such injuries a badge of honor and proof that she isn’t some spoiled rich girl.\n\n-- Dr. Harishva Pandey", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/UxfU1gJDoZGDrzT3iBsIp/b1aa522cc08e4631b9a857b52afa4f99/Y3S4_BADGE_Nomad_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1Fue2SumRQEs8Geb2CpWsX/913fbcda744ab9dc719a1440047e4585/R6-operator-nomad.png", "loadout": [{"name": "AK-74M", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1j5HiQP8aFphTe65fqDdg0/23eecb5c603c5ba9f59fc6cbc5e4a531/AK-74M.png", "imageLocal": "img/loadout/AK-74M.png"}, {"name": "ARX200", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6VgkPBsr1WApI3rWc9kcM0/b18b8e25f3e951e8e722213f2ee59eb0/ARX200.png", "imageLocal": "img/loadout/ARX200.png"}, {"name": "PRB92", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/dl28J1HsE7mzhj66pmd5D/b8d8fc48d2dde13154047de94abbd8ca/PRB92.png", "imageLocal": "img/loadout/PRB92.png"}, {"name": ".44 MAG SEMI-AUTO", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6W3Jz0YcQzbZ6BOPr7VVel/4c67f342964132a652f7d5821e887050/.44_Mag_Semi-Auto.png", "imageLocal": "img/loadout/.44 MAG SEMI-AUTO.png"}, {"name": "Breach Charge", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1OgTMhyF1FBsSAo4njk26m/99b7a971f81b9195b3c3536b51d52893/R6S_Breach_charge.png", "imageLocal": "img/loadout/Breach Charge.png"}, {"name": "Stun Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3XnK8s1iQJQu5cfr6UyQfK/429480b96d6d6d6b830c32c75d2608f5/Stun_Grenade.png", "imageLocal": "img/loadout/Stun Grenade.png"}, {"name": "Airjab Launcher", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6d0LN1QWzviEkcYu3mTn6v/e49511a479756f71224f14225ad9cbd8/Airjab-Launcher.png", "imageLocal": "img/loadout/Airjab Launcher.png"}], "iconLocal": "img/operators/nomad_icon.png", "imageLocal": "img/operators/nomad_render.png"}, {"slug": "oryx", "name": "Oryx", "realName": "Saif Al Hadid", "side": false, "isAttacker": false, "squad": ["redhammer"], "faction": "Unaffiliated", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["support"], "ability": {"id": "4SAKsi86TtHV390qPJ0MLz", "ccid-m": "4SAKsi86TtHV390qPJ0MLz", "ccid-l": "2Ml5ntoOfIeBFLqC9tscwZ", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The Remah Dash speed allows him to roam efficiently and cover short distances with unprecedented swiftness. It can also be used to knock down opponents and dash through breakable walls, creating a wide opening. Be careful of the cost, though, as he loses health every time the Remah Dash is used for breaching.\n\nAdditionally, Oryx has the unique ability to interact with broken hatches. He can climb straight through for a quick rotation, or he can hang on the edge to peek or wait for the perfect moment to go up. As long as he’s hanging, he can also opt to drop down if the climb seems too dangerous.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "d6b73b54-cb02-4ff0-afa0-75d33bcabcc9", "buttonNumber": 1, "id": "dRJRaz38ugcrwgUtrIT4v", "ccid-m": "dRJRaz38ugcrwgUtrIT4v", "ccid-l": "13OB22Mendlt6NoRRcASUd", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3VqNC3mg3uRqXOqax2a52A/438a8f9c68aee83c3b5fa318b3039c1d/r6s-operator-video-ability-oryx.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "oryx : unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Lv7Hm84Cv2zAATm0qxKl6/6666f80f6b9240291d9257de0f831c47/r6s-operator-video-ability-oryx.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "July 3rd (Age 45)", "placeOfBirth": "Azraq, Jordan", "biography": "### Biography\n\n*“Sometimes, the only way out is through.”*\n\nLittle is known about Al Hadid’s life. He grew up in a small town adjacent to an air force base, and by all accounts had a normal childhood up until he disappeared from international records for more than fifteen years. He eventually resurfaced in Jordan, but stayed only long enough to obtain a new passport. He learned wrestling in Istanbul, Muay Thai in Bangkok, tactical driving in Berlin, and precision marksmanship in Damascus, likely working for a paramilitary sponsor. Then he disappeared again.\n\nHe next showed up as a cadet at Jalal “Kaid” El Fassi’s Fortress. As the years passed, his role evolved, from recruit to steward to instructor. Now the unofficial second-in-command, Al Hadid maintains the Fortress during Kaid’s absences and acts as a trusted advisor whenever the two of them are together.\n\nRumors of Al Hadid’s ferocity abound, but remain uncorroborated by field reports and should be disregarded.\n\n### Psychological report\n\nSaif “Oryx” Al Hadid has lived an exceptional life. Torn from his family as a teenager, he was outside of Jordan – he won’t say where – when he was incarcerated. For over fifteen years he struggled for his freedom, moving between solitary confinement and different facilities. The rage he bears as a result of this inhumane treatment is something I have witnessed once, and hope to never see again. \\[…\\]\n\nMy first meeting with Al Hadid took place not in my own office, but in the well-appointed private sanctuary of Jalal “Kaid” El Fassi. He had told me stories of the warrior forged from raw iron, of his outstanding strength and resilience, but also of the weeks during which the man had sat, unmoving, in the scorching desert heat, waiting for Kaid to open the Fortress’ doors. \\[…\\] Though no outward mark remains of his transformation, it is clear Al Hadid is a man thoroughly changed.\n\nWe spoke of the ubiquitous cats of Morocco, of his trek, on foot, from Syria to the Atlas Mountains, and of poetry, for which he has a special fondness. \\[…\\] Despite his scars, Al Hadid does not dwell in the past. There is nothing for him there, he said. I wondered if his stoicism hid some deeper longing, but in our sessions since I have found no such indication. \\[…\\]\n\nAl Hadid’s phenomenal self-control puts my own efforts at mastery to shame. Even Specialist Yumiko “Hibana” Imagawa has commented on the utter calm he exudes. The difference between them is that he allows his control to waver at selected moments, in service of his larger goals. He has turned a crippling affliction into overwhelming strength. This is an extraordinary skill that I have encouraged him to share, when and where he will. \\[…\\]\n\nOther operators are making inroads with Al Hadid, but progress is slow. I suspect, like many subjected to the depths of human cruelty, trusting others will not come naturally. Disquieting though it is to admit, Rainbow may be the one place where he is amongst those who can best understand his past.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow\n\n", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7mLA8GY9ZKlUfDXrfo9Nek/e3dfd0759414f36866a8c80b61a67722/Y5S1_BADGE_Oryx_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3Ha2aY7zJrudEskszfFA3K/2f5d898ca145d4dd73d8ec4ece53b195/r6s-operator-oryx.png", "loadout": [{"name": "SPAS-12", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Hp6Fbss6uI59OT4nZNB6e/a4d09954803cb2580353cfa03e8c778b/SPAS-12.png", "imageLocal": "img/loadout/SPAS-12.png"}, {"name": "T-5 SMG", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1Ne8bvX8BdCALevWKMllQN/4baa3e79d323de134dd182e0272b9c3b/T-5_SMG.png", "imageLocal": "img/loadout/T-5 SMG.png"}, {"name": "Bailiff 410", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/N8FLbo4fsNyBe8msKgRhT/8f403dc0b58087bcafab786dd95ba33f/Bailiff_410.png", "imageLocal": "img/loadout/Bailiff 410.png"}, {"name": "Reaper MK2", "slot": "secondary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5RC060K72yG2OXMq43lgrv/83df616f6d4a2dde6293cc97449159eb/reaper-mk2.png", "imageLocal": "img/loadout/Reaper MK2.png"}, {"name": "USP40", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7FxemzWRtlpAhK9MyKp1Gp/817cc25b6b7c3575dc1ba53a6a8170a9/USP40.png", "imageLocal": "img/loadout/USP40.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "REMAH DASH", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3dM2B3qCdU0woydIbiy2xn/55aa99443002ad794d3f78dada26d035/r6s-operator-ability-oryx.png", "imageLocal": "img/loadout/REMAH DASH.png"}], "iconLocal": "img/operators/oryx_icon.png", "imageLocal": "img/operators/oryx_render.png"}, {"slug": "osa", "name": "Osa", "realName": "Anja Katarina Janković", "side": true, "isAttacker": true, "squad": ["nighthaven"], "faction": "Nighthaven", "speed": 1, "armor": 3, "health": 125, "difficulty": 2, "roles": ["support", "intel"], "ability": {"id": "3rgDABcQWG5zeKnDjQcGMN", "ccid-m": "3rgDABcQWG5zeKnDjQcGMN", "ccid-l": "3y2fp1MeLhd70YQIaJupeB", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The transparent and bulletproof Talon-8 Shield can be carried by Osa or deployed on floors or window frames, giving her a protective line of sight while she formulates an attack strategy.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "0dec60b0-f104-4e5f-ada9-8b49458a0a25", "buttonNumber": 1, "id": "4qbvkR7NxQI9FyjXj9ciJe", "ccid-m": "4qbvkR7NxQI9FyjXj9ciJe", "ccid-l": "5kGPhuCGkcaQlIA4iFpGN3", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/lIxFU0iz4RNgSsLlwkuoy/8abdee0f1a6fb3bcab59e916bc6fb287/Y6S3-Reveal-Osa.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "osa : unique abilities", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5cGk3DSckaCIiUx6kBuyJV/9fdd5a3528c4691ecc4a75529e6286a1/Y6S3-Reveal-Osa.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "April 29th (Age 27)", "placeOfBirth": "Split, Croatia", "biography": "### Biography\n\n*“The best ideas come to me when I exclude rules and guidelines from the equation.”*\n\nBorn to the Janković family, owners of European toy stores, Anja traveled with her parents constantly, so she never felt stable until she moved in with her aunt in Croatia at the age of 6. She began her schooling there and learned the family trade of toymaking, all the while developing a near obsession for 60s science-fiction films.\n\nShe followed her passion for creation and technology and studied electromechanics at a vocational school, and then military engineering at the University of Zagreb where she excelled at robotics engineering. She found herself isolated due to her unorthodox approach and others’ attitudes towards her transition, so she focused on her work. Her unique perspective and raw creative ability set her apart from her peers and got her the attention of Kali, who was in the country looking for recruits. An offer followed, and Janković joined Nighthaven.\n\nThe company’s success can be largely credited to Osa’s inventions and her field work. Her efficiency and the versatility of her arsenal have given them an edge in every recorded operation, and by proving herself to be a dedicated and reliable asset she earned the choice position of Nighthaven’s head of R&D.\n\n### Psychological report\n\nSpecialist Anja “Osa” Janković didn’t shy away from letting me know that speaking to me about personal matters was a professional courtesy; she always has work to get back to, and time with me is more of a distraction than anything else. \\[…\\]\n\nIn all matters, she is grounded by the meticulous precision that her aunt taught her yet driven by a sense of wonder. She attributes this to her favorite childhood movie, Empress of the Plutomatons (1967). As I understand, it was filled with futuristic technology and colorful imagery, and was ahead of its time in the presentation of a strong female protagonist. It’s easy to see the trajectory between that little girl, wonderstruck by robots and spaceships, and the genius that she is today. \n\nHer creations are more than their function, to her at least. She walked me through the process of developing Wamai’s Mag-NET Systems, from idea to working prototype. Before she even thinks about materials and calculates the physics of a device, she draws it out with a specific aesthetic and color palette in mind. Aruni’s prosthetics, Kali’s Masterframe outfit, Ace’s Breachers… they’re more than just equipment, they’re art pieces. \\[…\\]\n\nShe credits her success in equal parts to her natural talent and the affection of her loved ones. In both her career and her transition, she could always count on the support of her older brother, her aunt, and Kali. She writes to her family from every corner of the world where her work sends her and she describes her bond with Kali, her “boss”, as an unbreakable sisterhood built on mutual respect.\n\nWith Nighthaven, she found agency and merit, as well as a circle of friends with whom she could be herself. Despite her disregard for my work, I expressed hope that she would eventually come to trust me as she does them. I also asked if I could borrow a copy of Empress of the Plutomatons; it sounds like a lot of fun. And who knows? I might learn a thing or two.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5tt27EFHYjiDLo2qbYEgXG/2f1acbb8209e45b136ca7b0e2e5eb1f9/r6s-operators-badge-osa.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5IYWNxvwiiwPDxAWsZVmVS/1e62cb6bcd4a7fa1608ed152a5fbb9b4/r6s-operator-osa.png", "loadout": [{"name": "556xi", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2dgpAeAWb3SkZV7rxDbVdQ/fa32323256b7c6f8a1977d3f71e7d4b2/556xi.png", "imageLocal": "img/loadout/556xi.png"}, {"name": "PDW9", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4yYCuRnduMq35CTHfq6wwU/b7d49cdbcb05917e014c99efeaadd33b/PDW9.png", "imageLocal": "img/loadout/PDW9.png"}, {"name": "PMM", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3y4LIwwm8YNQHAv8oOkWCK/a2375901cee34e68fa39c976d85de8aa/PMM.png", "imageLocal": "img/loadout/PMM.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "Frag Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4GZsPHbm9H0k5EWz7TMkwO/33b9007bc6ee03dab15cfa15eb69e096/Frag_Grenade.png", "imageLocal": "img/loadout/Frag Grenade.png"}, {"name": "Impact EMP Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7izurbA5jDmnsmdeBdgKZO/29bca81243dda4084a92521ac0c03592/R6S-EMP-Impact-grenade.png", "imageLocal": "img/loadout/Impact EMP Grenade.png"}, {"name": "TALON-8 CLEAR SHIELD", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/71VBmyDtBAx788WnNJfEgo/1e6d78a81f8dc381bf4244b87970038f/r6s-operator-ability-osa.png", "imageLocal": "img/loadout/TALON-8 CLEAR SHIELD.png"}], "iconLocal": "img/operators/osa_icon.png", "imageLocal": "img/operators/osa_render.png"}, {"slug": "pulse", "name": "Pulse", "realName": "Jack Estrada", "side": false, "isAttacker": false, "squad": ["nighthaven"], "faction": "SWAT", "speed": 3, "armor": 1, "health": 100, "difficulty": 3, "roles": ["intel", "support"], "ability": {"id": "3FSe6N7IfAC6P24VHvl2sl", "ccid-m": "3FSe6N7IfAC6P24VHvl2sl", "ccid-l": "5lpTJQLU1YUNhcjmaTcl7t", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Pulse is a roamer and intel Operator for a defending team. Thanks to his HB-5 Cardiac Sensor, Pulse can track attackers through surfaces, gathering valuable intel on their position.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "1a05cc14-324d-4d03-a32a-9fbede0b7e7c", "buttonNumber": 1, "id": "1sWA4fIPeIcC3TZO3Ks0dn", "ccid-m": "1sWA4fIPeIcC3TZO3Ks0dn", "ccid-l": "3QUZKqEu6KYEGLxcwPW61g", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4a3EtFa0ynXGK05wkZH62r/e3e8d6c52ee02280de1c8d7d7b66e81a/mqdefault.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "s_j-K3gSFdM", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "October 11th (Age 32)", "placeOfBirth": "Goldsboro, North Carolina", "biography": "### Biography\n“The heart is just a motor. Like any machine, it can be fine-tuned.”\n\nBorn on Seymour Johnson Air Force Base, Estrada was raised on bases across the US and internationally, in Germany, Turkey, and Japan. His father was a pilot and his mother was a classified Senior Intelligence Officer. Estrada demonstrated acumen for science at an early age and was quickly moved into an advanced curriculum. His focus on Forensic Science and Biochemistry made him a perfect fit for the Biometrics Program with the FBI, which he joined as their youngest intern. He secured his role as an agent and was soon recruited into SWAT, working both in the field and in the FBI Lab. Estrada’s high emotional intelligence led him to join the FBI’s Hostage Rescue Team (HRT) where he excelled in crisis management and negotiation tactics. His knowledge of behavioral biometrics led to the creation of the Cardiac Sensor, along with several other prototypes which he continues to refine.\n\n### Psychological report\nDuring operations, Specialist Jack “Pulse” Estrada keeps his cool and consistently maintains sound judgment. So to meet someone with such boyish enthusiasm was an entertaining surprise for me. The conversation was a lively circuit of topics from biology, fighter jets, and scuba diving, to something his father builds in his spare time: Muscle cars. I honestly had never heard this term before. It completely baffled me. Estrada had to show me pictures. \\[…\\]\n\nWe discussed his childhood fascination with biology and chemistry. That he wanted to be an astronaut, and jokes that he still might be. He’s fascinated with the concept of alien life-forms. Which, upon mentioning it, prompted him to describe his deep-sea diving expeditions with bouncing excitement. \\[…\\]\n\nWhat does make Estrada quiet and contemplative is the mention of his mother. He becomes serious and there’s a wistful tone in his voice. It was his mother who first noticed how good he was at deconstructing micro-expressions. She encouraged free-thinking and let him decide the pace of his academic studies. A naturally private person, her work in military intelligence made her even more so, but because Estrada can so easily read others I think it bothers him that he’s unable to read his mother at all. \\[…\\]\n\nLife is a sense of adventure and Estrada is ready to grasp it all. It’s a healthy attitude and I wonder how his upbeat energy affects the group. Estrada told me that he’s working on being more in the moment, “slowing time.” He’s striving to be more mindful. I asked if anyone in particular had encouraged this new point of view, but he avoided the question. \\[…\\]\n\nEven under the most extreme conditions, Estrada puts his team first; naturally they all speak highly of him. Estrada says it’s the caliber of his teammates that makes him so dedicated. \\[…\\] He and Specialist Jordan “Thermite” Trace are close, but there is some professional rivalry between Estrada and Specialist Monika “IQ” Weiss. They seem to enjoy goading one another. I’m not concerned. If anything, it benefits Estrada to be challenged once in a while.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/ChAeJzdmwxuvhZTrV81rK/8c16116f4c719a3df864df6639e2f52e/Y0R6_BADGE_Pulse_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3eOrdhZhYBqcFJdD0ygcGI/ba8ce2069fd409480fc74b8a5dbf8afd/R6-operator-pulse.png", "loadout": [{"name": "UMP45", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6X2EZPq2s8UKrP67uxz5FI/f0df4c57d5890c79311e4eb62d4470e7/UMP45.png", "imageLocal": "img/loadout/UMP45.png"}, {"name": "M1014", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2pUiVbwNnQnDTesmWXktqW/f27c1fab9a354bb89cbe309a688f5e02/M1014.png", "imageLocal": "img/loadout/M1014.png"}, {"name": "5.7 USG", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.u ficulty": 2, "roles": ["anti-gadget", "breach"], "ability": {"id": "YDLAwegfDm2dGcza4h2d0", "ccid-m": "YDLAwegfDm2dGcza4h2d0", "ccid-l": "5fjF0VuZqPk99gop9EbnXV", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Very little can stand in the way of the new BU-GI Auto Breacher. This deployable mini-tank destroys all breakable surfaces and devices in its way along a set path, leaving a trail of destruction in its wake.", "trackingLocationDetail": "unique ability", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "36058520-6d7b-4d67-832a-ba3e6570e043", "buttonNumber": 1, "id": "2H7e0KREAbBQwpQ6w7lQ4Y", "ccid-m": "2H7e0KREAbBQwpQ6w7lQ4Y", "ccid-l": "3cAnp4UexJRFP5Gxv5Cz2d", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/64HYGQgvJilfDGfbZAK1En/6c293e05a3efbaba300b3c494e43edc2/ram-gameplay.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "unique ability", "trackingValue": "ram : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3FEecjJZa4Sa0wR4aW76PO/fa3f6b707bcf40f792c7e53567dd8a48/ram-gameplay.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "April 25 (37 years)", "placeOfBirth": "Busan, South Korea", "biography": "### BIOGRAPHY\n\n*“I may not have family, but I have Redhammer.”*\n\nChoi was born in Busan, South Korea. Although the circumstances of her early days are unclear, we know she was left at a fire department, then raised in a series of orphanages. Early caregivers describe a cunning child, who knew when to keep her head down and when to stand out. Hobbies that began in her youth, like interests in K-Metal and charcoal drawing, remain into her 30s — a testament to Choi’s consistency and loyalty.\n\nChoi joined the Republic of Korea Armed Forces (ROKA) the moment she came of age, and began earning commendations, working swiftly up the ranks to Sergeant First Class (Sang-sa). She was soon recruited by the 35th Commando Battalion (Tarantula) where, in a tight-knit all-female unit, she mastered building clearance, hostage rescue, VIP protection, and the use of advanced technology when assaulting an enemy. \n\nThe Tarantula Unit is a high-performing CTU that deserves its renown, and Choi’s status as a standout about its specialists is notable, as she took the lead on a myriad of combat and intelligence operations. As other members retreated to the private sphere, she stayed, often the eldest in her unit. Performance reviews mention her thriving in this senior role, describing a fiercely protective soldier, who stops at nothing to keep her peers safe.\n\n### PSYCHOLOGICAL REPORT\n\nGiven the sparse intel we were able to collect from Specialist Bo-Ram “Ram” Choi’s past with the Tarantula Unit, I needed to see her in action to determine whether she could fit the bill. What happened at Tower was tragic and something we can't allow to happen again, but if we can extract a single positive from that day, it's Ram joining Redhammer. Her unblinking resilience in the face of extreme duress makes her a perfect fit.\n\nRam explained to me how women in the Korean military can only enter at a very high rank, then laughed and said she expects the same treatment in Redhammer. While we only have one Captain, she exudes leadership. A big sister vibe, really. Been awhile since I had one of those, so I’m not hating it.  \n\nShe’s dialed in on the field to a very high degree. I envy her focus, whether it’s during a mission or in downtime when she’s got her headphones in and sketching charcoal. \n\nIn our line of work there’s a lot of, shall we say, “forced redundancy,” and if the axe falls on me one day, it’ll be good to know I’ve got a ready, willing and 100% capable replacement in Ram.\n\n-- Captain Jordan “Thermite” Trace, Redhammer Squad Leader", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3YQiStwC1Qo4wKWmgK6XCH/ac8a0fea30f2996f96ca31b17a0039fa/r6s-operators-badge-ram.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/Fgszpez8AbRf23OkswHQl/32f5f4d2bb387941e474833ceb3ac2cb/r6s-operator-ram.png", "loadout": [{"name": "LMG-E", "slot": "primary", "subtype": "Light Machine Gun", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7JVJIew6t3iKwgByvrFXyi/7ba44dfda28b525506633e453104a604/LMG-E.png", "imageLocal": "img/loadout/LMG-E.png"}, {"name": "R4-C", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/dQbqK9VxczuiscwBDSkT8/777a062f6095dde0371eab5200dcb451/R4-C.png", "imageLocal": "img/loadout/R4-C.png"}, {"name": "Mk1 9mm", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3tWoNeF3jQYs3w4EOydQYs/434409c96693df1fd3e969d778e70795/Mk1_9mm_BI.png", "imageLocal": "img/loadout/Mk1 9mm.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c4636845a04478432c48be8c29aee/Smoke_Grenade.png", "imageLocal": "img/loadout/Smoke Grenade.png"}, {"name": "Stun Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3XnK8s1iQJQu5cfr6UyQfK/429480b96d6d6d6b830c32c75d2608f5/Stun_Grenade.png", "imageLocal": "img/loadout/Stun Grenade.png"}, {"name": "BU-GI AUTO BREACHER", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7qkMmMKIA8rGhDceraZSvl/36e0500d846245551923f9cf3ecce5c3/r6s-operator-ability-ram.png", "imageLocal": "img/loadout/BU-GI AUTO BREACHER.png"}], "iconLocal": "img/operators/ram_icon.png", "imageLocal": "img/operators/ram_render.png"}, {"slug": "rauora", "name": "Rauora", "realName": "Hāpai Iwini", "side": true, "isAttacker": true, "squad": ["viperstrike"], "faction": null, "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["support", "map-control"], "ability": {"id": "51K48cxhXJkSOvxbJBSc1i", "ccid-m": "51K48cxhXJkSOvxbJBSc1i", "ccid-l": "JgjeJI4ZGbmvac8l3FkvB", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Seize control over the map with Rauora’s D.O.M. Panel Launcher. Deploy bulletproof panels from a distance and strategically control the flow of combat. With a quick trigger at the top of the door, open or close the panel to create tactical opportunities.", "trackingLocationDetail": "operators detail", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "15cf8c90-2d2c-4eac-8f73-929e8f0e84ff", "buttonNumber": 1, "id": "6YCvztCy52sOZsGFTUVJ9w", "ccid-m": "6YCvztCy52sOZsGFTUVJ9w", "ccid-l": "6lGBRvZUn7XgbZcprYpQl", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/SqEcgq3Acn1E9ElS7oTlF/7cda44097d340ee0f57a74d3101284b4/r6s-rauora-gadget-thumbnail.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "operators detail", "trackingValue": "rauora : unique ability and playstyle", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5WIsDpdl4JwnQeYlo3VhZB/e5cb9fbaac4beff461d08fca8bdeef6d/r6s-rauora-gadget.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "May 11th (Age 29)", "placeOfBirth": "Christchurch, New Zealand", "biography": "### BIOGRAPHY\n\n*\"Either you follow me out, or I carry you out. It’s your choice.\"*\n\nHāpai Iwini was born in Christchurch, in the Rārata iwi to a firefighter father and military sergeant mother. Following in both her parents’ footsteps, she joined the New Zealand Military (Ngāti Tumatauenga). Notably, Iwini made captain after only three years, and following two attempts, she succeeded in the New Zealand Special Air Service trials. It was due to this achievement that she earned her Moko Kauae. She is a lifelong practitioner of Kaupapa Māori and continues to volunteer as a firefighter when not deployed.\n\nIwini maintains a robust training regimen that extends into semi-professional rugby, a hobby for which she credits her outlier-level performance scores in physical conditioning and situational awareness. Iwini was referred to Rainbow thanks to her exceptional performance in the special forces and underwent Striker training where she broke an extraction course time record held since 2003. She gained full Operator status following her heroic actions during the assault on Hereford Base.\n\n### Psychological report\nDoc and I had natural disagreements about Hāpai “Rauora” Iwini’s squad placement. Though, once I made my case, her designation to Viperstrike was obvious to us both. Her quick decision-making and seamless cooperation with multiple Operators during the Keres Legion’s assault were critical to Rainbow’s survival. Her efforts in the ensuing search and rescue were not just a testament to her compassion, but of her natural leadership in the face of an emergency.\n\nAlthough outwardly, Rauora displays vigilance and strength, there is a core of vulnerability below the grit that will need attention. During our interview, she spoke at length about her husband and sons, and of her “iwi,” her tribe. Homesickness isn’t uncommon among new Operators, but Rauora channels her thoughts of home, using them as ammunition on the field. When tasked with VIP protection, Rauora’s first instinct is to place herself directly between the enemy and her charge. Although she claims that this behavior comes from her trusting her own skills and durability, I believe that it’s more from a lack of trust in others to do what is right for their own safety. While Rauora's operational success rate speaks for itself, this is a trait that I will have to monitor.\n\nRauora’s recklessness will often lead her to where the fighting is most intense, but she finds calm in the aftermath no matter how fierce the battle. She calls it an inherited trait, one passed down through her lineage, her \"whakapapa\", and that she has honed into instincts very few possess. I wish Harry were still here to help me understand all the nuances, but what matters to me in the end is the skillset she’s acquired, and how it can help this squad get the job done. \\[…] \n\nRauora has started to settle in, especially with Thatcher, who she befriended during past joint operations with the SAS. Her familiar presence is easing his anxieties over Dokkaebi’s disappearance, and the resulting calm is a boon to the squad. We will need our wits in the days to come. \\[…]\n\n--Captain Yumiko \"Hibana\" Imagawa, Viperstrike Squad Leader", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/T2BrSyMgBBSjM7rs8T53b/0f8d6842d4440fc06d450789c273381b/r6s-operators-badge-rauora.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7pMqlgdqX1f8iCxxExGyW/811e3604206f21b4912eb59392d59115/r6s-operator-rauora.png", "loadout": [{"name": "417", "slot": "primary", "subtype": "Marksman Rifle",
