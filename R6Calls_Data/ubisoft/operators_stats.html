34U2pZ2Ieem48Dwy9uqj5PNUQTn/F9Db64AbhCe2l2ijtJQpC/13cd53a46d0d868452772ae8a854cca7/r6s-operator-ability-thatcher.png", "imageLocal": "img/loadout/E.G.S. Disruptor (Electronic Gear Scanner Disruptor).png"}], "iconLocal": "img/operators/thatcher_icon.png", "imageLocal": "img/operators/thatcher_render.png"}, {"slug": "thermite", "name": "Thermite", "realName": "Jordan Trace", "side": true, "isAttacker": true, "squad": ["redhammer"], "faction": "SWAT", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["breach", "support", "starter-operators"], "ability": {"id": "7lwk8eE2ZCFLH5Hc87sXav", "ccid-m": "7lwk8eE2ZCFLH5Hc87sXav", "ccid-l": "43BrzZnoEIDKJdnbafwWTw", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Thermite is an important backline support for an attacking team. As one of the only hard-breachers in the game, losing Thermite early in the round will hinder your team significantly. Playing Thermite requires patience, leadership and strong communication with your team.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "b1e671a2-7fc7-41d5-a6c3-048423817248", "buttonNumber": 1, "id": "1Qboxe4qXHk02DKuZAJSB6", "ccid-m": "1Qboxe4qXHk02DKuZAJSB6", "ccid-l": "1YFBcX3ztIRPTk4hZhpgMJ", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4XynU2pg9WrWW4TDyenIyE/3198e44b42838af0af06c9783d1a2a6e/mqdefault.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "94QF3hEJq04", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "March 14th (Age 35)", "placeOfBirth": "Plano, Texas", "biography": "### Biography\n“You see a wall, I see an opportunity.”\n\nTrace joined the Corps straight out of high school, making him a fourth-generation Marine. Following his first tour of Iraq, he obtained enough experience to volunteer as an explosive ordnance disposal technician. After his second tour of Iraq, Trace returned to the U.S., enrolled in university, and earned a Bachelor of Science in Chemistry. He brought his experience and skills to the FBI, where he spent a number of years as a field agent within the Hazardous Materials Response Unit. Seeking more dynamic environments, Trace transferred into FBI SWAT, where he excelled at developing new barricade protocols. He then earned a spot in Rainbow where he’s shown further interest in research and development on gadget upgrades. Trace’s hometown of Plano has a major concentration of Chinese Americans, and as such Trace has conversational level of Mandarin.\n\n### Psychological report\nFor someone so disciplined and orderly, Specialist Jordan “Thermite” Trace likes to surprise. He can be a practical joker and he’s always ready with a smart aleck comment. Beneath the surface, however, the recent loss of his sister to cancer, and the death of his mother a few years prior, have made it difficult for him to channel his thoughts and energy with the focus to which he is accustomed. \\[…\\] I am concerned that he uses humor to avoid his grief. It’s important he understands that some coping mechanisms can delay the healing process. There are resources that can help him, and I will continue to offer them when and where I may. \\[…\\]\n\nTrace demonstrates strong tactical leadership, but can also plow ahead without consensus. I don’t believe there’s any lasting friction with other team members. He’s well-liked by the others and has a solid working relationship with Specialists Yumiko “Hibana” Imagawa, Mike “Thatcher” Baker, and Emmanuelle “Twitch” Pichon. He can be quite the social-butterfly in his downtime. \\[…\\]\n\nA few things to work on: Trace has excellent communication, when he chooses to use it. He has good strategies but sometimes tends to “lock in.” I know that he’s capable of being a more agile thinker, so I’ve given him some tips on how to recognize when he’s becoming too… bullheaded. \\[…\\]\n\nThere’s a lot going on behind his smile. I’d like him to find a way to regulate himself, to find balance for his work and private life. Trace doesn’t show obvious stressors, opting instead to channel any anxious energy into something positive such as the R&D lab. It has been difficult to convince him that he needs a break from his role and identity as an operator. Shifting his attention to other intense tasks isn’t a solution. \\[…\\] I’ve given him some mental relaxation exercises that don’t demand considerable time, but can be tackled throughout the day. Imagawa, in particular, can be a good influence on him since she regularly practices mindfulness techniques to focus and relax. I hope he will take her advice to heart.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6tow5mqLao5TrJVL52csSc/46aa934c9f3f02189e9c04df0114a081/Y0R6_BADGE_Thermite_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4c4cEUFWUwXTT4p3V5wAjm/e755c2a37a050de118eabc667c55c511/R6-operator-thermite.png", "loadout": [{"name": "556xi", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2dgpAeAWb3SkZV7rxDbVdQ/fa32323256b7c6f8a1977d3f71e7d4b2/556xi.png", "imageLocal": "img/loadout/556xi.png"}, {"name": "M1014", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2pUiVbwNnQnDTesmWXktqW/f27c1fab9a354bb89cbe309a688f5e02/M1014.png", "imageLocal": "img/loadout/M1014.png"}, {"name": "5.7 USG", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/tkYcSAJSe5yGkeUhzZqBO/e81feb86df4a7eb6951052bec26b6ed7/5.7_USG.png", "imageLocal": "img/loadout/5.7 USG.png"}, {"name": "M45 MEUSOC", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3u5cecgWYl3WuJK50mKEGd/a4a0eb15c710edfc0d29e98c2ee7ea33/M45_MEUSOC.png", "imageLocal": "img/loadout/M45 MEUSOC.png"}, {"name": "ITA12S", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5G4DroaSdqHzJWCe7qqbHZ/5dd2e03f853182c78a1e7fcbc642f0cf/ITA12S.png", "imageLocal": "img/loadout/ITA12S.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c4636845a04478432c48be8c29aee/Smoke_Grenade.png", "imageLocal": "img/loadout/Smoke Grenade.png"}, {"name": "Stun Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3XnK8s1iQJQu5cfr6UyQfK/429480b96d6d6d6b830c32c75d2608f5/Stun_Grenade.png", "imageLocal": "img/loadout/Stun Grenade.png"}, {"name": "Exothermic Charge", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/R5giHT90R2XOMMuUENZeK/840a5a391ed57a0c62208e72258407a7/Exothermic-Charge.png", "imageLocal": "img/loadout/Exothermic Charge.png"}], "iconLocal": "img/operators/thermite_icon.png", "imageLocal": "img/operators/thermite_render.png"}, {"slug": "thorn", "name": "Thorn", "realName": "Brianna Skehan", "side": false, "isAttacker": false, "squad": ["redhammer"], "faction": "Garda Síochána", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["anti-entry", "trapper"], "ability": {"id": "5n14QUva5rdMhcaRkV40ig", "ccid-m": "5n14QUva5rdMhcaRkV40ig", "ccid-l": "7e9bSzmpFY85IrJ1fAcG7d", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The Razorbloom Shell sticks to a surface after it's thrown by Thorn. Shortly after detecting a nearby opponent, it automatically propels a set of sharp blades in all directions, delivering lethal damage.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "60c0eef3-5196-45f6-a1bc-d11122863011", "buttonNumber": 1, "id": "1cMsnVAfTh8snck1sY20ak", "ccid-m": "1cMsnVAfTh8snck1sY20ak", "ccid-l": "6k1MR8xnEJMyKbonWLYH58", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6OEYC1Z4x9ZWYazokqvT9K/31a68cea5f9682da117fd306a57c97a1/r6s-y6s4-gadget-thorn.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "thorn : unique abilities", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2es2rXTTKTEHm1810hp5fG/f468ee4a95045374b65c211fadadbdd5/r6s-y6s4-gadget-thorn.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "June 18  (Age 28)", "placeOfBirth": "County Kildare, Ireland", "biography": "### Biography\n\n*“Pick on someone your own size.”*\n\nThorn grew up on a farm in a part of Ireland known for two things: horse racing and military training. For several generations her family was heavily involved with both. When she wasn’t outwrestling one of her five older brothers, she was helping her parents breed and raise thoroughbreds for the tracks as well as for the mounted division of Ireland’s national police force. It’s a Hawthorn family tradition to eventually abandon farm life for the military, as it’s considered to be “easier”. Thorn, however chose to follow the horses and joined the Garda Síochána.\n\nAfter four years of impeccable service she applied for the Garda’s elite tactical branch, the Emergency Response Unit. Only five percent of applicants pass the grueling two-week entrance exam. Thorn not only finished top of her class, but would routinely assist other applicants through the training gauntlet.\n\nShe quickly rose through the ranks as a tactical weapons expert and helped re-design the unit’s obstacle course, referring to the former design as a “walk in the park.” Word of her course reached the ears of Caveira, who upon barely completing the training exclaimed with exhaustion “You want a job?”\n\n### Psychological report\n\n\"If ever you want to feel physically inept, shake hands with a farmer. At least that’s how I felt when I first met Specialist Brianna “Thorn” Skehan. In that brief instant I experienced a life’s worth of hard work, discipline, tremendous strength, and total control. I knew then and there she’d fit right in. \n\nGrowing up on the farm, Brianna had to fight for attention, and everything else. Her mother and father were too busy and left most of the parenting to her older brothers. And while she may have been picked on when she was little, it all stopped the day she broke her oldest brother’s nose. She possesses a strong sense of justice and has zero tolerance for bullying \\[…\\]  \n\nWhen we discussed her decision to join the police force, she recounted with some reservation an incident involving her youngest brother, Liam. His many addictions led him to the racetracks, where he fell into the pockets of organized crime members. One night he led them onto the farm where they burned a stable to the ground, killing the champion horses inside. Brianna joined An Garda Síochána the very next day, and never saw Liam again.\n\n\\[…\\] Brianna often glosses over hard topics with humor and is quick to suppress her emotions. Signs of vulnerability were weaknesses in the eyes of her brothers, which would explain her perfectionism, her competitiveness, and her ferociousness on the field.  \n\nBrianna’s personality is magnetic. She gets along with everyone and elevates morale with her stories. She’s awake and training before most of our specialists have opened their eyes, although Sledge has recently been joining her on morning jogs. \\[…\\] When I asked if her past was a distraction, she laughed and said “Only fools get distracted by the past.” I was tempted to explain how I’d be out of a job if that were the case. \n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow\"", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1pzBJsbL1vQT8is7B0Xjxz/440335c080e54ca28eba24858361a03a/r6s-operators-badge-thorn.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3erk7Ub0asfBDZEKsdL8j9/5019698958b0834e806d01cd7bf36286/r6s-operator-thorn.png", "loadout": [{"name": "UZK50Gi", "slot": "primary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5WMIsPUWTXprZnAwctPsTt/f1c652b681e7e9ba6ba66bcd29e12a76/uzk50gi.png", "imageLocal": "img/loadout/UZK50Gi.png"}, {"name": "M870", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2rkU6g4Rlg0e0U4rczWGTV/a51589a54c43f476d8eb984c0ea881e9/M870.png", "imageLocal": "img/loadout/M870.png"}, {"name": "1911 TACOPS", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/189UukZ6fVnvQR6LJtLYry/6eec29603d5b7b0ca8cab6ac0ef083ac/1911_TACOPS.png", "imageLocal": "img/loadout/1911 TACOPS.png"}, {"name": "C75 Auto", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3wUuefwPjU705mZkTdJ9UH/8ccb11884cfa34c176ac5500af139177/C75_Auto.png", "imageLocal": "img/loadout/C75 Auto.png"}, {"name": "Deployable Shield", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/W0WE0X2VQlxwWIAFCJ6Jm/523650a39de5a23dd9520d7299c9e25a/Deployable_Shield.png", "imageLocal": "img/loadout/Deployable Shield.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "RAZORBLOOM SHELL", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/38hUQdWTb1vgs0Yg8eQHFC/0d7f05420068a41392342a1b38c57c2e/r6s-operator-ability-thorn.png", "imageLocal": "img/loadout/RAZORBLOOM SHELL.png"}], "iconLocal": "img/operators/thorn_icon.png", "imageLocal": "img/operators/thorn_render.png"}, {"slug": "thunderbird", "name": "Thunderbird", "realName": "Mina Sky", "side": false, "isAttacker": false, "squad": ["wolfguard"], "faction": "Unaffiliated", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["support"], "ability": {"id": "3XZnAuv43begq8r78ANLE6", "ccid-m": "3XZnAuv43begq8r78ANLE6", "ccid-l": "ikAyZpFdDd2GwyXX3DPDY", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "When deployed on the ground, the Kóna Station acts as a point of safety for injured and downed Operators. All they have to do is approach the device, and the Kóna Station automatically boosts the Operator's HP or offers a revive.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "b0dcf4ac-cbcc-40a9-baa8-59b1e08925fd", "buttonNumber": 1, "id": "1GcgF60TDutu0ZbLMdXwI4", "ccid-m": "1GcgF60TDutu0ZbLMdXwI4", "ccid-l": "fJ8nc0tV4OhEsZMllNhUL", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/74yCF49kcIt7viR8f4a0Xf/fc19df5ba815bf718af2ad2d84ce86c9/r6s-operators-ability-thunderbird.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "thunderbird : unique abilities", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6F0f7WolcXU6DCogAT1Oi0/171b86a6523863b4aefc984d3e772176/r6s-operators-ability-thunderbird.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "April 1st (Age 36)", "placeOfBirth": "Nakoda Territories", "biography": "### Biography\n\n*“Air or ground, you find your balance or end up with a face full of dirt.”*\n\nBorn in the Nakoda Territories of Saskatchewan, Thunderbird’s first lesson from her mother was the importance of community. Her first introduction to engines was at her father’s knee, he taught her to understand helicopters before she learned to fly one.\n\nAlways eager for new experiences she enrolled in the Bold Eagle Program at seventeen where she excelled in basic military training. While benefitting from the guidance of community elders and indigenous instructors, this program sparked an interest in preserving and protecting what she loved most, the Nakoda way of life. \n\nAfter joining the Canadian Armed Forces Thunderbird worked her way through flight school. Remembering her mother’s emphasis on the value of balance, Thunderbird felt since the CAF taught her to take lives, she should also learn how to save them. She completed her Basic Medical Training (CFHSTC) and continued to serve in the CAF as an Aerial Medic.\n\n### Psychological report\n\nWhen Nomad first brought Specialist Mina “Thunderbird” Sky to our attention I wasn’t surprised by her recommendation. Sky is an accomplished medical officer, aviation mechanic and pilot. She seems to have the necessary drive, training and temperament to meld with Nomad’s team. I was, however, surprised that this was the first I have heard of her.\n\nHad it not been for Sky’s medical training Nomad may not have survived the incident in the North. I wonder if that encounter inspired Nomad to welcome the friendship of a hunter like Specialist Frost. Given her background I feel that Frost and Sky would have much to bond over. Family is clearly important to Sky, and that goes beyond immediate blood ties. The Nakoda community had as big an influence on and hand in raising Sky as her parents. The knowledge passed down is not solely a history but a heritage to be practiced and preserved as a way of life.\n\nOverall, Sky has an emotional awareness that’s born from understanding and acceptance. She seeks balance in everything she does. She describes the world and the human body as an engine. First you need to understand its purpose, and then how it functions. If a wire is shredded you can’t fix it with a screw, but a screw can hold a bone in place as it heals. I can appreciate the analogy, listen first then find a solution. That’s not to say she doesn’t lose her temper. What “gets under her skin” as Sky puts it is lack of respect. Respect for others, whether it’s their way of life or their right to life is essential to her principles.\n\nSky’s evaluation of risks seems to be tempered by her confidence and experience. After discussing some of her more harrowing adventures, I was concerned about her daredevil tactics. I did ask her what it felt like when she was in the air and if it was the adrenaline rush that fueled her. Her response was a smile and a simple, “It felt like flying.” I guess I deserved that…\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/YQfDJ42B2IKcKnb0lRaXq/0cedb53c439b0fe448be95713a836b29/r6s-operators-badge-thunderbird.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2braENz5x4Ko9UZ03LsBfY/7fd1647e138fa8db8f2fac2be2867693/r6s-operator-thunderbird.png", "loadout": [{"name": "SPAS-15", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/CyofBgipHq4RTafvPFWd4/bc3d0ecc871b70e57735855f852efacf/SPAS-15.png", "imageLocal": "img/loadout/SPAS-15.png"}, {"name": "Spear .308", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/29LjYuJ4s6yA8k9Uv2u28C/89ec812559e7d74b7c269279f4c46d92/Spear_.308.png", "imageLocal": "img/loadout/Spear .308.png"}, {"name": "Bearing 9", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4mdftEOh5Vu9KhhpgKLKrT/abedcc75868774018295ec2a08a7b3de/Bearing_9.png", "imageLocal": "img/loadout/Bearing 9.png"}, {"name": "Q-929", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2fRVszR5yGDHbV0AL8muso/0838dac90b66aa810daa49d36382fb64/Q-929.png", "imageLocal": "img/loadout/Q-929.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "Deployable Shield", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/W0WE0X2VQlxwWIAFCJ6Jm/523650a39de5a23dd9520d7299c9e25a/Deployable_Shield.png", "imageLocal": "img/loadout/Deployable Shield.png"}, {"name": "ITA12S", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5G4DroaSdqHzJWCe7qqbHZ/5dd2e03f853182c78a1e7fcbc642f0cf/ITA12S.png", "imageLocal": "img/loadout/ITA12S.png"}, {"name": "KÓNA STATION", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/67J9QnmuA4TMI3rBxoA3Jz/4ec42d8c1bb61dadc5f36893f93142e8/r6s-operator-ability-thunderbird.png", "imageLocal": "img/loadout/KÓNA STATION.png"}], "iconLocal": "img/operators/thunderbird_icon.png", "imageLocal": "img/operators/thunderbird_render.png"}, {"slug": "tubarao", "name": "Tubarão", "realName": "Isaac Nunes Oliveira", "side": false, "isAttacker": false, "squad": ["wolfguard"], "faction": null, "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["anti-entry", "anti-gadget"], "ability": {"id": "71pb8Jc42JD8mN8Ds6taIa", "ccid-m": "71pb8Jc42JD8mN8Ds6taIa", "ccid-l": "mrhXGEM62RZS18fg5hVA9", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Feel the chill of the new Zoto Canister. The Zoto Canister is a throwable device that can slow enemies, freeze devices to pause their deployment and prevent use, and even leave footprints behind if the frozen area is walked on.", "trackingLocationDetail": "unique ability", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "b53f6473-e770-441e-8e25-b127bb49c7e8", "buttonNumber": 1, "id": "37HAkxRdIVWHjKw4bQs2vC", "ccid-m": "37HAkxRdIVWHjKw4bQs2vC", "ccid-l": "3NQIpX1oE0aaaFMghZenP1", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2MO5t2cWZxAdbdbKAUfaXM/030b8bcd5aa37c313d0c538aa28d65ff/tubarao-gameplay.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "unique ability", "trackingValue": "tubarao : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/76d6XlMAYXGfHUfH6LpLHA/f2d9763ba3824289cde0eac356ea73c7/tubarao-gameplay.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "November 24th (Age 35)", "placeOfBirth": "Ponta Delgada, Portugal", "biography": "### BIOGRAPHY\n\n*“Acceptable casualties? Nah.”*\n\nA tumultuous childhood in the Açores archipelago where earthquakes and underwater eruptions often shook communities taught Nunes the value of mutual aid. He applied this lesson in all things, even as an amateur athlete in biking and kayaking where he often backtracked, at the cost of his own performance, to help his peers facing difficulties or injuries.\n\nOn boating trips with his father, Nunes found a connection to the ocean that would set a course for his career. He insisted on helping with the ship’s navigation and repairs, and discovered his sense of freedom through wakeboarding; a desire to be unmoored that could only be satisfied by leaving his home. His path forward was clear, and he went to the mainland to pursue a career in the marines.\n\nWhile Nunes excelled at learning new skills and easily matched his peers in physical testing, he was highly regarded for his natural leadership and his insistence on civilian safety. After he transitioned and amassed enough experience, he entered selection training to join the DAE.\n\nHis humanitarian outlook was an asset as he often worked within civilian areas, sometimes returning to his archipelago home. The frost grenade Nunes created to halt the detonation of explosives caused a lot of buzz, leading Specialist Gustave “Doc” Kateb to recruit him into Rainbow.\n\n### PSYCHOLOGICAL REPORT\n\nVolatile elements (explosives, disease, radicals…) are one of the biggest risk factors of our line of work. I know what it’s like to lose a friend to something I couldn’t control. You can’t wish for a different outcome. No prayer will stop the march of death. It’s people like Specialist Isaac “Tubarão” Nunes Oliveira who make the difference, by finding new ways to take control and make sure everyone gets to go home.\n\nReading performance reports on his time in the DAE, I was fascinated by his repeated insistence that resources always be put aside to contain hostile activity and ensure residential areas and civilians, VIP or not, were duly considered in the overall cost of a mission.\n\nIn one operation, a group of smugglers Nunes was chasing retaliated by seizing a small town marina and threatening to blow it up. The situation was at a stalemate until he deployed his invention, which caused the bomb to malfunction and gave his team the opening they needed to neutralize the hostiles. Nunes knows when to be patient and when to act. Risk measurement is crucial, and a lesser specialist would not have been able to resolve this crisis with no casualties and minimal property damage.\n\nNunes shares a lot of experience and interests with Specialist Craig “Blackbeard” Jenson, who he trained with years ago in one of their units’ many joint exercises. I’ve never heard two grown men laugh so much. I guess you could say similar people are led to similar careers. When I asked Jenson for his opinion on Nunes’ recruitment, his answer surprised me: “Every man’s different. Tubs is trans, so he had to fight twice as hard for his spot. You can’t break him. You just have to let him do his thing.”\n\nNunes’ resilience is essential, but what I find most important is that no matter the situation, he has as much faith in his empathy as in the skills that make him a high-performing specialist. That’s what makes him Wolfguard.\n\n-- Captain Gustave “Doc” Kateb, Wolfguard Squad Leader", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/43VtYmfmTtLwwKDGhalSCO/9673bb50e981ba2684cd649534f00de7/r6s-operators-badge-tubarao.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6RHlZJniCer89285ocTyPY/103b3da47a3978f5b6fbbd77a02b53c9/r6s-operator-tubarao.png", "loadout": [{"name": "MPX", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5HFewpAJ8npDDCKFnEadhL/d398bb477d6b56fe41bfdb5862ed31c0/MPX.png", "imageLocal": "img/loadout/MPX.png"}, {"name": "AR-15.50", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4lGGEGZLkbldz114Wl5hCo/78a04c46654f80fae03e730bd79f3563/AR-15.50.png", "imageLocal": "img/loadout/AR-15.50.png"}, {"name": "P226 Mk 25", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/RTQvPQcywlRwUS1FjIKCX/6fc72fee2191c2e723276bc10ae4114e/P226_Mk_25.png", "imageLocal": "img/loadout/P226 Mk 25.png"}, {"name": "Nitro Cell", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4pBSTw9U6l9GRnT12G6Xln/e0991bc03b48d217f510af8b611c8828/Nitro_Cell.png", "imageLocal": "img/loadout/Nitro Cell.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "Zoto Canister", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2HBwr95RPJmDlx29Sg5noC/0d0f7d6f78f0a88b684899f1177773d8/r6s-operator-ability-tubarao-v1.png", "imageLocal": "img/loadout/Zoto Canister.png"}], "iconLocal": "img/operators/tubarao_icon.png", "imageLocal": "img/operators/tubarao_render.png"}, {"slug": "twitch", "name": "Twitch", "realName": "Emmanuelle Pichon", "side": true, "isAttacker": true, "squad": ["wolfguard"], "faction": "GIGN", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["anti-gadget", "intel"], "ability": {"id": "7BoDk217wLoH65wcReVRXP", "ccid-m": "7BoDk217wLoH65wcReVRXP", "ccid-l": "1GHMRDaTvPPt8BR97d54VY", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Twitch is a disabler and intel Operator. She can utilize these skills as either a remote back-line support or as an aggressive entry fragger.\n\nTwitch is capable of remote disabling through her unique ability: RSD MODEL 1 SHOCK DRONE", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "eeea892e-2b71-403f-8864-557bcae9104d", "buttonNumber": 1, "id": "17lnlqHgO7ySjX4S41ndyH", "ccid-m": "17lnlqHgO7ySjX4S41ndyH", "ccid-l": "31QjQCNurIhHHns1B34rAe", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/fDEvw6KEXiJX4Xl6YdjWK/999706dc4158da0949c36190bf189f15/operator-video-ability-twitch.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "xEuaxniVNV4", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "October 12th (Age 28)", "placeOfBirth": "Nancy, France", "biography": "### Biography\n“Machine learning and teamwork have one thing in common: Always lead by example.”\n\nPichon grew up in a family of academics in the historic city of Nancy, France, where the children were encouraged to excel in Math, Science, and Technology. Early participation in sponsored computer programming competitions led to her joining the army cadets at sixteen. Almost immediately her talent was recognized, particularly in robotics. Her superiors quickly encouraged Pichon to study engineering while continuing her career in the military. From the start, Pichon’s focus has been on adaptable technology that aids soldiers in the field. While there is much praise for her technological achievements, Pichon’s tactical prowess and ability to problem solve quickly and efficiently make her a crucial operational asset. Pichon's unique combination of talents made her well-suited for GIGN and, later, Rainbow. She is fluent in French, English, and German and her current research focus is AI.\n\n### Psychological report\nTechnologically creative isn’t a term I’ve heard before working with Rainbow. According to Specialist Emmanuelle “Twitch” Pichon’s field reports, it’s the most concise description for her. Of course, it doesn’t encapsulate all of who she is. There’s more depth and surprises to Pichon than anyone expects. \\[…\\]\n\nThere is some academic rivalry between Pichon and her sister, a physicist, but nothing serious, she tells me. It’s endemic of the perfection her family instilled in their children. Her father told her to strive to be incredible every day and that it will resonate out into the universe. \\[…\\] The Rainbow team speaks highly of her both operationally and in a social setting. Specialist Gustave “Doc” Kateb, in particular, appreciates her intuition and empathy, while others such as Specialist Olivier “Lion” Flament praise her technological know-how.\n\nI wanted to know how Pichon interprets technological creativity. She said it’s the way she sees things differently and yet remains aware that she’s seeing things differently. So I suppose I would add “philosopher” to her myriad descriptors. \\[…\\]\n\nShe’s a very hands-on researcher. The manner in which she gets right up close to a robot, interacting with it the way someone would a child or pet, illustrates her innate compassion. Pichon is currently teaching AI empathy so that it can, in turn, teach it to humans. I’d love to delve into this further, and have plans to visit the lab. \\[…\\]\n\nBecause Pichon’s passion for technology as a way to improve quality of life drives her in research and in her military career, I wonder if she isn’t at times being too idealistic. She’s an excellent operator with many skills to offer besides the tech, and I want her to give more thought to where the human factor is crucial. \\[…\\]\n\nHer background and interest in AI means one of Pichon’s favorite pastimes is people watching. Whether it’s settling into a restaurant or taking a bus, she goes wherever there are crowds and studies behavior. Travel, too, excites her. The list of where she hasn’t been is shorter than where she has.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3YgCpOSM2R4SDgExstxm7P/ff84e6ac53bd9f690deee78870f9c23b/Y0R6_BADGE_Twitch_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5jaeo9LkOu6deQz4mOF9a2/9a07011ac08bc25d58cbfc828b442e3a/R6-operator-twitch.png", "loadout": [{"name": "F2", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5HTvw1cJInVAGxOLXR0war/2f142437f5c0944fdcfcce8a03c37676/F2.png", "imageLocal": "img/loadout/F2.png"}, {"name": "417", "slot": "primary", "subtype": "Marksman Rifle", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5djkS4YtAtOF0vBmg0T60x/ea2b1ff7e5367e66c9
