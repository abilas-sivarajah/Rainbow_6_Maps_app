muQsivzV/6810dd2fd334fe55b0a46160622f8af8/operator-video-small-iq.mp4", "description": null, "videoControls": false}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "August 1st (Age 38)", "placeOfBirth": "Leipzig, Germany", "biography": "### Biography\n“Life is the ultimate Rube Goldberg machine.”\n\nWeiss’s mother is a renowned mathematician and her father is an inventor whose high academic standards encouraged Weiss and her siblings to win numerous awards in math, science, and music throughout their school years. Thriving in the gifted program enabled Weiss to complete her first internship with a local tech company at the age of sixteen. She was invited to MIT, where she focused on electrical engineering, achieving accolades for her research in Microelectronics. Weiss then joined CalTech for graduate studies in experimental electrical engineering. Weiss returned to Germany to work with military technology research before joining the Bundespolizei (BPOL) as an officer. Both the physical and mental challenges of the job appealed to Weiss and she quickly moved through the ranks. After two years with the BPOL she was recruited by the GSG 9.\n\n### Psychological report\nSpecialist Monika “IQ” Weiss is as active physically as she is intellectually. When she does manage to pull herself away from rock climbing, spelunking, and – well, countless other athletic and intellectual pursuits, she writes science-fiction. During our meeting, Weiss exuded so much natural vitality that I felt the same exhaustive rush I remember from completing my first marathon. \\[…\\]\n\nWeiss says she and her siblings are typical overachievers and jokes that even she gets worn out at family gatherings. It’s clear they’re important to her and she confided that she doesn’t have any close friends because only her family understands her. \n\nIt isn’t unusual for people with exceptional intelligence to be uncomfortable socializing. Of course, I’m not interested in pushing Weiss into making friends – that’s not my role, nor hers. But I do think she would benefit from reaching out to some of the other specialists beyond the usual training exercises and research. \\[…\\]\n\nHer parents encouraged Weiss and her siblings to stretch their imaginations as much as their intellect. She described her mother as “someone madly obsessed with finding patterns in chaos.” Her father was the kind to launch experimental rockets from the family garage. It’s hardly surprising, then, that Weiss inherited their combined talent for focused disruption. \\[…\\]\n\nWeiss was coveted by companies and universities from around the world, but she chose law enforcement. That fascinated me. She said it was an opportunity to work with state-of-the-art equipment and express her love for her country at the same time. I pointed out a third reason – academic research can be rewarding but it’s typically highly focused and structured, leaving less room for the wildly creative approach that Weiss naturally possesses and that our special operations encourage. \\[…\\]\n\nField reports mention that Weiss can become obsessive when tackling challenges. In the same vein, she suffers from bouts of insomnia. I suspect the latter stems from the fact that Weiss simply doesn’t want to “give up the day”. If she’s to be of utmost use to Rainbow, it will be important that she learns when and where to let go.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4xnVj2iZB8Otchiw7j69UO/13c864a4e2eb976c1978dc79411b450c/Y0R6_BADGE_IQ_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2bdUfjHxFfSn9YzMjlUThL/d1b3519228790ba30785eebab03bbc38/R6-operator-iq.png", "loadout": [{"name": "AUG A2", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1eO39zRe8XxJXH1KZiIWhM/02049ced0fbfa630833e8b0d3c03de07/AUG_A2.png", "imageLocal": "img/loadout/AUG A2.png"}, {"name": "552 Commando", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1LT0N89YaOHvRwn3Pphr8K/02d4a3da9cda132d8201fd134f24fede/552_Commando.png", "imageLocal": "img/loadout/552 Commando.png"}, {"name": "G8A1", "slot": "primary", "subtype": "Light Machine Gun", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4TIb7oeJesaROOOfTlCBaZ/ffd6a802f9a779a0d39b2122c49b3254/G8A1.png", "imageLocal": "img/loadout/G8A1.png"}, {"name": "P12", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2mpM7rah7rwEW0bViIirUC/ed9caa4db58421519fa4db390b1aa164/P12.png", "imageLocal": "img/loadout/P12.png"}, {"name": "Breach Charge", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1OgTMhyF1FBsSAo4njk26m/99b7a971f81b9195b3c3536b51d52893/R6S_Breach_charge.png", "imageLocal": "img/loadout/Breach Charge.png"}, {"name": "Frag Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4GZsPHbm9H0k5EWz7TMkwO/33b9007bc6ee03dab15cfa15eb69e096/Frag_Grenade.png", "imageLocal": "img/loadout/Frag Grenade.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "Electronics Detector", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/23Nk2ie06rb3DcZnStryIY/e06226196dd582c905c33fad87dfdd63/Electronics-Detector.png", "imageLocal": "img/loadout/Electronics Detector.png"}], "iconLocal": "img/operators/iq_icon.png", "imageLocal": "img/operators/iq_render.png"}, {"slug": "jackal", "name": "Jackal", "realName": "Ryad Ramírez Al-Hassar", "side": true, "isAttacker": true, "squad": ["viperstrike"], "faction": "G.E.O.", "speed": 2, "armor": 2, "health": 110, "difficulty": 3, "roles": ["intel", "map-control"], "ability": {"id": "6Fe1fzEB88yNDbtXXZhfQA", "ccid-m": "6Fe1fzEB88yNDbtXXZhfQA", "ccid-l": "6aNXBSQ95p5ukCKLf5s1br", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Eyenox Model III was created to offer a mobile tracking device able to both identify and trail a person’s footprints in real-time.\nEquipped with advanced computer vision, the Eyenox detects invisible details relating to footfall and weight distribution so that you can identify and stalk your target.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "a1821aee-a86d-4fd5-a928-c2c9424cfa34", "buttonNumber": 1, "id": "2ae7gaoBlrqOURUeBuWJy0", "ccid-m": "2ae7gaoBlrqOURUeBuWJy0", "ccid-l": "3XxBhOXIHBf1Z6p6mM8yZp", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3ntMaBashgSGTlNnf8xT0v/b5f7e601d851c4308cd208deb07b1073/R6-operators-gadget-jackal.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "February 29th (Age 49)", "placeOfBirth": "Ceuta, Spain", "biography": "### Biography\n“You can’t escape me, but that doesn’t mean you won’t try.”\n\nAl-Hassar’s early years are unclear due to incomplete foster care records. Eventually released into the care of his older brother, Faisal, the two of them were absent from official records for several years until Faisal’s unsolved murder once again left Al-Hassar without a home. Being guided through the tragedy by a sympathetic police officer solidified Al-Hassar’s resolve to find his brother’s murderer and he joined the Cuerpo Nacional de Policía the day he turned eighteen. Fast-tracked through the academy with the help of his mentor, Al-Hassar stood out as a quick learner with exceptional lateral thinking. His dogged determination resolved a number of criminal investigations but, unfortunately, the case of his brother’s murder remains open. Tagged by the Grupo Especial de Operaciones for further training, Al-Hassar excelled in off-road driving, abseiling, marksmanship, and knowledge of terrorist groups. He is a frequent guest lecturer and part-time instructor at the CNP academy.\n\n### Psychological report\nEver since he can remember, Specialist Ryad “Jackal” Ramírez Al-Hassar has been nocturnal. Throughout his career it’s been almost a blessing given the demands of the job. Somewhere along the way, though, this has developed into insomnia. At this point, Al-Hassar can’t recall when he last slept well. \\[…\\]\n\nThe murder of his brother is never far from his thoughts. The more time passes and it remains unsolved, the more his frustration grows. I detect guilt in the way he phrases certain things but when I point it out to him he disagrees. Still, he’s agreed to explore it further, especially since the guilt emerged after leaving his job as a criminal investigator. It’s buried deep, and I don’t think it affects his day-to-day work, but neither is it ideal.\n\nAl-Hassar has solid relationships with many of his teammates, including Specialists Mike “Thatcher” Baker, Emmanuelle “Twitch” Pichon, as well as Olivier “Lion” Flament. He’s worked closely with Specialist Elena María “Mira” Álvarez. I can see in their interactions the deep respect they have for each other. \\[…\\]\n\nPast experiences have given Al-Hassar a protective nature and a fierce sense of justice. He can be competitive to the point of pettiness, yet in all cases he’s able to check himself before endangering an operation. He described to me that before each op, he visualizes mental switches being flipped. These “switches” enable him to ratchet up his abilities and maintain focus. Nevertheless, I’d like to delve deeper into this to see if we can help him manage to balance his personal world as well. I need to ensure he isn’t experiencing extreme shifts in mood outside of the workplace. \\[…\\]\n\nI’ve encouraged him to live life for himself. He’s taken some steps toward this by teaching at the academy. Not only will his talents prove invaluable to the young police cadets, but it forms connections that Al-Hassar didn’t realize he was missing. I’ve also just learned that our conversation prompted Al-Hassar to volunteer with at-risk youth. Helping others stabilize their lives may help him to secure his own internal world, as well.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/28k7LKWK70lxib7CimPJaZ/f34b2065811df8f0339838922f8c94b1/Y2S1_BADGE_Jackal_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2YoFmkuQL4r8odEWB7K60w/b5fd30cf9c7f407753bd921dfe6a1d28/R6-operator-jackal.png", "loadout": [{"name": "C7E", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/63vTDjkXeKq7rOoSBhoJD4/08603e6603d564e0fa38af9ec86b7c1f/C7E.png", "imageLocal": "img/loadout/C7E.png"}, {"name": "PDW9", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4yYCuRnduMq35CTHfq6wwU/b7d49cdbcb05917e014c99efeaadd33b/PDW9.png", "imageLocal": "img/loadout/PDW9.png"}, {"name": "ITA12L", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4Y6ziRzm9RiPii83fm8BV1/1f472744d2c2dec8d9206f4d8733d92c/ITA12L.png", "imageLocal": "img/loadout/ITA12L.png"}, {"name": "USP40", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7FxemzWRtlpAhK9MyKp1Gp/817cc25b6b7c3575dc1ba53a6a8170a9/USP40.png", "imageLocal": "img/loadout/USP40.png"}, {"name": "ITA12S", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5G4DroaSdqHzJWCe7qqbHZ/5dd2e03f853182c78a1e7fcbc642f0cf/ITA12S.png", "imageLocal": "img/loadout/ITA12S.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c4636845a04478432c48be8c29aee/Smoke_Grenade.png", "imageLocal": "img/loadout/Smoke Grenade.png"}, {"name": "Eyenox Model III", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2gexf5zLDsa74J7urCoDxk/50da09626395cbe1bf2a58e00a57a514/Eyenox-Model-III.png", "imageLocal": "img/loadout/Eyenox Model III.png"}], "iconLocal": "img/operators/jackal_icon.png", "imageLocal": "img/operators/jackal_render.png"}, {"slug": "jager", "name": "Jäger", "realName": "Marius Streicher", "side": false, "isAttacker": false, "squad": ["viperstrike"], "faction": "GSG9", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["anti-gadget", "support"], "ability": {"id": "5Lzu8rAbgWZNUdwnJ1eDpK", "ccid-m": "5Lzu8rAbgWZNUdwnJ1eDpK", "ccid-l": "MsMr6gzksOAYkgqKP6mO3", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Jager can help his team create a defensive stronghold before roaming the map to intercept flanking attackers. He is capable of destroying incoming projectiles due to his unique deployable gadget : the Active Defense System or ADS.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "01431435-2a8f-4b42-bdcc-ed1f9e06b5c1", "buttonNumber": 1, "id": "315pCdKl5z2UCsIvcqKItt", "ccid-m": "315pCdKl5z2UCsIvcqKItt", "ccid-l": "2jL0ju8O1OhHAislNHRHAK", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5ZrIpMSqjYindpCtks1Byf/0b8997540cddfcb9b9d05578479d3eaa/mqdefault.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "v5JSiwSi6g8", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "March 9th (Age 39)", "placeOfBirth": "Düsseldorf, Germany", "biography": "### Biography\n“Birthdays. Proposals. These should be surprises. No one wants a grenade to the face.”\n\nRaised by his uncle, a mechanic with the Bundespolizei (BPOL) Aviation Group, Streicher was around engines and motors at an early age. While he demonstrated skills in mechanics, it didn’t hold the challenge that he was looking for. Since he had an affinity for complex machinery, his uncle encouraged him to study aeronautical engineering at university, but strict academic form was an uncomfortable fit for him. So while Streicher’s grades were acceptable, he had a tendency toward restless antics. Following his hobby and passion in flying, he spent considerable time around pilots and aircraft. Private corporations sought him out, but Streicher joined BPOL-Aviation Group because it offered him unique challenges, the opportunity to fly and to serve his country. Almost immediately, Streicher began designing defensive weapon systems for BPOL including a ground-based Active Defense System (ADS) prototype. It was this prototype that caught the attention of GSG 9 and Rainbow.\n\n### Psychological report\nSpecialist Marius “Jäger” Streicher has a creative curiosity that’s reflected both in his operations and his daily life. The first part of our conversation was spent discussing a documentary that he watched the night before, about scientists searching for new antibiotics. Streicher was so caught up in it that he sent the link to Specialists Gustave “Doc” Kateb, Emmanuelle “Twitch” Pichon, and Lera “Finka” Melnikova. I’m sure they were all equally interested, if maybe not thrilled to be contacted so early in the morning.\n\nThat was only the start of our conversation. Streicher discussed other documentaries that he found fascinating: NASA sending a probe to the sun, new discoveries about Tyrannosaurus Rex, really anything to feed his voracious appetite for information on any subject. Robotics and artificial intelligence are the topics he seeks out the most but he enjoys almost anything. \\[…\\]\n\nStreicher’s lively energy made for a dizzying meeting. Though the conversation wasn’t erratic, it had a path, I admit I wasn’t able to see it until I noticed that he often mentions the team: Wondering if so-and-so is doing alright after the loss of their dog, if another one received the birthday card he sent, and other references. Streicher enjoys sharing information so that he can make connections. Not just his connection with individuals, but a web of connections among everyone. \\[…\\]\n\nHis own upbringing wasn’t particularly lively or warm and the small family meant that he had very little company his age. He told me that his uncle was a fussy man – nitpicky. Streicher appreciates his uncle and all that he taught him, going so far as to say that his uncle made him a better person. But Streicher did also say that his uncle was closed off and had no sense of humor. I believe the translation is “grouchy bean counter.” Understanding this background shines some light on why Streicher is so eager to create these connections with his team. He sees them as family. It certainly explains how intensely protective he is of them either on operations or during downtime.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1cCvTmKwnnovVmpZmDyPkA/b064f5ad6b9e7398d820d9ea90ff9366/Y0R6_BADGE_Jager_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/18FXPSsVVIDvyKvMi4cmnO/bac05dd81df9a8f48336babdc5030cff/R6-operator-jager.png", "loadout": [{"name": "M870", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2rkU6g4Rlg0e0U4rczWGTV/a51589a54c43f476d8eb984c0ea881e9/M870.png", "imageLocal": "img/loadout/M870.png"}, {"name": "416-C Carbine", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2I86r2a2QD8EHTZVZnxcxy/2913450ba952a16c29fac1f5ce58ba1a/416-C_Carbine.png", "imageLocal": "img/loadout/416-C Carbine.png"}, {"name": "P12", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2mpM7rah7rwEW0bViIirUC/ed9caa4db58421519fa4db390b1aa164/P12.png", "imageLocal": "img/loadout/P12.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "ACTIVE DEFENSE", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1YCujceutAcJ7F10yhHC41/c5f870e7789b6396c9997ed45ccd3beb/Active-Defense-System.png", "imageLocal": "img/loadout/ACTIVE DEFENSE.png"}], "iconLocal": "img/operators/jager_icon.png", "imageLocal": "img/operators/jager_render.png"}, {"slug": "kaid", "name": "Kaid", "realName": "Jalal El Fassi", "side": false, "isAttacker": false, "squad": ["redhammer"], "faction": "GIGR", "speed": 1, "armor": 3, "health": 125, "difficulty": 2, "roles": ["anti-entry", "anti-gadget"], "ability": {"id": "247RHlSXu69cnO3ivKAqBT", "ccid-m": "247RHlSXu69cnO3ivKAqBT", "ccid-l": "xb3RP9cDj4TSnVo2LLkzc", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Kaid’s \"Rtila\" Electroclaw can electrify reinforced walls and hatches, barbed wire, and deployable shields, making it tougher for the enemy to breach the Kasbah and any facility he’s tasked with protecting. He enters the field with two of these throwable gadgets. Once they’ve attached themselves to a surface, they each electrify metallic objects within a 0.75 meter radius.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "2488ee6e-f27b-464c-a4af-eab72d5638c7", "buttonNumber": 1, "id": "58tPxm7crHEzOsWBX2fslb", "ccid-m": "58tPxm7crHEzOsWBX2fslb", "ccid-l": "WMIlb1bed8jY9ww4pwC6h", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/Ai2nddm4FFANo4gaRDpsD/803440088e3952a7a2488e1dc16b6c95/operator-video-ability-kaid.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3x2xgD4LJBv0Axols1G5Rt/422c564586a55d900495264f3f2eca1f/operator-video-ability-kaid.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "June 26th (Age 58)", "placeOfBirth": "Aroumd, Morocco", "biography": "### Biography\n“Lead by example and the mountain will move.”\n\nJalal El Fassi was raised on stories of the Fortress, the legendary training facility in the Atlas Mountains. Its incomparable reputation, along with its famed “Kaids” (Commander) were seared into El Fassi.\n\nHe joined the GIGR (Royal Moroccan Gendarmerie) at 18, demonstrating natural leadership skills under fire. His ability to effectively command specialized squadrons in joint Trans-Saharan Counterterrorism Initiative (TSCTP) operations led to his promotion as Captain. After years of service, the Fortress’ reigning Commander chose his successor: El Fassi, whose authoritative but ethical style made him a worthy “Kaid”.\n\nHis imposing presence and strict values led to success with his graduates, and the Fortress quickly gained accolades. He further proved its excellence through the thousands of soldiers who trained or taught on its grounds. Over years of negotiating, he welcomed troops from across Africa and the Middle-East, fostering stronger ties between TSCTP members and African Standby Force countries.\n\n### Psychological report\nSpecialist Jalal “Kaid” El Fassi is an imposing Operator. His appearance alone inspires respect – it’s easy to see why his stature and demeanor strike fear in his students. Or how his body language warrants their respect and cooperation without him having to say a word. Frankly, it’s both daunting and fascinating at the same time. \\[…\\]\n\nSpecialist El Fassi descends from a long line of Commanders and their Fortress. The Fortress was in disrepute for quite some time, however – some business involving bribes from wealthy families – before El Fassi was at the helm. And it seems his administration not only eliminated these sordid dealings, but elevated the Fortress to heights unimagined by any of his predecessors. \\[…\\]\n\nIt’s been difficult separating Specialist El Fassi from his role. He’s sacrificed a personal life for the success of his Fortress, and his role makes it difficult to create interpersonal relationships. I suspect he prefers being alone—he certainly isn’t the type to open up and share, but I think I understand why. He’s taken it upon himself to guide and nurture the future of Moroccan Special Forces, and potentially all of North Africa. He is the rock that all others look up to, so Specialist El Fassi shoulders the brunt of that weight with equanimity because he believes nobody else can. \\[…\\]\n\nSpecialist El Fassi is particularly phlegmatic, and his dedication to his duty as Commander and to the Fortress is resolute. Rainbow spent years trying to persuade him to join, but he is not easily moved. The Fortress and its legacy were instilled in him as a child. It is his home, his castle, and I can see the time he spends there in solitude is invaluable. But we finally managed to cut a deal with him, one that not even the great Kaid could turn down… one to improve his school and propel it into international standing. This will be the first time El Fassi is among equals. Only time will tell how he reacts to not being in a position of authority. \\[…\\]\n\n-- Dr. Harishva Pandey", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5Qblb1ZqAqkN3Wa0Qw5qBq/05630c80672105a1195282d276e8eb05/Y3S4_BADGE_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4WdfMUlABk6Pr9FjV3kV4x/42ffacc4a2cd75ff9539dcb00e1e28ee/R6-operator-kaid.png", "loadout": [{"name": "AUG A3", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3W9XJdMOgpHSw55HfwRSAv/cf8f220678d503e6c3e535c00b2e636a/AUG_A3.png", "imageLocal": "img/loadout/AUG A3.png"}, {"name": "TCSG12", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2NDbY7BTBJ9R09LUilTlRf/3728337cd3ba14ed6ab9de0c22e879af/TCSG12.png", "imageLocal": "img/loadout/TCSG12.png"}, {"name": ".44 MAG SEMI-AUTO", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6W3Jz0YcQzbZ6BOPr7VVel/4c67f342964132a652f7d5821e887050/.44_Mag_Semi-Auto.png", "imageLocal": "img/loadout/.44 MAG SEMI-AUTO.png"}, {"name": "LFP586", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1zc7UtdBfCZakwbiYqBvSz/1fd3f1584de38ca7c9315d498f094276/LFP586.png", "imageLocal": "img/loadout/LFP586.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "Nitro Cell", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4pBSTw9U6l9GRnT12G6Xln/e0991bc03b48d217f510af8b611c8828/Nitro_Cell.png", "imageLocal": "img/loadout/Nitro Cell.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "\"Rtila\" Electroclaw", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7rUOk2LhYIUjvYLot7GT8Y/94b72bfbbfdf50c2c807cdbf9f5b276e/Rtila-Electroclaw.png", "imageLocal": "img/loadout/_Rtila_ Electroclaw.png"}], "iconLocal": "img/operators/kaid_icon.png", "imageLocal": "img/operators/kaid_render.png"}, {"slug": "kali", "name": "Kali", "realName": "Jaimini Kalimohan Shah", "side": true, "isAttacker": true, "squad": ["nighthaven"], "faction": "NIGHTHAVEN", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["anti-gadget", "support"], "ability": {"id": "1G0hFqUh7w2iKDyuMaHlHX", "ccid-m": "1G0hFqUh7w2iKDyuMaHlHX", "ccid-l": "iMsskzDbGfgTIgKwmjGoj", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "To talk about the LV Explosive Lance, we need to mention Kali’s CSRX 300. It’s a dangerous weapon that can breach barricades and hatches in a single shot, and create big holes in breakable walls. The LV is its under-barrel, and it can be used at the same time as the CSRX 300’s scopes.\n\nIts role is to destroy gadgets with a light explosion within a set radius. When used on a breakable wall, it will create a hole slightly smaller than what the sniper rifle would do. When shot at a reinforced wall, however, it simply lodges in surface.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "372c7733-4808-42c7-a7a4-40353599017b", "buttonNumber": 1, "id": "Sqw5GWp6wsBbXPkcijL3f", "ccid-m": "Sqw5GWp6wsBbXPkcijL3f", "ccid-l": "5SkbuHsFcN0obyLDSzsbJF", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/79QUWQqjpV0W3jq4L6PF23/85511ff11f11164bcba4c39259dfc8ed/operator-video-ability-kali.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/eo8MVlM46BQTvyHHg5i62/bfe03605a103a85da72fb1d8fe0050fe/operator-video-ability-kali.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "August 21st (34)", "placeOfBirth": "Amreli, India", "biography": "### Biography\n“Acceptance of mediocrity is the first step toward failure.”\n\nBorn to wealthy parents, Shah’s ability to achieve her goals was assured from an early age. This self-assurance hit a brick wall when she tried to join the military. Her interest in martial arts led her to enlist, but she quickly discovered that women weren’t allowed to serve in combat units. Despite all of her money and all of her social influence, she had found an obstacle between her and something she wanted, and it would not budge. Leaving the military, she created her own Private Security Company to operate within India’s borders, then a Private Military Company, NIGHTHAVEN, to operate overseas. She routinely negotiates multi-million-dollar contracts with incredibly favorable terms. Her ruthlessness is legendary, but by becoming a resource the Indian government desperately needs she has circumvented the laws that kept her from her goal and revalidated her self-perception as an unstoppable force in a largely static world.\n\n### Psychological report\nCultural similarity isn’t always a benefit when undertaking psychoanalysis. \\[…] Despite our shared heritage, Specialist Jaimini Kalimohan “Kali” Shah’s experiences are as alien to me as if she had come from the dark side of the moon. Contrary to what the romantics of this world would have you believe, money does create a boundary that can’t be crossed by any other means. \\[…]\n\nAs a child, Shah received everything she wanted, without effort or attention. She is both ambitious and arrogant, but not without merit. She excels as a leader, primarily by driving those under her command beyond their psychological and physical breaking points to “forge them anew.” The fact that those who complete her training are then inducted into an inner circle – a society of protectors, as she’s apt to call it – does little to separate her from notorious criminal overlords. And yet if I am consistent in believing that everyone has something to teach, I can’t discount her methods. \\[…]\n\nDoes Shah have any sense of nationalistic pride? It’s difficult to say. To the ultra-rich, borders are merely suggestions. Yet her assumption of the name Kali and her ruthlessness toward those who cross her both imply a connection with the country of her ancestors. \\[…] I suspect this lack of clarity with regards to her motivations is what has already put her at odds with Specialist Eliza “Ash” Cohen, but that was to be expected. Cohen is someone who lives by a very strict set of rules, and Shah’s very existence calls many of Cohen’s beliefs into question. \\[…]\n\nAs for her strengths, they are many. She didn’t get to where she is by cruising on her family’s success. Her training regimen is relentless, augmented by the best trainers and the best equipment money can buy. She is brave – some would say foolhardy – and she is cunning. Put simply, she’s someone I would be loath to face off against, so it seemed prudent to invite her to join Rainbow. Friends and enemies being what they are, we may have need of her particular strategies far sooner than we would like to admit.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6r1hk1EunQirF1IcY4TG8T/0d3fbb7508a7747fd51249b1b8ea9779/Y4S4_BADGE_Kali_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4xh8dBfzXNSwQIOaw660Xb/6df56a74ea8534be1d15f61e49aa1e24/r6-operator-kali_ 2nd (Age 44)", "placeOfBirth": "Junk Bay, Hong Kong, China", "biography": "### Biography\n“Make no excuses for who you are. Only the weak-minded will demand you make yourself smaller.”\n\nBorn and raised in Tseung Kwan O (Junk Bay), Liu’s early years were spent working alongside his father in the shipyards, stripping obsolete tankers for raw materials and parts. Growing up surrounded by hazardous materials and seeing their long-term effects on his fellow workers left Liu with an abiding respect for toxins and their effect on the human body. Initially seeking additional income, he volunteered for mine clearing duties in Yunnan and Guangxi provinces where his abilities and bravery caught the attention of key personnel within the Hong Kong Police Department. Liu then joined the Explosive Ordnance Disposal Bureau (EOD), giving him the opportunity to continue his chemistry and forensics-based education along with intense on-site training. Liu’s expertise with chemical, biological, radiological, and nuclear threats made him a clear first pick during the formation of Rainbow’s CBRN unit. Liu continues to volunteer for mine clearing duty in his spare time.\n\n### Psychological report\nSpecialist Liu “Lesion” Tze Long’s teammates have a great deal of respect for him, despite the fact that he can often drop off the radar due to his low-key style. Liu doesn’t mind that he’s overlooked; in fact, when I suggested this to him it prompted a smile. While on an operation, Liu is intense and focused, and thinks quickly on his feet. In his downtime he is soft-spoken with a wonderful dry wit.\n\nHis family’s poverty encouraged him to be philosophical about his childhood. Even now he prefers to keep life simple by spending his money and time on things that have purpose. Liu told me he isn’t a person who rails against things beyond his control, and I know from observation that he isn’t someone who counts his scars. \\[…\\]\n\nHis childhood, frankly, sounds horrific. His health was at risk from toxic materials, not to mention the physical danger of ripping apart tonnes of steel. And yet Liu remembers his past fondly, regarding the bad moments as something he was lucky enough to survive. I wondered if his optimism was a survival mechanism to weather horrifying circumstances, but Liu was eager to put me at ease. It wasn’t all bad, he said. He described how he and his father would admire the sunrise dancing across the water and take long lunch breaks to go fishing. \\[…\\]\n\nLiu continues to live close to where he grew up. His connection to the location is more than nostalgia. There’s a sense of satisfaction in knowing what it used to be and how time has affected it. Liu says both he and Junk Bay have changed for the better, and that the future can always be shaped into something good.\n\nAs he did at the start of his career, Liu still volunteers in underprivileged areas. His expertise has contributed to the clearing of tens of thousands of mines and unexploded ordnance. In particular, he’s been consulting the tech experts within Rainbow as he and operators Olivier “Lion” Flament and Lera “Finka” Melnikova look to incorporate state-of-the-art solutions into their CBRN threat unit.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2CWYSySnPAhsOHdq2OLSjv/f9e54debcfa0c8fe76012d9097b98e6e/Y2S2_BADGE_Lesion_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3R9iXCdt0dpYqg6LqFojua/ba70e0f2616df82a2f89ecf2d72b4ae0/R6-operator-lesion.png", "loadout": [{"name": "SIX12 SD", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1GTua079Xbtkpjhx96sRsW/079ed1a71a0d12b5e48e1b0d40b87110/SIX12_SD.png", "imageLocal": "img/loadout/SIX12 SD.png"}, {"name": "T-5 SMG", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1Ne8bvX8BdCALevWKMllQN/4baa3e79d323de134dd182e0272b9c3b/T-5_SMG.png", "imageLocal": "img/loadout/T-5 SMG.png"}, {"name": "Q-929", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2fRVszR5yGDHbV0AL8muso/0838dac90b66aa810daa49d36382fb64/Q-929.png", "imageLocal": "img/loadout/Q-929.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "GU", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6PJv86R8CtQCWA7a24sJE2/24f3751b2ed941ce80a4c1ef394ab7d5/Gu-mines.png", "imageLocal": "img/loadout/GU.png"}, {"name": "Super Shorty", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Dq8LDmIxAveRqXM17orUW/8169927dba6976cee92cc53c7b0960aa/r6-operator-weapon-sa-supershorty.png", "imageLocal": "img/loadout/Super Shorty.png"}], "iconLocal": "img/operators/lesion_icon.png", "imageLocal": "img/operators/lesion_render.png"}, {"slug": "lion", "name": "Lion", "realName": "Olivier Flament", "side": true, "isAttacker": true, "squad": ["wolfguard"], "faction": "GIGN", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["intel", "map-control"], "ability": {"id": "163yRyEoZtgRTVP1AqXdV9", "ccid-m": "163yRyEoZtgRTVP1AqXdV9", "ccid-l": "63031JQfuhR1a2ipJUdDhp", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Twitch provided him with an aerial drone while he served with GIGN. The EE-ONE-D helps Lion maintain quarantine by detecting movement in an area, giving an overview of hot zones or of the battlefield. His drone can stay airborne indefinitely, but he must choose the right moment to perform his scans.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "e57a6bb4-af3d-42da-8861-8183379d0638", "buttonNumber": 1, "id": "6shaBBudbj1XbcegJCG4zi", "ccid-m": "6shaBBudbj1XbcegJCG4zi", "ccid-l": "4u2miRrKae7iPt7UU9S4mG", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/24pIPAVW2mn7WNQm6YU06e/9659d09cd367c1cbf0578853d84d6657/r6-operator-lion-gadget.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "August 29th (Age 31)", "placeOfBirth": "Toulouse, France", "biography": "### Biography\n“Confusing what is right with what is easy can lead down a dangerous path.”\n\nWhen Flament’s rebellious antics landed him in hospital, disowned by his family and on the brink of homelessness, he enlisted with the French Armed Forces in an attempt to gain control of his life. Early reports flagged Flament’s skills and aptitude as well-suited for specific training in CBRN. The additional structure and strict discipline of advanced training allowed him to excel and he was quickly recruited into the 2nd Dragoon Regiment, where he worked primarily with their environmental monitoring sensors.\n\nFlament showed a fascination for bacteriology and virology, specifically vector control. Recognizing that his abilities could be better applied elsewhere, he resigned from the army and joined the Gendarmerie, with a view towards the GIGN’s Operational Support Force (FAO). His ability to remain focused and perform precise tasks under stressful conditions caught the attention Specialist Melnikova during a joint mission in Nigeria, who recommended him as a candidate for Rainbow.\n\n### Psychological report\nScars. A few of our operators have more than their fair share. Specialist Olivier “Lion” Flament, however, has used the army to help heal his. No outlet is perfect, and battle fatigue has a way of piling up, but he channels his frustrations into determination. His approach is motivated by such singular focus that it makes him one of our more formidable and consistent team members. \\[…\\]\n\nSomething that I try to impart to our team is the value of introspection. Flament, with his Catholic faith, already understands this. He openly discusses his regrets and I can see they give him clarity and purpose. The past isn’t something that he’s forgotten or tried to erase. It motivates him, but has no hold on him. \\[…\\]\n\nIn my sessions, I ask for one good thing that happened recently, no matter how small. Some have described a perfect breakfast they had, or the movie that made them laugh so hard they cried. Flament talks about his love of heavy metal music, his faith, and his son.\n\nWhile the pain of being disowned by his father may never truly fade, it’s prompted Flament to engage with his son more constructively. He treasures their relationship, perhaps because he realizes how close he came to never knowing Alexis at all. In the pictures Flament shares with me I can see the results of his efforts. \\[…\\]\n\nThree of our GIGN Operators – Specialists Emmanuelle “Twitch” Pichon, Gustave “Doc” Kateb, and Flament – are all haunted by a shared tragedy. This friction over Flament quarantining doctors and nurses who later died can’t continue. Joint sessions with Kateb and Flament are already planned. We will resolve this, one way or another. \\[…\\]\n\nFlament tells me that, thanks to his military service, he’s reinvented himself – but that suggests a different person. I think it’s more like reshaping. A dedicated operator, a tireless volunteer… A caring father. He’s always been these things. His tattoo – the French Army’s motto, \"Give me a chance to shine\" – tells Flament’s story. For him to continue growing, he will have accept his intrinsic ability to change.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3gfdjXFezusaerCakMpfQ2/4565b28edd241b7fd3b0eba9c97d54f2/Y3S1_BADGE_Lion_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/O1pBwXRND1RV2WN5OrEr7/787e4d31e1b74ae9700ffac675205de3/R6-operator-lion.png", "loadout": [{"name": "417", "slot": "primary", "subtype": "Marksman Rifle", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5djkS4YtAtOF0vBmg0T60x/ea2b1ff7e5367e66c99bc7ad7e95bfe3/417.png", "imageLocal": "img/loadout/417.png"}, {"name": "SG-CQB", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5JoL3b36Fsztt9Q2XYmrbJ/dacec96948d3f8fe92914a69b9aac593/SG-CQB.png", "imageLocal": "img/loadout/SG-CQB.png"}, {"name": "V308", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5YBZe76NUDO32eF66wW90g/488c315743d59230962a4d67618223d6/V308.png", "imageLocal": "img/loadout/V308.png"}, {"name": "LFP586", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1zc7UtdBfCZakwbiYqBvSz/1fd3f1584de38ca7c9315d498f094276/LFP586.png", "imageLocal": "img/loadout/LFP586.png"}, {"name": "P9", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6Fd1cl17KA0CtgodEiiY6v/d0f145ea72f2aacbd04260ba7d8f1c74/P9.png", "imageLocal": "img/loadout/P9.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "Frag Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4GZsPHbm9H0k5EWz7TMkwO/33b9007bc6ee03dab15cfa15eb69e096/Frag_Grenade.png", "imageLocal": "img/loadout/Frag Grenade.png"}, {"name": "Stun Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3XnK8s1iQJQu5cfr6UyQfK/429480b96d6d6d6b830c32c75d2608f5/Stun_Grenade.png", "imageLocal": "img/loadout/Stun Grenade.png"}, {"name": "EE-ONE-D", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7fRknnWl2K2qjKle1t79j/0506d25798aeb0691c8a576665050f7d/EE-ONE-D.png", "imageLocal": "img/loadout/EE-ONE-D.png"}], "iconLocal": "img/operators/lion_icon.png", "imageLocal": "img/operators/lion_render.png"}, {"slug": "maestro", "name": "Maestro", "realName": "Adriano Martello", "side": false, "isAttacker": false, "squad": ["viperstrike"], "faction": "G.I.S.", "speed": 1, "armor": 3, "health": 125, "difficulty": 2, "roles": ["anti-gadget", "intel"], "ability": {"id": "31DrHH5OmiriVuckdYt9gW", "ccid-m": "31DrHH5OmiriVuckdYt9gW", "ccid-l": "C5FQqPZcnrXiJ1eQLL9OW", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Maestro uses a remote-controlled turret firing high-energy laser beams. Once affixed to the floor or wall, Maestro can remote-surveil and provide overwatch in a location through the swivel-mounted camera. When the camera device breaks open to fire a laser beam the core is exposed to damage. Otherwise, the turret is unaffected by bullets and melee. Lastly, Evil Eye can see through smoke.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "fcc19fa0-5efb-4af6-8175-92e16e7d3f4d", "buttonNumber": 1, "id": "4HbTtJNoHZLE1ywcLSGykC", "ccid-m": "4HbTtJNoHZLE1ywcLSGykC", "ccid-l": "1ekrAZv29EFB5Mqj18FziW", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5ZB1qE7ZAMuXT5Sw7U3rpq/b17eb022bbef458a5e4715e929c38c27/operator-video-small-maestro.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3XJ5xwPsx1Y4as985VxbWY/9f13e6f58a1083acbdffaa6828b46b2e/operator-video-small-maestro.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "April 13th (Age 45)", "placeOfBirth": "Rome, Italy", "biography": "### Biography\n“Did I ever tell you about the time we tree-jumped into a Congo swamp at night? No? Oh, it’s a good one.”\n\nAdriano \"Maestro\" Martello, oldest in a family of eight children, grew up in Rome, but attended the Military Academy of Modena at 18. He joined the Carabinieri and earned a spot as an Explorer Paratrooper in the 1st Paratrooper Regiment known as Tuscania. After several distinguished tours where he earned Silver and Bronze Medals of Military Valor, Martello qualified for Gruppo di Intervento Speciale (Special Intervention Group or G.I.S.) and participated in joint operations in Iraq, earning a facial scar from a roadside IED. He engaged in multiple actions against homegrown threats in Italy and eventually became an instructor helping train Tier 3 units in the Italian military.  \nAfter Martello’s tour was completed, he went into private consultation where his courses quickly became a top-rated operator bootcamp for teaching advanced techniques to Tier 3 and Tier 2 units, as well as private military companies. The Tuscania eventually convinced Martello to re-enlist to help upgrade one of their units to a Tier 2 Special Forces classification, and this enabled him to join Rainbow as a representative of the Italian Units.\n\n### Psychological report\nI have no doubt that Specialist Adriano Martello (AKA: Maestro) is a natural leader. He had earned the nickname Maestro due to his willingness to sacrifice first place in order to help other soldiers during basic training, and while records indicate that some soldiers didn’t appreciate the handholding, I think it refined Specialist Martello’s teaching methodology. \\[...] I did review his school records in regards to the fights he got into, and I believe he was keeping his brothers and sisters out of trouble by fighting for them. \\[...]\nHe initially entered the military to ease his parents’ financial burden in raising eight children and he carries that sense of responsibility into his units. He cares about the men and women he serves with and has an affinity for bringing out the best in others, even if it’s with a bit of good-natured bluster and perhaps more vulgarity than some of our more reserved operators are used to. I suspect Specialist Martello enjoys cussing for effect though there is no doubt that he teaches through anecdotes. He presents himself as genuine, however, and it’s an undeniable part of his charm because it comes off without any sort of duplicity. \\[...] \nSpecialist Martello will make an excellent Tactical Control Commander one day, but his biggest liability is his own wanderlust. \\[...] He loves pursuing challenges to his own detriment. Once he’s conquered an objective, there’s little keeping him rooted. He has personal ties with Specialist Seamus \"Sledge\" Cowden (Joint Operations in Iraq before Article 5 was instituted), enough that to my understanding he’s invited Specialist Cowden over to visit his family when the pair were cycled off duty rotation. Even then, I doubt it’s enough to keep him tied to Rainbow Operations. His ties to Specialist Aria \"Alibi\" de Luca may be a different story, however. They worked closely together during Operation Spider Wasp, with Specialist Martello’s unit taking down organized crime targets based on Specialist de Luca’s intel. Whatever other history they share remains unknown to me… for now. \\[...]\nIt is my estimation that Specialist Martello needs a carrot to remain invested, and that means presenting him with challenges that he’s likely to fail at. It’s why I recommend Specialist Martello step into the boxing ring with Specialist James \"Smoke\" Porter, for example, and pit him against a boxer with more training and skill. From my records, Specialist Martello grew up in the lower income neighborhoods along Rome’s Lungotevere, where he befriended local Romany children. He boasts about boxing with the Romany, a strong tradition in that culture, and I believe that training him with Porter will encourage positive memories that will link his childhood with Rainbow. \\[...]\nAnother option is to arrange for Specialist Mike \"Thatcher\" Baker to take a personal interest in Martello’s development. Martello has nothing short of genuine respect for Specialist Baker, enough to leave him tongue-tied around the SAS veteran. That state of deference may forge a strong enough bond to keep Specialist Martello invested in the Rainbow program.\n\n-- Dr. Harishva Pandey", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/XK43imgD0tc0xrk0tgTCQ/0402cc95cbd525debafa1aab0fdd8385/Y3S2_BADGE_Maestro_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5DSFt6OEgGRcIOjC8YmdEV/e858ba7e2b695d4d792b84f2fcd95c3a/R6-operator-maestro.png", "loadout": [{"name": "ALDA 5.56", "slot": "primary", "subtype": "Light Machine Gun", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/39yB6TFl9ph6Rb4bDV4lqK/7f9b3abf8dff19bacc026a7212849ca4/ALDA_5.56.png", "imageLocal": "img/loadout/ALDA 5.56.png"}, {"name": "ACS12", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/13z63kT1NLzn1U99o7WC4T/8655d3200f24b87246c36f2622603457/ACS12_PB.png", "imageLocal": "img/loadout/ACS12.png"}, {"name": "Keratos .357", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/15caVAsSCr8Rsb5Hid36uc/59632c4f90727931041ced62a620018b/Keratos_.357.png", "imageLocal": "img/loadout/Keratos .357.png"}, {"name": "Bailiff 410", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/N8FLbo4fsNyBe8msKgRhT/8f403dc0b58087bcafab786dd95ba33f/Bailiff_410.png", "imageLocal": "img/loadout/Bailiff 410.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "Evil Eye", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/n2rfPidCv630jQEfnEWwb/42d454d0771218eb8f27f6d17d8a073e/Evil-Eye.png", "imageLocal": "img/loadout/Evil Eye.png"}], "iconLocal": "img/operators/maestro_icon.png", "imageLocal": "img/operators/maestro_render.png"}, {"slug": "maverick", "name": "Maverick", "realName": "Erik Thorn", "side": true, "isAttacker": true, "squad": ["ghosteyes"], "faction": "THE UNIT", "speed": 3, "armor": 1, "health": 100, "difficulty": 2, "roles": ["breach", "front-line"], "ability": {"id": "6QAKx83o7rMkFWSE0m0BjY", "ccid-m": "6QAKx83o7rMkFWSE0m0BjY", "ccid-l": "14MsSpEp2q8QCEWgVAB1jK", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Maverick’s D.I.Y. blowtorch can breach any surface, including reinforced walls and hatches. It requires a steady hand and knowledge of the environment to create small holes and lines of sight. Maverick must be in close range to use his gadget on the chosen surface. This torch makes almost no sound but it runs out of fuel quickly. Nevertheless, the high precision of this gadget makes it a very creative tool to use hands-on without relying on digital technology.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "f62d2152-cae7-46d3-a422-e794dc2dc49a", "buttonNumber": 1, "id": "5s7qQNFZZ1SsVYjjQ8oxWs", "ccid-m": "5s7qQNFZZ1SsVYjjQ8oxWs", "ccid-l": "5RfpW7TSv0BazD0dKaUbry", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5TM95LPISC9D15sTvuMUe9/d7c13e9f996f7d57039159a656e4a982/operator-video-small-maverick.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7jsUU7z2wTQ6bAG6ofjFlX/b0a6810ed67fad70484893afa5aa2cf9/operator-video-small-maverick.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "April 20th (Age 36)", "placeOfBirth": "Boston, Massachusetts", "biography": "### Biography\n“The Devil’s in the details… that’s where you’ll find me.”\n\nBostonian Erik Thorn came from a multilingual home and ranked in the top 2% in intelligence. After high school, he enlisted with the U.S. Army and rose in rank over a short period of time. He learned Dari and became an Intelligence Officer, serving in Kabul as foreign reporters, adventurers, and criminals flocked to the city. Thorn was well known in the underground club circuit, and even among locals as a proficient Buzkashi player.\n \nThorn was invited into the Unit as their regional specialist. Following selection, he remained in country, gathering intel, building networks of allies and safe houses, and tracking hostiles. As the situation in Kabul worsened, Thorn kept tabs on Americans, rescuing them when necessary and helping locals escape the violence. He was investigating a missing reporter when The Unit lost contact with him. After two years of silence, he re-emerged with enough intel to dismantle a major insurgency operation. There were still questions regarding his disappearance, but he was exonerated and his testimony sealed. His successful missions, along with his expertise, gained him the attention of Six.\n\n### Psychological report\nI knew Specialist Erik “Maverick” Thorn well before his disappearance. He was a legend among Intelligence Collectors as the spook who “went native”. He’s often difficult to engage with since he’s incredibly intelligent and able to read others with remarkable intensity, but ask him about Kabul or Buzkashi and he can barely contain his excitement. \\[…\\]\n \nI’ve never seen old men sell their services on street corners to write love letters before, so it’s hardly surprising he took to Afghanistan… it’s a bewitching culture. When expats began partying in underground clubs and drinking at restaurants, Specialist Thorn admitted that he knew the “Kabubble” was going to pop hard, that Westerners would become easy targets. He saw the writing on the wall before anyone else did. \\[…\\]\n\nFrom a young age, Specialist Thorn handled an almost overwhelming amount of sensory input that would have shut down most kids. Instead, he compartmentalized and deconstructed everything around him as a way to function. It’s one reason I think he internalizes his emotions. \\[…\\] His parents were loving but rigid—they barely let him explore his own neighborhood. It’s what drove him to join the army, to experience a world he could only dream about. It’s hardly surprising Kabul left such a heavy imprint on him. I don’t think he emerged from his shell until he started traveling, and even now his mind is with us, but his heart is in Kabul.\\[…\\]\n\nSpecialist Thorn has displayed remarkable empathy stemming from his ability to watch, listen, and dissect. People confide in him and it’s why he survived in Kabul as a fly on the wall. \\[…\\] I’m still going through debriefs regarding his disappearance. It reads like a terrifying thriller but the scars that came with his experience have only tied him more closely to Afghanistan. I think his tattoo is a reminder of that life.\n\n-- Dr. Harishva Pandey", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3DXiYgVT71qGscYmFMgayj/d6c40a7dabdfecb92b637bec83003a58/Y3S3_BADGE_Maverick_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5JkQYq5w8jibdznsDl2yvy/3ec75ea42f9a54238f569797a3e185a6/r6-operator-maverick.png", "loadout": [{"name": "AR-15.50", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4lGGEGZLkbldz114Wl5hCo/78a04c46654f80fae03e730bd79f3563/AR-15.50.png", "imageLocal": "img/loadout/AR-15.50.png"}, {"name": "M4", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3jhi90ycmuc8mAiuSXFoCi/bcf354459e7becd6ede52ee97917c832/M4.png", "imageLocal": "img/loadout/M4.png"}, {"name": "1911 TACOPS", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/189UukZ6fVnvQR6LJtLYry/6eec29603d5b7b0ca8cab6ac0ef083ac/1911_TACOPS.png", "imageLocal": "img/loadout/1911 TACOPS.png"}, {"name": "C75 Auto", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3wUuefwPjU705mZkTdJ9UH/8ccb11884cfa34c176ac5500af139177/C75_Auto.png", "imageLocal": "img/loadout/C75 Auto.png"}, {"name": "Reaper MK2", "slot": "secondary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5RC060K72yG2OXMq43lgrv/83df616f6d4a2dde6293cc97449159eb/reaper-mk2.png", "imageLocal": "img/loadout/Reaper MK2.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c4636845a04478432c48be8c29aee/Smoke_Grenade.png", "imageLocal": "img/loadout/Smoke Grenade.png"}, {"name": "Stun Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3XnK8s1iQJQu5cfr6UyQfK/429480b96d6d6d6b830c32c75d2608f5/Stun_Grenade.png", "imageLocal": "img/loadout/Stun Grenade.png"}, {"name": "Frag Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4GZsPHbm9H0k5EWz7TMkwO/33b9007bc6ee03dab15cfa15eb69e096/Frag_Grenade.png", "imageLocal": "img/loadout/Frag Grenade.png"}, {"name": "Breaching Torch", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4rPBvxDKsKiQCMjt7GxJMw/09e45c68bbc41c1721acbbe0257e2465/Breaching-Torch.png", "imageLocal": "img/loadout/Breaching Torch.png"}], "iconLocal": "img/operators/maverick_icon.png", "imageLocal": "img/operators/maverick_render.png"}, {"slug": "melusi", "name": "Melusi", "realName": "Thandiwe Ndlovu", "side": false, "isAttacker": false, "squad": ["wolfguard"], "faction": "ITF", "speed": 1, "armor": 3, "health": 125, "difficulty": 1, "roles": ["intel", "crowd-control"], "ability": {"id": "6WOdbM9wJTglZ0NycZPoWY", "ccid-m": "6WOdbM9wJTglZ0NycZPoWY", "ccid-l": "6iyqffotmUAcaOfJjM1ZJM", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The Banshee Sonic Defence is deployable on surfaces, much like Maestro’s Evil Eyes, but they don’t require any manual control. As soon as an opponent walks close enough to it, it will release its scream and slow them. It can be destroyed, but since it’s bulletproof, Attackers will have to dispense some utility or strike it up close.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "239e37ea-cba7-4f91-a792-688ed869d367", "buttonNumber": 1, "id": "SvK9sbWvDlf2cF9F16g8h", "ccid-m": "SvK9sbWvDlf2cF9F16g8h", "ccid-l": "7bhkAGjtT36HzSIvGLMMJb", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7zBNFGgeNVIKeRmlNwb8QP/ad0954c93df65993c4bdcac6905b90a9/r6s-operators-ability-melusi.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "melusi: unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2I6t9t924hZKZvhlbEGb85/b16aa9f3d097a8060c4eea797a4a4583/r6s-operators-ability-melusi.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "June 16th (Age 32)", "placeOfBirth": "Louwsburg, South Africa", "biography": "### Biography\n\n“Understanding is the only tool that vanquishes ignorance.”\n\nBorn in the small town of Louwsburg near the Ithala Game Reserve, Ndlovu spent many years exploring with her friend, Elna Gardiner. As they grew, so did their appreciation of and sense of responsibility for the animals on the reserve. The threat from poachers fueled their determination, and though haunted they focused on the lives they could save, rather than past casualties.\n\nNdlovu signed up with the South African National Defence Force to broaden her skillset and fund her field ranger training. Her persistence and dedication brought her to the attention of the 1 Parachute Battalion, until an ambush in the Central African Republic left her badly wounded.\n\nWhen Gardiner, who had become an accomplished veterinarian, asked for help defending Hluhluwe–Imfolozi Park, Ndlovu resigned from the military and began training local women in tracking, interception, and surveillance. Together, they are the heart of the Inkaba Task Force Anti-Poaching Unit.\n\n### Psychological report\n\nSpecialist Thandiwe “Melusi” Ndlovu strikes me as someone uniquely suited to carrying out South Africa’s ongoing conservation efforts – she is efficient, precise, and accepts that greed remains one of humanity’s greatest challenges. When I asked if she thought we would ever be rid of it, she smiled and said, “It’s good to dream, Doctor.” \\[…\\]\n\nHer relationship with Elna began the day they discovered that their names meant the same thing: “beloved”. It wasn’t always an easy friendship, but their shared adoration for the animals of the game reserve and propensity for exploring where they absolutely should not have been saw them through a lot of challenges. \\[…\\] Ndlovu's stoic comparison between the wounded of the battlefield and the cries of poisoned elephants is in stark contrast to Elna’s compassion. It’s interesting that one focused on prevention, and the other on triage. In the end, their divergent paths create a complementary partnership. \\[…\\]\n\nNdlovu refuses to speak about the ambush that decimated her unit. From the reports it’s clear the operation was a harrowing ordeal from which she was lucky to escape. I tried approaching the topic from the angle of latent survivor’s guilt, but she brushed off my attempts. She seems more affected by the tragedies she witnessed on the reserve – comparing land mines to snares, and mentally turning the the reserve into a warzone. \\[…\\] Her profile indicates that any negative feelings have been transmuted into action, in the forms of training the women of her anti-poaching unit and the web of drone-based surveillance she has organized to oversee their operations.\n\nOn the topic of her work, she is effusive. Ndlovu believes strongly that there must be education and a shared responsibility within the community, that simply fighting poachers is not enough. She takes great pride in the accomplishments of the women under her command, and in their contribution to the well-being of the animals they protect. She cares, too, about improving the local economy, but this concern is secondary to providing what she calls “self-directed futures” – believing that these, above everything, will counter the lure of easy money.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/74H52a9GMql8wamIy6WqH5/9fddba49258152835da7cdac8c566663/Y5S2_BADGE_Melusi_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7xlDG41BwglAg68IGGhvf3/73cd220cd35d5e58dc30f0f3f551b923/r6s-operator-melusi.png", "loadout": [{"name": "MP5", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/60YbOvSBQt6ZUlu8YDXoZm/51ef3857b2986de700262432e8433714/MP5.png", "imageLocal": "img/loadout/MP5.png"}, {"name": "Super 90", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1TLWSu0xHJlAsfEfafeC9X/f9647e70a18962bf1627095c8b46832e/Super_90.png", "imageLocal": "img/loadout/Super 90.png"}, {"name": "ITA12S", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5G4DroaSdqHzJWCe7qqbHZ/5dd2e03f853182c78a1e7fcbc642f0cf/ITA12S.png", "imageLocal": "img/loadout/ITA12S.png"}, {"name": "RG15", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2LNSsp7B7wUnnPUweir7Jm/9f66d53be7a63a17a55253a0bea6eec1/RG15.png", "imageLocal": "img/loadout/RG15.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "BANSHEE SONIC DEFENSE", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/49ixqWhGgjvHu0Ay8JzeSH/c6a3fe584847850186e15c7fb4244385/r6s-operator-ability-melusi.png", "imageLocal": "img/loadout/BANSHEE SONIC DEFENSE.png"}], "iconLocal": "img/operators/melusi_icon.png", "imageLocal": "img/operators/melusi_render.png"}, {"slug": "mira", "name": "Mira", "realName": "Elena María Álvarez", "side": false, "isAttacker": false, "squad": ["viperstrike"], "faction": "G.E.O.", "speed": 1, "armor": 3, "health": 125, "difficulty": 3, "roles": ["intel", "support"], "ability": {"id": "5n8nJhwM4XUl49pKOwY3tm", "ccid-m": "5n8nJhwM4XUl49pKOwY3tm", "ccid-l": "43ni63isr8RIRqlIXIT4fV", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "A specialized laminated glass, which when deployed with oxyacetylene can carve out a one-way mirror on any wall.\nIf the air pressure is disrupted, however, the glass is ejected and creates a daring opening for both defenders and attackers.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "8c281853-4acf-4b88-b838-413c528f2d98", "buttonNumber": 1, "id": "20e5vFPKhAMKwFiVVjlPin", "ccid-m": "20e5vFPKhAMKwFiVVjlPin", "ccid-l": "7tzSh24fvGFr0aV5ljrfZI", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Ek42KH64EbxykHnRjbGgm/624a0c3baec6628fdb6809057e83ee56/R6-operators-gadget-mira.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "November 18th (Age 39)", "placeOfBirth": "Madrid, Spain", "biography": "### Biography\n“Think of me as your conscience. I see everything, and I’m just as ruthless.”\n\nÁlvarez is a highly creative operator with the unmatched ability to dominate close-quarters urban environments. Working alongside her father in his auto repair shop helped form her intricate understanding of machinery and prompted her to study mechanical engineering and metallurgy at university. Instilled with a strong sense of justice and an obligation to serve, Álvarez joined the Cuerpo Nacional de Policía. She saw the need for better equipment and developed new bulletproof materials to protect her teammates while on operations. Encouraged to join the Grupo Especial de Operaciones, she beat more than 100 other recruits for the coveted position. The reinforced armor she wears is her design. Álvarez was hired as Rainbow’s Director of Research and Development before being added to the combat roster so that she could better test her developments and improvements under field conditions. She flies helicopters in her spare time.\n\n### Psychological report\n\nSpecialist Elena María “Mira” Álvarez thinks on her feet. Someone this adaptable and versatile is difficult to predict… as they should be. She takes risks, though, and I’m hoping they’re calculated ones. Álvarez is one of the operators who most strives to be a hero. Ferociously protective of teammates and those she considers friends, she can nonetheless dominate an operation, forcing others to blend their tactics with hers if they wish to succeed. \\[…\\]\n\nÁlvarez enjoys her time in the lab and I’m grateful she accepted my offer to become head of R&D. Working surrounded by machinery reminds her of her father and the strong bond they continue to share. \\[…\\] As far back as she can recall it was only ever the two of them, though her father’s shared memories of her grandmother gave her a second role model to look up to. One story stands out in particular: While working late in his garage, her father was pinned under a car. Álvarez found him. She was seven years old. Refusing to leave him, she struggled with the heavy jack – despite his protests – and got him free. Only then did she run for help. \\[…\\] This is the loyalty and stubbornness that I see in her, and that her team appreciates. It comes from a kind heart. \\[…\\]\n\nWhen not working, Álvarez is restless, which she’s managed to channel into her art. Her metal sculptures are a source of great pride and she showed me photos of her portfolio. The way she incorporates used machine parts and ballistic glass is enchanting. \\[…\\] Álvarez uses her artistic sensibilities to visualize scenarios with unique clarity. The team should be encouraged to make better use of his talent. \\[…\\]\n\nHer ongoing rivalry with Specialist Eliza “Ash” Cohen is a clash of two strong-willed people. Both have solid leadership skills and both care about their teams. They simply approach challenges differently. We need to work through some scenarios where they can both apply their strengths to reach an acceptable outcome. Only through joint success will they see the value of each other’s approaches.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/u1KR6aogjLncAtaVOciTc/ba730583f9c20cad6d3ca996d366a707/Y2S1_BADGE_Mira_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6wZplm8r956WXGrSYlULTU/0f9c0a33abfd42d9102723886850b8ca/R6-operator-mira.png", "loadout": [{"name": "Vector .45 ACP", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7D1cDf13FqUhoLihzvuPln/068aa7e507155598449c58c0a49a90d6/Vector_.45_ACP.png", "imageLocal": "img/loadout/Vector .45 ACP.png"}, {"name": "ITA12L", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem
