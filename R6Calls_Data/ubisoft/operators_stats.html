<script>
const OPS=[{"slug": "ace", "name": "Ace", "realName": "Håvard Haugland", "side": true, "isAttacker": true, "squad": ["nighthaven"], "faction": "Nighthaven", "speed": 2, "armor": 2, "health": 110, "difficulty": 1, "roles": ["breach", "anti-gadget"], "ability": {"id": "5Lx6zOMIBZpc6seA0xfT5C", "ccid-m": "5Lx6zOMIBZpc6seA0xfT5C", "ccid-l": "2c7Rb7NEBo6gAvTasqhz47", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "With the S.E.L.M.A. Aqua Breacher, water is the name of the game. It makes use of hydraulic pressure to burst through breakable and reinforced surfaces. The cylinder is thrown on whatever Ace is trying to breach, and then it opens to fully deploy. It explodes one time on floors, ceilings and hatches, but on walls the cylinder rolls down to deploy up to two times, if space allows. Each of these deployments leaves a clean rectangle breach, combining to create a hole big enough for an Operator to go through easily.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "a4cbbd77-c484-419f-be77-b5744b5919b1", "buttonNumber": 1, "id": "6u04pvj2mo1rFVYH6BQwf3", "ccid-m": "6u04pvj2mo1rFVYH6BQwf3", "ccid-l": "3f2l7thJMjXzQ9OVDhEnAL", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4N7ZedDh9aXQbE9YERnIEa/d49e6cf19c9f3f7b705fea1e13bfde1b/r6s-operators-ability-ace.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "ace: unique abilities", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4rCaW9Bh3xffQFRNwWRijz/f79d047cdc318ca8e00dff181dd4d7da/r6s-operators-ability-ace.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "March 15th (Age 33)", "placeOfBirth": "Lærdalsøyri, Norway", "biography": "### Biography\n\n“The perfect shot, like the perfect rescue, is all about the framing.”\n\nBorn in a quiet but historic village, Haugland benefited early on from high praise and a lack of competition. Consistently the best at whatever he set his mind to, he easily imagined himself as an admired pediatric surgeon and enrolled in medical school. However, he soon discovered that memorizing theory wasn’t to his liking and instead opted for paramedic training in order to get into the action more quickly.\n\nThe Norwegian Armed Forces brought him into a new world of achievement. He completed basic training and joined the Norwegian Home Guard, where he acquired a reputation for heroics. After completing his service obligation, he was accepted into the Forsvarets Spesialkommando and took part in a prominent hostage rescue soon afterward. As part of a joint UN operation in Somalia, his tendency toward theatrics and his impulsive nature resulted in him saving Kali’s life. The offer to join NIGHTHAVEN swiftly followed.\n\n### Psychological report\n\nIt takes a certain kind of person to put themselves on the frontline of disaster relief services, and at first glance Specialist Håvard “Ace” Haugland doesn’t fit the profile. He’s arrogant, brash, and self-interested. Yet his outward image is based entirely on altruism, and his social media following reflects his desire to be perceived as the ultimate upstanding citizen. He has a certain hunger, not just for medical emergencies and extraction, but for positive publicity. \\[…\\]\n\nI gather his love of attention comes from growing up in a small village, where he was regarded as something of a local hero. I was surprised to learn of his early ambition to become a pediatric surgeon – a role he seems to regard as the pinnacle of social standing. Given his preference for the practical over the theoretical, however, I’m not surprised he pursued paramedic training instead. His conscription into the army and subsequent role as combat medic only further reinforced his “golden boy” image. \\[…\\]\n\nThe man himself, constructed as he is around his desire to tightly control how he’s perceived by others, remains somewhat of a mystery. His persona drives him to be congenial and to excel in working closely with his peers, at least until the time comes to give a post-mission interview. But behind the façade there is a struggle that I wonder if Haugland is aware of. Certainly if he has insecurities they’re in no way crippling, but it is strange to attempt to analyze someone who so fully inhabits their surface-level traits.\n\nHe enjoys exploring the world for the photo opportunities such travel provides, but he maintains that his heart remains in Norway. I do wonder though, whose approval he’s trying to gain, and whether success is even a possibility. \\[…\\] When I asked about his long-standing association with Specialist Jaimini Kalimohan “Kali” Shah he was quick to sing her praises. I believe that she’ll retain his loyalty for as long as he’s committed to fame and fortune, but I fear for their relationship – and his mental health – should he ever truly sate his desire for acclaim.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/dgG7GmXY1HgfeEE2gI1H9/06bd3917c8fc19f61654490019ef25fb/Y5S2_BADGE_Ace_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3VknamIo6E87ELFbLqk1dx/a54751fe2435104ed35b5e6ee660ef72/r6s-operator-ace.png", "loadout": [{"name": "AK-12", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7KAZZgnpqD07y47jVVXEuh/e0d7e67101f8f966aa6e1c59e835454f/AK-12.png", "imageLocal": "img/loadout/AK-12.png"}, {"name": "M1014", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2pUiVbwNnQnDTesmWXktqW/f27c1fab9a354bb89cbe309a688f5e02/M1014.png", "imageLocal": "img/loadout/M1014.png"}, {"name": "P9", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6Fd1cl17KA0CtgodEiiY6v/d0f145ea72f2aacbd04260ba7d8f1c74/P9.png", "imageLocal": "img/loadout/P9.png"}, {"name": "Breach Charge", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1OgTMhyF1FBsSAo4njk26m/99b7a971f81b9195b3c3536b51d52893/R6S_Breach_charge.png", "imageLocal": "img/loadout/Breach Charge.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "S.E.L.M.A. AQUA BREACHER", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2sjKOnwHeOX2xn3iIpja2A/e265f675c905ac25c23ed11fc85589bb/r6s-operator-ability-ace.png", "imageLocal": "img/loadout/S.E.L.M.A. AQUA BREACHER.png"}], "iconLocal": "img/operators/ace_icon.png", "imageLocal": "img/operators/ace_render.png"}, {"slug": "alibi", "name": "Alibi", "realName": "Aria de Luca", "side": false, "isAttacker": false, "squad": ["viperstrike"], "faction": "G.I.S.", "speed": 3, "armor": 1, "health": 100, "difficulty": 3, "roles": ["intel", "trapper"], "ability": {"id": "7uNy32nEMJ8arcN5bU7vCw", "ccid-m": "7uNy32nEMJ8arcN5bU7vCw", "ccid-l": "vIuNoCpbn0xcVgEUoblFd", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Prisma projects holograms identical to Alibi in an idle position. If you shoot or touch the holograms, you’ll be marked and pinged for the next few seconds. If Prisma is deployed outside, a false “Defender Outside” warning is triggered for Attackers. To add an element of surprise, Prisma conceals the identity of any Defender who ventures outside. Any bullet, melee, or explosives damages Prisma, and will shoot through the hologram. Be careful not to stand too close.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "ca21a533-9c24-4cc8-9052-07ceeea18632", "buttonNumber": 1, "id": "6dSn543d1VB1MpBBLdq2PQ", "ccid-m": "6dSn543d1VB1MpBBLdq2PQ", "ccid-l": "6ewy3ZhWjjQ9aZliA8E52B", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/ToA62c3bymDN6yTF94Fgu/de43b85ec691549b744431bd1ac79418/operator-video-small-alibi.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2q6eWD2lvlPIOMz16uIxRD/a5ad8e11efe6816541506e826b0546ca/operator-video-small-alibi.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "December 15th (Age 37)", "placeOfBirth": "Tripoli, Libya", "biography": "### Biography\n“Never reveal the cards you were dealt.”\n\nAria \"Alibi\" de Luca was born in Tripoli, Libya and immigrated with her family when she was three years old. Her father managed a small ordnance manufacturer, using his extensive North African contacts to open up exports to that region. De Luca earned her understanding and usage of Italian firearms through the family business and training on the shooting range. At 18, Aria entered the European Championships organized by the European Shooting Confederation, and won gold in both the 10-metre running target and 10-metre air pistol divisions. Following the event, a Carabinieri recruiter convinced her to join the police force. \nDe Luca’s precision shooting skills and professionalism shot her up the ranks quickly, and she served for a time with the elite Raggruppamento Operativo Speciale in fighting organized crime. She eventually earned a spot in the prestigious Gruppo Intervento Speciale (G.I.S.), and following a successful operation in Afghanistan despite being separated from her unit, she was singled out for undercover work in organized crime. She infiltrated the Vinciguerra Crime Family as an arms dealer and spent several years among them before bringing them down from the inside. A newspaper leak of impending operations against the Vinciguerras then forced the G.I.S. to accelerate their initiative. \nFollowing her undercover work and the successful dismantling of the Vinciguerra Crime Family, Aria de Luca received the invitation to join Rainbow as a capable operator.\n\n### Psychological report\nSpecialist Aria de Luca (AKA: Alibi) presents a multi-layered façade, undoubtedly stemming from her years of undercover operations, but I suspect it’s a protective measure likelier rooted in her childhood. \\[…] She carries a deep-seated hatred for crime families (that much is obvious--it’s the closest I’ve come to seeing her sophisticated veneer crack) and I think it may compromise her ability to operate rationally when it comes to organized crime. \\[…] Thanks to my contact within the Carabinieri’s Chief of Staff office, I was able to gain access to Specialist de Luca’s psych evals following her application to join the G.I.S.. Cross analyzing that with old police records and her family’s hospital visits, I believe her father was the victim of pizzo or a protection racket… unless de Luca Sr. was singularly unlucky enough to repeatedly break fingers, fall down stairs, and break his own arm… twice. Specialist De Luca was never herself injured, and shows the same strong constitution and mental fortitude that we come to expect from all our operators. Psychologically, however, the wounds are deep and I suspect that her father’s brush with organized crime has set our “Alibi” on her path. \\[…]\nAlibi as a codename is also rather telling, considering the circumstances that cut short her undercover operation against the Vinciguerra crime family. On paper, Specialist de Luca is a decorated hero of the G.I.S. with a Gold Medal for Civil Valor for her efforts, but if you dig a little, she has her detractors who believe she was the source of the leak that nearly sabotaged the G.I.S. investigation. \\[…] Specialist de Luca was enjoying a meteoric rise within the Vinciguerra crime family as an arms dealer when she gained access to a compound outside of Genoa that was central to the Vinciguerra's human trafficking operations. As a naturalized immigrant herself, it would seem that when Specialist de Luca saw the dozens of refugees waiting to be sold into slave labor and prostitution at the hands of the Vinciguerras, it broke through her well-crafted defenses and compelled her to act. \\[…] I know for a fact that she tried to convince her superiors to raid the Genoa compound and that they refused because they were still gathering intel. I know that the reporter who cited a confidential informant in his exposé on the Genoa compound received his intel in the days following Specialist de Luca’s meeting with her bosses.\\[…]\nI’ll state this for the record… if Specialist de Luca did leak the information to spur the G.I.S. into action and to save those lives in Genoa, then I am somewhat relieved. It proves that there are lines Specialist de Luca will not cross, and this may prove important. I suspect that Under-Secretary-General Barston used backchannels to put Specialist de Luca’s service jacket on my desk, and that he isn’t a supporter of the Rainbow Program. Whatever he hopes to gain with this maneuver, I can state with no modest degree of certainty that Specialist de Luca remains unaware of this political agenda. But she likely has a part to play in whatever Under-Secretary-General Barston may have planned. \\[…]\nIf we want to get her on our side of things then Specialist (Maestro) Martello’s inclusion in Rainbow serves us for both his skills and his ability to get past Specialist de Luca’s walls. They worked extensively together during the Vinciguerra operations. She provided the intel and his unit acted on it. I suspect their relationship may be closer than that, but there appears to be a level of volatility that bears closer watch. Are they close friends? Are they familial? Or something else? Time will tell. Fortunately, Specialist de Luca seems to fit in well, foregoing the hazing that both the S.A.S. and SEALS operators seem fond of inflicting \\[…]. In conclusion, I believe Specialist de Luca is a valuable addition to the Rainbow Program and that her particular skills will keep the teams guessing during asymmetrical combat simulations.\n\n-- Dr. Harishva Pandey", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3DgGV3hETnXiEvVFOYZrbm/55a6be47761b5cf2c7ff8aaa7991cc7f/Y3S2_BADGE_Alibi_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7ufK1h05Bv9FA19SpIACoJ/b3017cfc3836340861a11fc3fe82bef2/R6-operator-alibi.png", "loadout": [{"name": "Mx4 Storm", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4qRh1frGkQZxNyeKA4D6n1/20f89cd1d9953f06207b7340ea77fb17/Mx4_Storm.png", "imageLocal": "img/loadout/Mx4 Storm.png"}, {"name": "ACS12", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/13z63kT1NLzn1U99o7WC4T/8655d3200f24b87246c36f2622603457/ACS12_PB.png", "imageLocal": "img/loadout/ACS12.png"}, {"name": "Keratos .357", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/15caVAsSCr8Rsb5Hid36uc/59632c4f90727931041ced62a620018b/Keratos_.357.png", "imageLocal": "img/loadout/Keratos .357.png"}, {"name": "Bailiff 410", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/N8FLbo4fsNyBe8msKgRhT/8f403dc0b58087bcafab786dd95ba33f/Bailiff_410.png", "imageLocal": "img/loadout/Bailiff 410.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "Prisma", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7sJYir66zAPq2omSvYeT2u/8fbe3370d32fb5433fb6d3a86d46a1b9/Prisma.png", "imageLocal": "img/loadout/Prisma.png"}], "iconLocal": "img/operators/alibi_icon.png", "imageLocal": "img/operators/alibi_render.png"}, {"slug": "amaru", "name": "Amaru", "realName": "Azucena Rocío Quispe", "side": true, "isAttacker": true, "squad": ["redhammer"], "faction": "APCA", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["front-line", "map-control"], "ability": {"id": "1zRWOT1kDT0Vir1OwVzSdc", "ccid-m": "1zRWOT1kDT0Vir1OwVzSdc", "ccid-l": "62E20ixIc8iuKPMaU7VrBT", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "With the Garra Hook, Amaru can grapple onto ledges and windows and hoist herself up in record times. Her opponents now not only have to worry about attacks from above, but also attacks from below. With the Garra, Amaru is the only operator that can go up an open hatch, instead of down. When timed right, hooking the Garra onto a window can result in Amaru’s infamous Garra Kick, which instantly takes out an opponent standing behind the window.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "4795759e-6e41-450f-b6c3-7e90002b32b4", "buttonNumber": 1, "id": "6NKhgCOBOT3HAqQsvOa3cY", "ccid-m": "6NKhgCOBOT3HAqQsvOa3cY", "ccid-l": "5GOVDTVEoL51HXICrKJ9BW", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/33DITOPKmOO9duwLqMiYkI/de77c5a73057c51e73dab2843d938556/operator-video-ability-amaru.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2Z41RQJD8qwY6GrmL6RNih/909d458f36762e921090b8901ab323b9/operator-video-ability-amaru.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "May 6th (Age 48)", "placeOfBirth": "Cojata, Peru", "biography": "### Biography\n“Forget who you are, and nothing else matters. You’ll fight for anyone, and never know why.”\n\nSpecialist Azucena Rocío “Amaru” Quispe began her career as an anthropologist concerned with the preservation of Peru’s shared cultural heritage. Her unique familial link to colonial explorers of the early 20th century gave her uncommon insight into both how voyages of discovery can shape cultural consciousness, and into the deep and abiding loss created when a shared cultural touchstone is lost. She served for several years in the Policía Nacional del Perú (PNP), before reorienting as a freelance archeologist focussed on the discovery and categorisation of new archaeological sites. After several run-ins with antiquities traffickers, and failed attempts to bring them down from within, she turned to guerrilla tactics in order to seize important cultural discoveries for the Peruvian State. When Specialist César “Goyo” Ruiz Hernández made us aware of her presence, she had already spent some 20-odd years in the jungles of Peru, fighting the cartels on her own terms.\n\n### Psychological report\nSpecialist Azucena Rocío “Amaru” Quispe’s self-awareness is uncanny, especially with regards to what motivates her. Loss is not unusual for an operator to face, but not often in such great numbers, nor in such quick succession. \\[…\\]\n\nShe learned early on to be at home in the jungle. Her family attachments were the grounding elements in a difficult childhood. While her siblings and cousins provided her with plenty of friendly rivalries, her grandmother’s quiet hope is what she speaks of most fondly. From what I understand, her great-grandfather disappeared almost a century ago on an expedition to a lost city – details suggest he traveled with Percy Fawcett, though confirmation is impossible – yet Quispe’s grandmother always believed her father would return. Even long after Kantuta’s death, I suspect Quispe still holds the same fairytale notion of an eventual reunion. \\[…\\]\n\nQuispe’s strength lies in her uncommon mix of realism and good humor. She isn’t afraid to laugh at the curveballs life throws her, yet she has confessed to me that she feels “haunted” by the ongoing unrest in her home country. She is, first and foremost, possessed of a deep and abiding love for Peru. \\[…\\] I would never accuse Quispe of being a sentimentalist, because her interest in preserving her culture is far more mercenary than most people would understand. \\[…\\]\n\nThe bond between Quispe and Specialist César “Goyo” Ruiz Hernández is clearly something they both treasure. I suspect she accepted the offer to join Rainbow simply to spend time with him, believing that she would be back in the Amazon before too long. What she seeks is more tools to add to her arsenal, but it’s what she has to teach that’s vital to the future of this unit. Without her, we will be hard-pressed to combat the very forces she has been evading for the past 20 years. \\[…\\]\n\nIn any case, her gregariousness has seen her quickly integrated with the other operators. It remains now only to convince her that this is where she can make the greatest difference, and that task falls to me.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2K1uxROLvHGxOIOMpNRFeU/7b4afc5ded3d1b9a937d1b504b5d4d0d/Y4S3_BADGE_Amaru_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1w0TmOriiVzmeIBYodZ6wK/81da7f64732b1dbf5ccf984f2aea1d94/R6-operator-amaru.png", "loadout": [{"name": "G8A1", "slot": "primary", "subtype": "Light Machine Gun", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4TIb7oeJesaROOOfTlCBaZ/ffd6a802f9a779a0d39b2122c49b3254/G8A1.png", "imageLocal": "img/loadout/G8A1.png"}, {"name": "SuperNova", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2tpjCRFLcc3hogjJGbKDsi/5ad0ab63b7245022aca5c1c1fb42d473/SuperNova.png", "imageLocal": "img/loadout/SuperNova.png"}, {"name": "Gonne-6", "slot": "secondary", "subtype": "Hand Cannon", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/23AlSVw8MwI1y3ZakEfqgW/c4561ae6e8da8db2627a146b8b55ee6c/GONNE-6_HUD_Icon__1_.png", "imageLocal": "img/loadout/Gonne-6.png"}, {"name": "SMG-11", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3WExw7Kepz9uAiWAbWW457/875fc631a3cf9fcc2849d9db2989cbcd/SMG-11.png", "imageLocal": "img/loadout/SMG-11.png"}, {"name": "Stun Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3XnK8s1iQJQu5cfr6UyQfK/429480b96d6d6d6b830c32c75d2608f5/Stun_Grenade.png", "imageLocal": "img/loadout/Stun Grenade.png"}, {"name": "HARD BREACH CHARGE", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3OvnVPWY1UyrDE913kU0a1/eae4b2a1584234ea2ff4ad6481239f3b/SecondaryBreacher.png", "imageLocal": "img/loadout/HARD BREACH CHARGE.png"}, {"name": "Garra Hook", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3WejtMAtiITfpjDMuq6j4t/b52e58da6b2625839aa23f940c8e6639/Garra-Hook.png", "imageLocal": "img/loadout/Garra Hook.png"}, {"name": "ITA12S", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5G4DroaSdqHzJWCe7qqbHZ/5dd2e03f853182c78a1e7fcbc642f0cf/ITA12S.png", "imageLocal": "img/loadout/ITA12S.png"}], "iconLocal": "img/operators/amaru_icon.png", "imageLocal": "img/operators/amaru_render.png"}, {"slug": "aruni", "name": "Aruni", "realName": "Apha Tawanroong", "side": false, "isAttacker": false, "squad": ["nighthaven"], "faction": "NIGHTHAVEN", "speed": 1, "armor": 3, "health": 125, "difficulty": 2, "roles": ["anti-entry", "anti-gadget"], "ability": {"id": "6UoSCtK9ObZyyzMxH1CBEy", "ccid-m": "6UoSCtK9ObZyyzMxH1CBEy", "ccid-l": "7JnXddQGdMPWWeYEnY2u1q", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Once in place, the gate projects a laser array capable of detecting anyone moving through it. When an intruder is detected, energy output to the laser increases, causing second- and third-degree burns. We spent nearly an hour tossing everything from wads of paper to pieces of fruit through until we found a setting that maximizes damage while limiting energy consumption.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "551c248f-1d60-424a-8a58-5a52e9a45f1e", "buttonNumber": 1, "id": "fqJ4LLPX98U1XGikmziii", "ccid-m": "fqJ4LLPX98U1XGikmziii", "ccid-l": "4tv1km8QU1C7TLB0wuAiUp", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2QVB4CPVu1zECICTbZHEu7/6f95d8ce0c57838595404792af32663a/r6s-operators-ability-aruni.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "aruni: unique abilities", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2jVFWfAqjBIOyWUkivMP6t/bd593174c2ba4f6ab5e80f349ddab8e7/r6s-operators-ability-aruni.mp4", "description": null, "videoControls": false}}, "event": null, "useAgegate": false, "video": null}], "refIds": []}, "dateOfBirth": "August 9th (Age 42)", "placeOfBirth": "Ta Phraya District, Thailand", "biography": "### Biography\n\n“In every conflict, it’s the children who are made to suffer, even after the fighting has stopped.”\n\nAs a private detective, her discovery of a bomb plot in Bangkok brought Aruni to the attention of the Royal Thai Police (RTP). Her knack for connecting the dots between seemingly-unrelated incidents earned her grudging respect from Thailand’s male-dominated law enforcement agencies, as well as hostility from numerous criminal syndicates.\n\nThe RTP offered Aruni a Detective position with the Crime Suppression Division, where she dismantled a human trafficking ring and foiled no fewer than four bomb plots. Her ability to track and connect diverse shipments of explosive materials was lauded by her superiors. Unfortunately, Aruni’s police career ended when she was nearly killed during an operation in Bangkok.\n\nFollowing her recovery, Aruni was approached by Jaimini “Kali” Shah. Kali’s access to cutting-edge prosthetics was likely a factor in Aruni’s decision to join Nighthaven.\n\n### Psychological report\n\n\"Aruni is quick on her feet, both mentally and physically. She rarely hesitates, and her judgement is flawless under the most trying circumstances. Her reaction speed, combined with her expertise in firearms and martial arts, means that she is a versatile and deadly combatant. Her fitness regimen – taken up following years of physical and psychological recovery – is intense, but it enables her to maintain peak performance. \\[...]\n\nAruni’s affiliation with Nighthaven appears to be one of convenience. Nighthaven pays well and provides her with access to cutting edge prosthetic technology. While she uses some of the money she earns to support herself, she’s also a quiet philanthropist with a very frugal lifestyle. She donates time and money to charities that focus on the disposal of unexploded ordnance along the Thailand-Cambodia border and medical treatment for victims.\nOne of Aruni’s closest companions is Hero, a giant pouched rat trained in demolitions disposal. Though not stated outright, Hero appears to be her emotional support animal. \\[...]\n\nWhen time is in short supply, Aruni has a penchant to bend the rules in favor of expedience – an understandable impulse, especially in cases where lives are on the line, but it isn’t always acceptable to her superiors. Though she was a brilliant police detective, her tendency to prefer convenience over procedure led to a number of minor infractions. \\[...]\n\nWhile she’s done the majority of her professional work in Thailand, Aruni is an accomplished world traveler. Her wanderlust has taken her to other parts of Southeast Asia, as well as Central and South America. \\[...] She and other Specialists – namely Emmanuelle “Twitch” Pichon and Sanaa “Nomad” El Maktoub – have traveled together, providing both companionship and security when visiting destabilized regions. \\[...]\n\nShe uses photography – a skill she developed as a private detective in Bangkok – as a way to raise global awareness of the vast minefields left over from prior wars. These personal photographs tend to focus on the victims of conflict, especially those maimed by unexploded ordnance. Ultimately, these images allow her to give herself what so few of us think we truly deserve – compassion.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow\"", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5rOLCYQOh5HH0Nv6NHe38H/29681f901ff71ae5decb5ccb1b9f8a29/Y5S4_BADGE_Aruni_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/xIH5tc98YOO1Juf1cRcJC/779f61650fac17e6e79e7b0f618c83e5/r6s-operator-aruni.png", "loadout": [{"name": "P10 RONI", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7K86OBjL3zmYWt0ZvUcCLj/16a947334e39f27da177d787773593e4/r6-operator-weapon-smg-p10roni.png", "imageLocal": "img/loadout/P10 RONI.png"}, {"name": "Mk 14 EBR", "slot": "primary", "subtype": "Marksman Rifle", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6KIMqp5dA95z1RI3PrG9jv/eb939638169811a3fa858a44e6e5d97e/Mk_14_EBR.png", "imageLocal": "img/loadout/Mk 14 EBR.png"}, {"name": "PRB92", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/dl28J1HsE7mzhj66pmd5D/b8d8fc48d2dde13154047de94abbd8ca/PRB92.png", "imageLocal": "img/loadout/PRB92.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "Surya Gate", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4hLJAAVKrf50wosG0471od/cde1867daf863c03754969f159ac00de/r6s-operator-ability-aruni.png", "imageLocal": "img/loadout/Surya Gate.png"}], "iconLocal": "img/operators/aruni_icon.png", "imageLocal": "img/operators/aruni_render.png"}, {"slug": "ash", "name": "Ash", "realName": "Eliza Cohen", "side": true, "isAttacker": true, "squad": ["redhammer"], "faction": "SWAT", "speed": 3, "armor": 1, "health": 100, "difficulty": 2, "roles": ["breach", "front-line"], "ability": {"id": "6UoDlWtcoQJLjZgMgKewlD", "ccid-m": "6UoDlWtcoQJLjZgMgKewlD", "ccid-l": "77aIBuuau019jYxUBijVm2", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Ash is a fast-paced front liner; capable of breaching, flanking and dividing the Defender's attention in seconds.\n\nAsh is capable of ranged soft breaching thanks to her modified M120 CREM Breaching Rounds.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "5892b21c-835c-4393-9b98-ec3af23eac15", "buttonNumber": 1, "id": "6yCJcfMN4FXpFVOVMW3M5c", "ccid-m": "6yCJcfMN4FXpFVOVMW3M5c", "ccid-l": "29gE1B8a5ZyD4x6bky158F", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/75t7NR33Wx6QqE6GSjX4Bl/0415cdad52a25604ee9eec90a849b5d0/mqdefault.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "SNWqmPCJyBw", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "December 24th (Age 33)", "placeOfBirth": "Jerusalem, Israel", "biography": "### Biography\n“You can never truly understand a conflict until you’ve been on both sides.”\n\nCohen’s mother is a renowned Jewish political activist and professor while her Palestinian father is a professor of Middle Eastern Studies. Cohen was raised in Israel, excelling in Mathematics and Physics. She earned a degree in Structural Engineering at Tel Aviv University and spent a few semesters at Boston University.\n\nCohen then enlisted in the Israeli Defense Forces (IDF). After undergoing the rigorous twenty-two month training for the elite Air Force unit, Shaldag, she served five years. Skilled in ground and airborne operations, all-weather and all-terrain navigation and reconnaissance, she was invaluable in Operation Orchard. Moving to the US to work with FBI SWAT, Cohen applied her degree in Engineering and gift in structural resistance to develop advanced demolition tactics and equipment. Along with Hebrew, Cohen is fluent in Arabic, English, French and Greek.\n\n### Psychological report\nI had several meetings with Specialist Eliza “Ash” Cohen before I gave up on convincing her to not see me as a commanding officer. She asked so many probing questions, it was starting to feel as though she were analyzing me. \\[…\\]\n\nCohen isn’t interested in discussing her childhood. There’s resentment toward a judgmental grandmother, but no lasting trauma. Military service acted as an escape from family tensions and appealed to her ordered and focused personality. Cohen added that she appreciates high-risk, high-reward scenarios, but didn’t elaborate on what level of personal risk is acceptable.\n\nHer identity is intertwined with her military training and operations. Extracting anything personal from the tangle is difficult. Cohen is cautious and doesn’t cultivate many close relationships. Her bond with Specialist Miles “Castle” Campbell is therefore important to her – and I would say to the team as well. It’s certainly a good pairing. Campbell’s amenable personality enables Cohen to step out of her comfort zone without feeling self-conscious or judged. \\[…\\]\n\nCohen uses other people’s assessments to describe herself: She told me that Specialists Dominic “Bandit” Brunsmeier and James “Smoke” Porter tell her she’s “too serious,” while others describe her as “intense,” and that she enjoys being proven right. So I asked if she thought those descriptions were accurate. She told me that she only cares about whether the other operators respect her. I’m confident they do. \\[…\\]\n\nOn operations, Cohen is exemplary: She thinks fast, and her aggressive style almost always puts her at an advantage. During debriefs, however, I’ve noticed a different kind of focus. The residual stress of combat causes her to dwell on every misstep, perceived or real. Self-evaluation is understandable from someone so highly skilled, but it also has an effect on her team. It’s important to encourage her to process the events as a joint effort and not simply assume the critique alone. Cohen – like all operators – knows there will be situations she can’t prepare for. And yet, she alone allows the stress of the unknown to eat at her. This will need to be addressed.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/58Y4Q2x7msL8uQUoiA7LGM/b204acc9c5a015029140723ef2e435bb/Y0R6_BADGE_Ash_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4uyWdmCF6zI9vcn4vKp9zx/1b9393a63e1071daeccb95732e530d40/r6-operator-ash_229846.png", "loadout": [{"name": "G36C", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2SZoqSXKoNPvZFIJsFsDE5/cb109885bf19c8697abf832f10cfd9a6/G36C.png", "imageLocal": "img/loadout/G36C.png"}, {"name": "R4-C", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/dQbqK9VxczuiscwBDSkT8/777a062f6095dde0371eab5200dcb451/R4-C.png", "imageLocal": "img/loadout/R4-C.png"}, {"name": "5.7 USG", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/tkYcSAJSe5yGkeUhzZqBO/e81feb86df4a7eb6951052bec26b6ed7/5.7_USG.png", "imageLocal": "img/loadout/5.7 USG.png"}, {"name": "M45 MEUSOC", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3u5cecgWYl3WuJK50mKEGd/a4a0eb15c710edfc0d29e98c2ee7ea33/M45_MEUSOC.png", "imageLocal": "img/loadout/M45 MEUSOC.png"}, {"name": "Breach Charge", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1OgTMhyF1FBsSAo4njk26m/99b7a971f81b9195b3c3536b51d52893/R6S_Breach_charge.png", "imageLocal": "img/loadout/Breach Charge.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "BREACHING ROUND", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/0114WqhzsMsnvaKc4FypkN/5ebb9b86e216a2d9e6b2ea01eb3346e8/Breaching-Rounds.png", "imageLocal": "img/loadout/BREACHING ROUND.png"}], "iconLocal": "img/operators/ash_icon.png", "imageLocal": "img/operators/ash_render.png"}, {"slug": "azami", "name": "Azami ", "realName": "Kana Fujiwara", "side": false, "isAttacker": false, "squad": ["viperstrike"], "faction": "Unaffiliated", "speed": 2, "armor": 2, "health": 110, "difficulty": 3, "roles": ["anti-entry", "support"], "ability": {"id": "2f3MPdFhOdSruTEXb0uIoz", "ccid-m": "2f3MPdFhOdSruTEXb0uIoz", "ccid-l": "2QHuCeeV3P3nLnN4Mqb4Fz", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The Kiba Barrier is a modified kunai that sticks to a surface after it's thrown and releases a material that first expands then solidifies, creating a bulletproof barrier to patch up those holes in your defenses.", "trackingLocationDetail": "unique ability", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "b0a40eaf-999a-45b6-b9cc-dc3d5f661de2", "buttonNumber": 1, "id": "1swtzsRbpSGGSzT5Xlvwju", "ccid-m": "1swtzsRbpSGGSzT5Xlvwju", "ccid-l": "5N8x6eOccWeoaaqpViM6qi", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/17VGFwyIHL8Hbd2FoulCTS/2482a99cf2bf99c3595a5a048ce431f5/AzamiLoadout.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "unique ability", "trackingValue": "azami : watch trailer", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1epRQrJs3dYg9LB4re6PfU/a2f986c1a831cd838009d1b8d8dae8e2/AzamiLoadout.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "September 6th (Age 28)", "placeOfBirth": "Kyoto, Japan", "biography": "### Biography\n\n*“Honor is not the only thing worth protecting…but sometimes it’s all you have left.”*\n\nRaised in Kyoto City, Azami blurs the lines between the ultra-modern and the traditional. Boxed in by the rigid rules of her household, she found outlets for self-expression through fashion and physical combat. Her focus and determination allowed Azami to progress quickly through the ranks of Aikido. This aptitude, as well as her dedicated study of languages, served her well when she moved to Tokyo to study at the Metropolitan Police Academy.\n\nWhile working as a motorcycle officer Azami gained her 3rd Dan in Jujitsu and her 5th Dan in Aikido, earning her a spot in the Security Police division of the TMPD. She fell out with her sensei after failing to achieve the serenity necessary to progress. After facing suspension due to multiple violent outbursts in the line of duty, she subsequently chose to join the private sector as a bodyguard. Azami worked exclusively for Masayuki Yahata in Fukuoka before his death led her to re-establish contact with Yumiko “Hibana” Imagawa.\n\n### Psychological report\n\nThere is a mystery hidden behind Specialist Kana “Azami” Fujiwara’s mask. Her demure charm can be disarming, making her an unassuming companion for business and social meetings. However, when her employer is threatened, the “mask comes off,” which leads me to believe I should be cautious in my attempts to peer behind it. \\[…\\]\n\nFujiwara’s responses to my inquiry into her family history were polite, and I daresay… all too precise. I’m still trying to determine if her dedication to Bushido teachings was encouraged by, or in spite of, her relationship with her father. \\[…\\] Fujiwara’s profile is characterised by a high level of self-control, independence, and extraversion. What I question is her emotional stability. Her performance as a bodyguard shows that she can keep a cool head amidst chaotic situations and is unarguably someone you can trust with your life. \n\nHer reaction to Yahata’s death is uncharacteristic with her professionalism and does concern me. Fujiwara refuses to answer to her given name until she uncovers the truth surrounding the death of Masayuki Yahata. She’s now claimed the name Azami, stating, “Until I reclaim my honor, I am only vengeance,” serving as a continuous reminder of the debt she owes. His passing has moved beyond a vocational failing and into personal mourning. I can see her struggling to define whether his last word was a blessing or an accusation \\[…\\] \n\n\\[…\\] Fujiwara’s face lit up when we talked fashion, but I fear I may have insulted her when I suggested we go shopping at the mall. “I don’t shop, I curate.” Her wardrobe is obsessively meticulous, each item chosen for its form as well as its function. I will say her bold fashion sense distracts the eye while hiding a myriad of weapons, the most dangerous of all being her wrath. I think next time I’ll inquire about her poetry. \\[…\\]\n\n\\[…\\] I’ve observed her in training. Though her movements are precise, her fluidity is disturbed by the unpredictability of her weaponized rage. Hibana vouches for Azami’s ability and trustworthiness, but while she has earned my confidence, Fujiwara’s methods require closer evaluation \\[…\\]\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7KWTXHTk8rxLS5qtyX4Xu4/b51f8691b932fd2b83260ef3fbcd1154/r6s-operators-badge-azami.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6vzacvORn7fh5sWFqy4glF/daadcbb2e0515129bf0cb610eccb3393/r6s-operator-azami.png", "loadout": [{"name": "9X19SVN", "slot": "primary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/akx58K4vXn1v2Q4C3sgrB/03425922f23cc8887b6e73c4d06ad387/9X19SVN.png", "imageLocal": "img/loadout/9X19SVN.png"}, {"name": "ACS12", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/13z63kT1NLzn1U99o7WC4T/8655d3200f24b87246c36f2622603457/ACS12_PB.png", "imageLocal": "img/loadout/ACS12.png"}, {"name": "D-50", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6mMQRDsrComRFa7bC6cNkG/8cd17e545e3d28dcc11a040d000cfa16/D-50.png", "imageLocal": "img/loadout/D-50.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "KIBA BARRIER", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1UDhKrAXnm0thdHhsTTAyo/b7771794aea3f00da46c21670af5f5d5/r6s-operator-ability-azami.png", "imageLocal": "img/loadout/KIBA BARRIER.png"}], "iconLocal": "img/operators/azami_icon.png", "imageLocal": "img/operators/azami_render.png"}, {"slug": "bandit", "name": "Bandit", "realName": "Dominic Brunsmeier", "side": false, "isAttacker": false, "squad": ["wolfguard"], "faction": "GSG9", "speed": 3, "armor": 1, "health": 100, "difficulty": 1, "roles": ["anti-entry", "anti-gadget", "starter-operators"], "ability": {"id": "1OVh1S00VhVMU8E4Jml3xt", "ccid-m": "1OVh1S00VhVMU8E4Jml3xt", "ccid-l": "4agrlLZJMwIDCPjZz5WREW", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Bandit is a secure, anti-hard breacher and roamer, capable of denying key entry points for the attackers and defending the objective while on the move.\n\nBandit is capable of electrifying a variety of surfaces thanks to his special ability: Crude Electrical Device or CED-1 Shock Wire.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "c7553955-6b68-42a4-832f-d81a310360e0", "buttonNumber": 1, "id": "lEo8Hapedd3oqEj2GkjLG", "ccid-m": "lEo8Hapedd3oqEj2GkjLG", "ccid-l": "6jqUi3mOdChp1lINBDz4Bq", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4y2Uuj6PTMBmVdswfPQ6jO/84bcca8848c16acac702d0349ece44fc/operator-video-ability-bandit.jpg", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "KHV_mpFnfcU", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "August 13th (Age 42)", "placeOfBirth": "Berlin, Germany", "biography": "### Biography\n“Survival is all about timing. Nature doesn’t give second chances.”\n\nBrunsmeier and his twin brother were raised in a working class district near the Berlin Wall. Their father worked in the police force and strongly encouraged them to join. While working with Bundespolizei (BPOL) Brunsmeier excelled in crisis situations. He transferred to the Aviation Group long enough to obtain his helicopter license but his adaptability and experience with border surveillance flagged him for undercover operations. He was embedded as an undercover agent in the terrorist organization Red Army Faction (RAF), where his contribution was critical in seeing key members arrested and providing valuable information. While undercover, Brunsmeier honed skills in guerrilla tactics and improvised explosive devices. He developed prototypes of his electrified barricade and deployable shield. He is fluent in German, English, Polish and Turkish.\n\n### Psychological report\nI wouldn’t expect an operator who worked undercover for years amongst dangerous biker gangs and militants to be anything less than clever and adaptive. And in re-reading Specialist Dominic “Bandit” Brunsmeier’s file I’m struck by just how resourceful he had to be. It’s clear he had to be creative and strategic to stay alive. Frankly then, I was surprised by his sense of humor. It must’ve sustained him through his undercover operations. That said, he can have a cold intensity. Nothing reminds me that I’m a soft civilian more than looking into Brunsmeier’s eyes. \\[…\\]\n\nBrunsmeier certainly speaks fondly of his brother. He enjoys being an uncle to his brother’s kids – how they’re the only ones who let him be as silly as he’d like. He told me about their childhood in the shadow of the Berlin Wall. How sometimes they’d hear a BOOM from something triggering a land mine. And how they couldn’t resist pranking the patrol guards with some twin antics. \\[…\\]\n\nI didn’t want to ask about the undercover work directly. It wasn’t until our most recent meeting when he volunteered some information. Brunsmeier described the challenge of remembering the real “you” when immersed in another persona. The question: “Who are you?” would creep into his sleep. If he dared to form an answer, he knew he was as good as dead. Even considering the question was dangerous. So he would push it away. We discussed details of what he had to do to ensure his cover wasn’t blown, the source of some fantastic rumors circulating about him. Smiling, he assured me they’re only half true. I don’t want to break his confidence here. I merely need to assess if it has any lasting impact on him and the Rainbow team. \\[…\\] The most I can offer at this time is that the team works well together. \\[…\\]\n\nIt’s critical that Brunsmeier doesn’t close himself off. Training scenarios alongside operators such as Specialists Miles “Castle” Campbell, Emmanuelle “Twitch” Pichon, or Elias “Blitz” Kötz could help. These operators have calming attributes that may temper Brunsmeier’s inner demons.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4Vasjq82J1TNjNE38J7LmV/e1725f8d9ea2b85565e40b54faac85b8/Y0R6_BADGE_Bandit_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7uF3w5MYCFA1zikIkECPi9/f03570fd8c7739361619726638561c7a/R6-operator-bandit.png", "loadout": [{"name": "MP7", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3a4dgTWGdiJqALhtRp4pKy/f2568d3de3cfe7e4b53179e8653cd2a2/MP7.png", "imageLocal": "img/loadout/MP7.png"}, {"name": "M870", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2rkU6g4Rlg0e0U4rczWGTV/a51589a54c43f476d8eb984c0ea881e9/M870.png", "imageLocal": "img/loadout/M870.png"}, {"name": "P12", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2mpM7rah7rwEW0bViIirUC/ed9caa4db58421519fa4db390b1aa164/P12.png", "imageLocal": "img/loadout/P12.png"}, {"name": "Barbed Wire", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7igaibxuCcSpWDkZensEJS/6d30514b70a4c8b535bb1c113f9cfce0/barbed-wire__1_.png", "imageLocal": "img/loadout/Barbed Wire.png"}, {"name": "Nitro Cell", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4pBSTw9U6l9GRnT12G6Xln/e0991bc03b48d217f510af8b611c8828/Nitro_Cell.png", "imageLocal": "img/loadout/Nitro Cell.png"}, {"name": "Shock Wire", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/129HTNU2A5kIcMj0KZ5UjU/858b60dd0e9b8692e2dc693eded50e14/Shock-Wire.png", "imageLocal": "img/loadout/Shock Wire.png"}], "iconLocal": "img/operators/bandit_icon.png", "imageLocal": "img/operators/bandit_render.png"}, {"slug": "blackbeard", "name": "Blackbeard", "realName": "Craig Jenson", "side": true, "isAttacker": true, "squad": ["redhammer"], "faction": "NAVY SEAL", "speed": 1, "armor": 3, "health": 125, "difficulty": 2, "roles": ["breach", "front-line"], "ability": {"id": "5iJxjfsHazL4Z2WDGPVh0W", "ccid-m": "5iJxjfsHazL4Z2WDGPVh0W", "ccid-l": "8Wc5t3IyqrUeINitxDuBt", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Blackbeard comes equipped with the H.U.L.L. Adaptable Shield. The shield is capable of adapting it's shape to grant the best cover while on foot and in rappel. The shield also includes a breaching pneumatic system that allows Blackbeard to create his own rotations by destroy soft walls. Blackbeard's weapon skills allow him to simultaneously equip the H.U.L.L. Adaptable Shield and primary weapons.", "trackingLocationDetail": "operators detail", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "be77f5ea-4515-41b8-b360-b9788da972a3", "buttonNumber": 1, "id": "3ZWAwjMdnol18BePFSHXL7", "ccid-m": "3ZWAwjMdnol18BePFSHXL7", "ccid-l": "2AbGQg6PNVCWmItmwQf0i", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6NoHTeYlS9ZJ9ObjvybP31/6f26dc1a0f6ad7e38d818e98c24c8941/r6s-blackbeard-hull-gadget.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "operators detail", "trackingValue": "unique abilities", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4vqZbu81Gncpt5GQPxy3So/93a4e532ee86cb543fe2df8a1763041d/r6s-blackbeard-hull-gadget-video.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "March 12th (Age 32)", "placeOfBirth": "Bellevue, Washington", "biography": "### Biography\n“I’m a diver. We’re used to seeing threats through a layer of tempered glass.”\n\nInstead of following the family tradition in the medical sciences, Jenson joined the US Navy. His early years in the Boy Scouts and the United States Naval Sea Cadet Corps (Blue Angels Squadron) solidified his desire to serve his country and see the world. Joining the military offered him the ideal opportunity to pursue an academic education while learning a wide range of skills that fueled his adventurous spirit. After his initial military stint, Jenson focused on the US Navy SEALs as his ultimate career goal. Driven to succeed in his profession and his private life, he has climbed Mount Everest, participated in US sailing championships, and has sailed around the world on several occasions.\n\n### Psychological report\nSpecialist Craig “Blackbeard” Jenson has a commanding presence, complemented by a boisterous sense of humor and a booming laugh. Outside his operational role, Jenson doesn’t appear to take too many things seriously. He was relaxed and open throughout our conversation, describing himself as “gung-ho and an all-in kind of guy.” I have to admit I don’t hear “gung-ho” too often. \\[…\\]\n\nAthletic, rugged, a mountain climber and competitive sailor, Jenson tells me that he’s most himself when he’s in nature. He says the wilderness encourages adaptation and builds willpower, tolerance, and acceptance. This seems to be something he’s been cultivating since his youth. I asked him if there was a job out there that he would do if he wasn’t in the military. He told me that he thought about becoming an oceanographer but right now there’s “still a lot of shine on being a SEAL”. \\[…\\]\n\nI asked him when he first discovered his taste for adventure. At five years old he snuck out of bed and hauled all the family camping equipment into the woods behind his house. He camped there for two days, then returned so his parents wouldn’t worry. He later learned that they knew exactly where he was and had been keeping an eye on him. He regrets not staying out longer. \\[…\\] He says his great-grandfather quit his job one day, left his wife and kids, and went North to be a gold miner. Jenson says he shares that same passion to explore, though he’s not at all interested in abandoning his own wife and children. \\[…\\]\n\nPresent day pirates are a serious concern to the Navy, and Jenson has participated in multiple anti-piracy task forces. That said, when at home he enjoys playing swashbuckler pirates with his kids. Jenson says pirates were egalitarian, and that it was similar to how a Rainbow team might conduct an operation. \\[…\\] He’s a solid operator with a clear image of his role. He’s successful at it and well-liked by his team. If he wants to play pirates in his downtime, I think it sounds like fun.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4BTbmcs1EtoUbnpk5Am22Y/b7bd4d0708245c78b98455505c0d51a8/Y1S2_BADGE_Blackbeard_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1FtCiVm4q4DsQNsLoT5nV0/4d8db4491539e77f4905fa3242147ba5/r6s-operators-blackbeard__1_.png", "loadout": [{"name": "Mk17 CQB", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4LytczDQmu0M63gO2WtCCm/331ef3b1938352ae71d7c0bd23de3596/Mk17_CQB.png", "imageLocal": "img/loadout/Mk17 CQB.png"}, {"name": "SR-25", "slot": "primary", "subtype": "Marksman Rifle", "
