PPB5", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Encased in a tinted silicone ball, coated in micro-suction cups, the quick deploy camera maintains a clear view thanks to the internal gyroscope that dictates the angle of the lens.\nThe suction cups allow the camera to adhere to any surface, while the gyroscope mounted lens stabilises the camera angle and focus.\nThe live video feed is available to all operators.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "6f38d7f7-7367-4e96-89ae-211b0a68d3f7", "buttonNumber": 1, "id": "3QqoqdLXqD4xQzCTQJfIzI", "ccid-m": "3QqoqdLXqD4xQzCTQJfIzI", "ccid-l": "44rP6154R9PR5xyE0F00gO", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6UeW7TqInu2gDfieF8frQ5/7193bba1740b55a9c499c3988f80ae66/R6-operators-gadget-valkyrie.png", "description": null}, "buttonType": "youtube-modal", "buttonUrl": "VTqJ0g5u3Tw", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "July 21st (Age 31)", "placeOfBirth": "Oceanside, California", "biography": "### Biography\n“If you don’t constantly feel like you’re being watched, then you aren’t paying attention.”\n\nCastellano was born and raised in the quintessential surf community of Oceanside, California. Her father was a respected Colonel in the Marine Corps, her mother a researcher at a nearby biotech company. From an early age, she was known as a high achiever in math and science and as an athletic prodigy. An Olympic hopeful in swimming, Castellano broke her arm in a car accident when she was 16, putting an end to her career. She changed her focus and enlisted in the Navy, while also attending university. After graduating with a degree in Computer Science, specializing in Security and Cryptography, she transferred to the Information Dominance Corps. Castellano’s attention to detail and analytical skill made her one of their most sought-after specialists. She applied to become a SEAL when the position was opened to women and succeeded after several grueling years, acting as encouragement for others to follow.\n\n### Psychological report\nAt the start of my first meeting with Specialist Meghan “Valkyrie” Castellano she struck me as someone who ticks all the boxes – someone who meets or exceeds expectations. Someone impeccable. But looking at the field reports I see someone aggressive, someone willing to do whatever it takes to accomplish the mission. This contrast interests me. \\[…\\]\n\nHow Castellano views her role is more complicated than her initial polite response would indicate. While we’ve raised the bar for her and she appreciates the challenge, I can tell she’s struggling with something. \\[…\\] Castellano isn’t used to being around so many high-achievers. She’s always been at the top of the class – the go-to person. The only other time that she felt “against the wall,” as she put it, was during SEAL training. Normally I’d encourage her to interact with someone who can understand what she went through, another SEAL such as Specialist Craig “Blackbeard” Jenson, but I know he was one of the instructors during her Hell Week and while she respects him, I don’t detect any great fondness there, either. \\[…\\]\n\nCastellano is currently enrolled for a helicopter pilot license, inspired by Specialist Elena María “Mira” Álvarez, and language classes inspired by Specialists Yumiko “Hibana” Imagawa and Miles “Castle” Campbell. \\[…\\] The intimidation she feels at being surrounded by other exceptional minds is resulting in undue pressure. Self-improvement is fine if it’s for the right reasons. Castellano is already a valuable operator, despite mounting tensions with Specialist Taina “Caveira” Pereira over the incident in Bolivia. I want Castellano to invest in a healthier view of what it means to be in a team. \\[…\\]\n\nBeyond her deployments, Castellano doesn’t travel. Vacation is home near the sand and surf. This hermit lifestyle doesn’t entirely seem like it’s her natural state of being. The intense pressure she’s putting on herself needs some sort of… fulcrum. She’s no longer carrying the banner for female operators alone and needs to accept the support of her peers. I’m convinced understanding this will help her find equilibrium. It will take some convincing. But we have time.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/44qXJmZmAwaD4w44JnPuOx/c54c8b9d3a6813ab8ce3e3f1dd4ef408/Y1S2_BADGE_Valkyrie_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5q1yIrIxoddG5pds2Nq3mz/7dc46a59bbfb6959296d01469916f44c/R6-operator-valkyrie.png", "loadout": [{"name": "MPX", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5HFewpAJ8npDDCKFnEadhL/d398bb477d6b56fe41bfdb5862ed31c0/MPX.png", "imageLocal": "img/loadout/MPX.png"}, {"name": "SPAS-12", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Hp6Fbss6uI59OT4nZNB6e/a4d09954803cb2580353cfa03e8c778b/SPAS-12.png", "imageLocal": "img/loadout/SPAS-12.png"}, {"name": "D-50", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6mMQRDsrComRFa7bC6cNkG/8cd17e545e3d28dcc11a040d000cfa16/D-50.png", "imageLocal": "img/loadout/D-50.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Nitro Cell", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4pBSTw9U6l9GRnT12G6Xln/e0991bc03b48d217f510af8b611c8828/Nitro_Cell.png", "imageLocal": "img/loadout/Nitro Cell.png"}, {"name": "Black Eye", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1EPfd4xeuMpt5nItOYm2Eb/b59223248a508d205264ece3c3553d36/Black-Eye.png", "imageLocal": "img/loadout/Black Eye.png"}], "iconLocal": "img/operators/valkyrie_icon.png", "imageLocal": "img/operators/valkyrie_render.png"}, {"slug": "vigil", "name": "Vigil", "realName": "Chul Kyung Hwa", "side": false, "isAttacker": false, "squad": ["ghosteyes"], "faction": "707TH SMB", "speed": 3, "armor": 1, "health": 100, "difficulty": 3, "roles": ["anti-gadget", "crowd-control"], "ability": {"id": "19v3ZVXJS8U7Dd3y62UHoF", "ccid-m": "19v3ZVXJS8U7Dd3y62UHoF", "ccid-l": "6iSgr2qzlTNpcqpvTzqAgq", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Chul Kyung’s quiet lethality in the field allows him to rely on his Electronic Rendering Cloak (ERC-7) to remain undetected.\nThe ERC-7 uses Diminished Reality technology to remove perceivable stimuli from its direct environment. Vigil carries a prototype in his backpack, which scans surrounding electronic devices and wipes his image from any cameras in view.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "c8679b82-da36-4635-ba83-a97efa05e4e0", "buttonNumber": 1, "id": "JVjdlBcWD62SDId1rqUSV", "ccid-m": "JVjdlBcWD62SDId1rqUSV", "ccid-l": "4KVKZhCnrFPDeDhQR1SdIE", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7bSNUYTJkZASiLjm8Bk9Ew/170c671e52041d8c1480044847033d7e/R6-operator-vigil-gadget.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "January 17th (Age 34)", "placeOfBirth": "[REDACTED]", "biography": "### Biography\n“Don’t worry about me. I was never here.”\n\nMuch of Hwa’s early records are unclear. His birth parents remain unknown. What is known is that he suffered the loss of his older brother and father in their bid to reach the Republic of Korea. School records track him from late adolescence, when he was adopted into the Hwa family. Initial reports indicate signs of early trauma – reclusive, slow reader – however, his later grades show great improvement and focus.\n\nHwa gravitated toward electronics and electrical engineering. Wanting to use his talents and demonstrate pride for his country, he chose to join the ROK Navy. He later earned a berth in the ROKN UDT/SEALs, with a knack for radar systems and stealth technology. Handpicked by the respected 707th Special Mission Battalion for unconventional warfare missions, he proved to be quick and lethal. Hwa served together with Specialist Grace “Dokkaebi” Nam until their recruitment into Rainbow.\n\n### Psychological report\nSpecialist Chul Kyung “Vigil” Hwa had a tumultuous childhood. Much of it is lost to him, and what he remembers is precious. I assured him that my role isn’t to pick apart his past or dredge up events that would unsettle him, though of course I’m always here should he or any of our operators need me. I explained that my role is to shape a cohesive team – everyone fits in some way, and it’s up to me to piece it all together. \\[…\\]\n\nPreservation of anonymity drives everything Hwa does. He’s uncomfortable with me recording our conversations, and that a notification on my phone revealed our meeting time. He’s equally anxious in social situations. It’s difficult to tell if he has a strong self-concept or an utter lack of one. What is apparent is that Hwa can’t let anyone in, which means he’s often trapped alone with his own thoughts. \\[…\\]\n\nI wanted him to have a clear picture of who he was, at that moment, in my office. To see himself not just as an elite operator or a small child who lost his family. So I suppose he may not have understood where I was going when I asked if he liked Saturday morning cartoons.\n\nWe ran through a casual series of likes and dislikes ranging from quiet contemplation to free association. He was uncomfortable, but he humored me. As he relaxed, some of his own answers caught him off guard. From discussing breakfast cereals and the realization that he doesn’t know how to ride a bike, he was able to relate a memory to me. He described how the scent of hot soup triggered a vivid image – a woman, who he assumed was his mother, smiling and handing him a bowl. His face softened, and for a moment, he was home. \\[…\\]\n\nI’ve encouraged Hwa to carry on these associative exercises throughout his day. I know various members of Rainbow have reached out to him and while there are indications he respects them, there are still barriers he may not yet be ready to take down.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/56A3hXhWZdwO623g3ejeku/a40a0582a7841abfeed723d8fbe238d3/Y2S4_BADGE_Vigil_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/bPE2opWKKK0BPVx6I1H4b/4e15d30820900ecd0794ef90e1361d5a/R6-operator-vigil.png", "loadout": [{"name": "K1A", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5mUa2p8WXbiyD71qUI8sGk/ed753b6f0ae30ab5737486dfcf32ee9f/K1A.png", "imageLocal": "img/loadout/K1A.png"}, {"name": "BOSG.12.2", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2ZjVndetsX8WEn5ZfyUQa0/e3a781be7eab22876d25f748e8fd0f5a/BOSG.12.2.png", "imageLocal": "img/loadout/BOSG.12.2.png"}, {"name": "C75 Auto", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3wUuefwPjU705mZkTdJ9UH/8ccb11884cfa34c176ac5500af139177/C75_Auto.png", "imageLocal": "img/loadout/C75 Auto.png"}, {"name": "SMG-12", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/EwJgB7KdgOb6dDm7ro33u/b73f0890f992c1a365210f08efcc6db5/SMG-12.png", "imageLocal": "img/loadout/SMG-12.png"}, {"name": "Bulletproof camera", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gZuOXvuTu2i8hQX0B6auy/259f379a6283bae618443d722a896f1a/Bulletproof_camera.png", "imageLocal": "img/loadout/Bulletproof camera.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "ERC-7", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6WbhiNk0evsKWChPneCES6/af08476e2f917878e0326727d2d5fb8a/ERC-7.png", "imageLocal": "img/loadout/ERC-7.png"}], "iconLocal": "img/operators/vigil_icon.png", "imageLocal": "img/operators/vigil_render.png"}, {"slug": "wamai", "name": "Wamai", "realName": "Ngũgĩ Muchoki Furaha", "side": false, "isAttacker": false, "squad": ["nighthaven"], "faction": "NIGHTHAVEN", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["anti-gadget", "trapper"], "ability": {"id": "3QvyMVh7YqGdnP7X73fc62", "ccid-m": "3QvyMVh7YqGdnP7X73fc62", "ccid-l": "1kFAFBuLOOxnqpw86iNE8y", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The Mag-NET System is a thrown, adhesive gadget. It sticks to surfaces and waits. Its function is to attract an opponent’s projectile to its position, and then self-destruct to detonate that projectile.\n\nThis way, not only can Wamai make Attackers’ grenades and projectile gadgets useless, he can also use strategic placement to turn those projectiles against them.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "50d6ae4d-8d1c-4185-a00f-b630cba5900d", "buttonNumber": 1, "id": "4DIWlQCrTS4r117sXQKV5N", "ccid-m": "4DIWlQCrTS4r117sXQKV5N", "ccid-l": "1URJVzwd2ibcbEexhEiyrY", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5kxaSFqkb7CelAi2FARYY5/1bba883ffc4f172458019f87afa32d55/operator-video-ability-wamai.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6izim9nsDTt9T4gQWdAnwi/c8e87851ff8f80119f46aa8adb1069f9/operator-video-ability-wamai.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "June 1st (Age 28)", "placeOfBirth": "Lamu, Kenya", "biography": "### BACKGROUND\n\n*“The closer you are to death, the more vibrant life becomes.”*\n\nBorn to a fishing family on the coast of Kenya, Furaha spent his childhood hunting sharks and collecting lost treasures from the ocean floor of the Lamu Archipelago. It soon became apparent that he was able to stay underwater far longer than his peers, and medical exploration revealed an abnormal physiology that contributed to Furaha’s long-held belief that he was “not from here.” When the opportunity arose to join the Kenyan Navy, and later the Kenya Special Boat Unit, he put his skills to good use. He quickly drew the attention of generals within the navy as well as the worldwide scientific community for his prolific and frequent record-breaking freedives. He later transitioned to NIGHTHAVEN, drawn by the promise of more down-time and a private boat to take him to where his next dive site might be.\n\n### PSYCHOLOGICAL REPORT\n\nTalking to Specialist Ngũgĩ Muchoki “Wamai” Furaha is like talking underwater. Words are exchanged, but it’s not certain that meaning follows. \\[…] Surprisingly, I find myself refreshed by our exchanges. There’s a purity that comes with free association, with being able to jump from one abstract concept to the next. Furaha senses, too, when other people are likely to get lost – at the moments where I find myself most without an anchor, his quick smile and change of topic reassures me that we have not gone beyond all human thought, never to return. \\[…] It makes me question whether I should be more flexible in my thought processes, followed quickly by wondering, if I were, who I would become. \\[…]\n\nThe existential questions raised by someone who spends their free time anoxic are not those we ask ourselves often. And, perhaps deprived of Furaha’s particular sensitivity to these topics, I’m not certain I see value in them. His unaccustomed approach results in strategies that are completely alien. Furaha’s ability to conceptualize 3D space in not just the horizontal but the vertical is something I’ve only seen in the most obsessive of pilots. Yet his internal dimension is surprisingly absent. \\[…]\n\nI once spoke with a renowned monk who had spent his life in pursuit of “complete zero.” In him, I saw the same depth of being I see now in Furaha, but where many people’s spirituality serves to shore up those parts of their personality that they most admire, theirs is the inverse. Furaha’s life is in service to his spirituality. Anoxia is part of his addiction. \\[…]\n\nIn all of my consultations, I strive for neutrality. Furaha is a talented operator, capable, intelligent, and unpredictable. His ability to put a room at ease is invaluable. Yet one never has the sense that they hold the whole picture of him in their mind. Like the nitrogen that must disperse back into the diver’s body before resurfacing, Furaha’s true nature is diffuse. To define him would be to limit him, and I have the distinct sense that there is nothing he would despise more.\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1vQZ4WsAjhc6M7qNOS4ahQ/92fc4d89632fb87aec0f102d7adbfe26/Y4S4_BADGE_Wamai_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6S1qFckDJGp8NyVztOpbCE/86eaaab66472038666289cc2aefe3949/r6-operator-wamai_358316.png", "loadout": [{"name": "AUG A2", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1eO39zRe8XxJXH1KZiIWhM/02049ced0fbfa630833e8b0d3c03de07/AUG_A2.png", "imageLocal": "img/loadout/AUG A2.png"}, {"name": "MP5K", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1pk8nOI7ybQjYOSI4fuzOm/fcd78df0f729be545e75c09aae85c360/MP5K.png", "imageLocal": "img/loadout/MP5K.png"}, {"name": "Super Shorty", "slot": "secondary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7Dq8LDmIxAveRqXM17orUW/8169927dba6976cee92cc53c7b0960aa/r6-operator-weapon-sa-supershorty.png", "imageLocal": "img/loadout/Super Shorty.png"}, {"name": "P12", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2mpM7rah7rwEW0bViIirUC/ed9caa4db58421519fa4db390b1aa164/P12.png", "imageLocal": "img/loadout/P12.png"}, {"name": "Keratos .357", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/15caVAsSCr8Rsb5Hid36uc/59632c4f90727931041ced62a620018b/Keratos_.357.png", "imageLocal": "img/loadout/Keratos .357.png"}, {"name": "PROXIMITY ALARM", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2TsFLmb2O6LRZpbxzkZDck/c9146913388a9567500b704c95600621/Proximity_alarm.png", "imageLocal": "img/loadout/PROXIMITY ALARM.png"}, {"name": "Impact Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7iJK9B1Vr3PDO3rGftU00l/3a02e940b440c30929edf22c49870f65/impact-grenade__1_.png", "imageLocal": "img/loadout/Impact Grenade.png"}, {"name": "Mag-net System", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1IKNZzLv63AJd9vlbXj3Bo/883371432ffb22e5bf35bc82dd706384/Mag-net_System.png", "imageLocal": "img/loadout/Mag-net System.png"}], "iconLocal": "img/operators/wamai_icon.png", "imageLocal": "img/operators/wamai_render.png"}, {"slug": "warden", "name": "Warden", "realName": "Collinn McKinley", "side": false, "isAttacker": false, "squad": ["ghosteyes"], "faction": "SECRET SERVICE", "speed": 1, "armor": 3, "health": 125, "difficulty": 2, "roles": ["anti-gadget", "intel"], "ability": {"id": "2zWpXctyMX4efdcFrb9RsF", "ccid-m": "2zWpXctyMX4efdcFrb9RsF", "ccid-l": "2I6jbt9cAfYk0vb1duFX2Y", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "The Glance serves a function that was almost non-existent on the Defending team. With it active, Warden can see through smoke and turn around what could be a low-intel situation.\nActivating his Smart Glasses can also prevent Warden from being blinded by flash effects, or cleanse an existing flash blindness, salvaging an otherwise dangerous few seconds.\nHowever, the Glance’s thermal vision only works as long as Warden stays immobile; otherwise, he is affected by smoke the same as everyone else.\nThe Glance is a triggered effect, which must be restored through a cooldown after use.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "37fc23dd-b374-49b6-850e-e52b65fdf9fd", "buttonNumber": 1, "id": "2Ywa2E2SjLOkrlr16Njc0y", "ccid-m": "2Ywa2E2SjLOkrlr16Njc0y", "ccid-l": "3YKuD2fBAnrknXypi2vivM", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/11FCnjzLAm4uZ88qWJz3UM/4196c8543b6992181dfc881d4a88526e/operator-video-ability-warden.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4l4VWMVzRV2BNl6RZiw3np/b4dd3baeddef41ef4ba00978cf6c51c2/operator-video-ability-warden.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "March 18th (Age 48)", "placeOfBirth": "Louisville, Kentucky", "biography": "### Biography\n\"I'm never unprepared.\"\n\nCollinn McKinley enrolled in the Marine Corps at 18 and earned several commendations in his service jacket for his aggressive quick-thinking, achieving Master Sergeant despite a few minor infractions on his record. After his third tour, he left the Marines and entered the Secret Service in close-protection detail. McKinley’s agility was instrumental in saving Secretary of State Baldwin’s life when insurgents attacked the U.S. diplomatic junket. Baldwin later went on to win the U.S. Presidential and requested McKinley be assigned to the Presidential Protective Division. McKinley has spent over a decade in Washington, protecting important political figures. He is the foremost expert in close protection detail, and with President Baldwin finishing his second term, McKinley has received high endorsements for his transition into Rainbow.\n\n### Psychological report\nI’ve learned to read between the lines, and when it comes to Specialist Collinn \"Warden\" McKinley, that’s where the real story lies. His role as protector came easily to him between butting heads with his strict, hardworking father and defending his brothers at school, but it became more deeply engrained during his three tours with the Marines.\n\nMcKinley’s service with the Secret Service reads like a Washington gossip column/spy novel. During the attack on then Secretary-of-State Baldwin, the attackers used flashbangs, smoke grenades, and heavy suppressing fire to separate the protection detail. McKinley realized all their evacuation routes had been compromised and evacuated Baldwin alone. The incident clarified the reason behind McKinley’s special glasses, but it’s also become indicative of his modus operandi… his off-the-cuff attitude. He’s never been wrong and I fear he’ll rely on instinct until it finally fails him.\n\nHis access to the inner circle through the Office of the President made him the go-to in handling delicate situations. He’s clever enough to lead people on the right track without implicating himself and I suspect he knows where a few bodies are buried. McKinley has amassed quite the war chest of political favors and a reputation as a lady’s man. President Baldwin once told me that McKinley’s dalliances eclipsed that of some Presidential administrations. The First Lady was displeased with that joke. \n\nHe knows how to manipulate; he deepens his Kentucky drawl when dealing with Republican senators, and plays the Southern gentleman around women. I was amused, watching him try to play to my personality… but I play the game too.\n\nMcKinley adores his teams and he works well with others, but his connection to the Oval Office has instilled him with a sense of invulnerability. McKinley has made many enemies among politicians, businessmen, and Lobbyists; he’s a walking encyclopedia of their sins, and President Baldwin won’t be around to protect him anymore.\n\nHe is the sort of non-traditional approach we need to keep the military and law enforcement more agile and surgical, someone who understands coordination on a large scale. Unfortunately, that means I owe President Baldwin a 25-year old single malt Scotch for recommending McKinley; he’s insufferable when he’s right.\n\n-- Dr. Harishva Pandey", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/hx1Ljf1qIWbjpgCNmfJbu/2217283b569ef316dc12b93e86649f8f/Y4S2_BADGE_Warden_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6IeUn3ejRrjAngxPvqqsZh/234847c2a25cbdd2cf783ef15caf9738/R6-operator-warden.png", "loadout": [{"name": "M590A1", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2zRHmgqENNiZqXQxC9Rsbj/e6542407c642f9b7c5a4546afb6db30a/M590A1.png", "imageLocal": "img/loadout/M590A1.png"}, {"name": "MPX", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5HFewpAJ8npDDCKFnEadhL/d398bb477d6b56fe41bfdb5862ed31c0/MPX.png", "imageLocal": "img/loadout/MPX.png"}, {"name": "P-10C", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2l4qwB50zSFhFZVYRLNwqg/20df8114f69f96f2adc54779ccc5bbaa/P-10C.png", "imageLocal": "img/loadout/P-10C.png"}, {"name": "SMG-12", "slot": "secondary", "subtype": "Machine Pistol", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/EwJgB7KdgOb6dDm7ro33u/b73f0890f992c1a365210f08efcc6db5/SMG-12.png", "imageLocal": "img/loadout/SMG-12.png"}, {"name": "Deployable Shield", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/W0WE0X2VQlxwWIAFCJ6Jm/523650a39de5a23dd9520d7299c9e25a/Deployable_Shield.png", "imageLocal": "img/loadout/Deployable Shield.png"}, {"name": "Nitro Cell", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4pBSTw9U6l9GRnT12G6Xln/e0991bc03b48d217f510af8b611c8828/Nitro_Cell.png", "imageLocal": "img/loadout/Nitro Cell.png"}, {"name": "Observation Blocker", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5toUEasFf4nw1vID6N8fpC/20926248ceedc72dfa2118f68f96c771/observation-blocker.png", "imageLocal": "img/loadout/Observation Blocker.png"}, {"name": "Glance Smart Glasses", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/40RkJUEmmBCf7bmfTL8ao1/1d973adfe4d002c94655d9818776fb41/Glance-Smart-Glasses.png", "imageLocal": "img/loadout/Glance Smart Glasses.png"}], "iconLocal": "img/operators/warden_icon.png", "imageLocal": "img/operators/warden_render.png"}, {"slug": "ying", "name": "Ying", "realName": "Siu Mei Lin", "side": true, "isAttacker": true, "squad": ["wolfguard"], "faction": "S.D.U", "speed": 2, "armor": 2, "health": 110, "difficulty": 2, "roles": ["front-line", "map-control"], "ability": {"id": "W4g1qXsd96wPgESjHxg7R", "ccid-m": "W4g1qXsd96wPgESjHxg7R", "ccid-l": "4te6jurXJDBkNZSvEVpadJ", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Inspired by the new breed of stun grenades showcased by the S.A.S., this mercury and magnesium based explosive creates a multitude of blinding flashes.\nThe Candela device releases a cluster of flash charges that can either be anchored on surfaces or thrown out as a grenade.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "32c9b7f0-82fa-4520-8d14-8ee13217129e", "buttonNumber": 1, "id": "1DqU7G2J79a6HxshjrVpIi", "ccid-m": "1DqU7G2J79a6HxshjrVpIi", "ccid-l": "8wv24QCKl7ittAu3WBTqN", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/12qs6GsjM988o3c7TmNcfa/36a79793938a6568f78562b5e518761d/R6-operators-gadget-ying.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "May 12th (Age 33)", "placeOfBirth": "Central District, Hong Kong, China", "biography": "### Biography\n“Protecting others is a calling. If you don’t feel it, walk away.”\n\nBorn in the affluent Central District of Hong Kong, Siu became a close protection operative immediately after high school. Having developed explosive short-range power and combat skills via private tuition, she joined an elite security service with the aim of becoming an all-purpose operative. She traveled to Tel Aviv, Israel, where she spent two years training and serving with the Caracal Battalion, developing an expertise in firearms and combat driving. She returned to Hong Kong, where she joined the police force and then the elite SDU: Flying Tigers. Joint training with the S.A.S. and her creative use of flashbangs earned her the codename, Ying (Firefly). Frequently called upon due to her experience in close protection detail and high-risk operations, Siu is one of the best specialists for operations involving Hong Kong's dense urban population.\n\n### Psychological report\nCommanders have a tendency to see Specialist Siu “Ying” Mei Lin as conventional. While she can be conservative in her strategic planning, she’s surprisingly quick to change tack. This is perfectly illustrated by the tactical driving maneuvers she’s able to perform, calculating multiple adaptive routes in fractions of a second. It’s genuinely impressive.\n\nThough serious and, I noticed, quite fastidious, I can see why clients and teammates feel secure and comfortable with her around. She has a manner that is tailored for putting people at ease, even as she constantly scans the environment for threats. I wondered about the fastidiousness, whether it comes from the thought processes imposed upon her by her training, or if it’s a trait she’s always had. Her response was, “Column A, Column B.” \\[…\\]\n\nHer childhood was comfortable – but, she points out, “boring.” Her mother is a Hong Kong government worker and she grew up surrounded by serious adults, discussing serious things. From a young age, ten or so, Siu would slip away from these “boring conversations” to wander the city. Her favorite memories are of riding the MTR – the subway – and jumping off at random stops. And she told me that wherever she travels, in her off-time, she still does this. She says the best way to get to know a city is to let it surprise you. \\[…\\]\n\nIt’s a shame that this sense of adventure isn’t reflected in her official file. After our conversation, it’s clear that Siu has a limitless sense of adventure and fearless enthusiasm for new experiences. She unabashedly gets excited at the idea of joint operations and is often one of the first to volunteer.\n\nInvested in her career and role in law enforcement, she never wavers in her dedication… Which often forces her superiors to order to take time off. So, her seriousness can be misconstrued. I think she’s someone who is always calculating risks. She understands how to wreak havoc on the opposition and unsettle them. The team considers her valuable but she expects clear strategic leadership, and I would caution commanders not to underestimate her.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6ZVB1OJxNgs0pR0Fd7Kzt0/74721fe9fd743167508f98dc280a17a3/Y2S2_BADGE_Ying_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4Oyf6w5rI0u9j4zMcWBSGz/ef22bcaca06cba29fdfa41e5ec921f7d/R6-operator-ying.png", "loadout": [{"name": "T-95 LSW", "slot": "primary", "subtype": "Light Machine Gun", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/23HCxaNTRUHBlFAvCTMZQm/fe319cc164fac034a29e9b114ae7d5cb/T-95_LSW.png", "imageLocal": "img/loadout/T-95 LSW.png"}, {"name": "SIX12", "slot": "primary", "subtype": "SHOTGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2v6MwsHwjOZ5Muid53lyfN/e5f1c4997db93abfe3ac356fce23376c/SIX12.png", "imageLocal": "img/loadout/SIX12.png"}, {"name": "Q-929", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2fRVszR5yGDHbV0AL8muso/0838dac90b66aa810daa49d36382fb64/Q-929.png", "imageLocal": "img/loadout/Q-929.png"}, {"name": "Reaper MK2", "slot": "secondary", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5RC060K72yG2OXMq43lgrv/83df616f6d4a2dde6293cc97449159eb/reaper-mk2.png", "imageLocal": "img/loadout/Reaper MK2.png"}, {"name": "HARD BREACH CHARGE", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3OvnVPWY1UyrDE913kU0a1/eae4b2a1584234ea2ff4ad6481239f3b/SecondaryBreacher.png", "imageLocal": "img/loadout/HARD BREACH CHARGE.png"}, {"name": "Smoke Grenade", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3LaxoSLC49T5vgKnUAlTLT/c47c4636845a04478432c48be8c29aee/Smoke_Grenade.png", "imageLocal": "img/loadout/Smoke Grenade.png"}, {"name": "Candela", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4vpN9vu5wD9dyb2knMosTy/430796de3c0c2a5c2eb2ac6f4217eba0/Candela.png", "imageLocal": "img/loadout/Candela.png"}], "iconLocal": "img/operators/ying_icon.png", "imageLocal": "img/operators/ying_render.png"}, {"slug": "zero", "name": "Zero", "realName": "Samuel Leo Fisher", "side": true, "isAttacker": true, "squad": ["ghosteyes"], "faction": "ROS", "speed": 3, "armor": 1, "health": 100, "difficulty": 1, "roles": ["anti-gadget", "intel"], "ability": {"id": "PFxsrhMeCYtQhOSG3M6vR", "ccid-m": "PFxsrhMeCYtQhOSG3M6vR", "ccid-l": "7mLi0qsJaMShk4LzPGlXdl", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "Intel is crucial to a good attack strategy, and Zero is well aware of that. His Argus Launcher is equipped with very special cameras that can lodge themselves into breakable and reinforced surface to surveil either side. \n\nYes, these cameras can cover two angles and effectively allow you to spy on the opposing team. Argus Cameras do have one more quirk though: a single laser shot, perfect for destroying key elements in the Defenders’ setup or drawing attention away from choke points.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "9802b1ba-14cf-42b7-8aa2-617aeab5e38c", "buttonNumber": 1, "id": "tpuMGufgihcPIx4zKoGcG", "ccid-m": "tpuMGufgihcPIx4zKoGcG", "ccid-l": "2b2mjCLJm8bjsIqRlBYsh6", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1NrWh5QdVZ4ApXwFpqS2Qu/9a8d66b51d62640af705534e08450405/r6s-operators-ability-zero.jpg", "description": null}, "buttonType": "mp4-modal", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "zero: unique abilities", "modal": {"media": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2iRHKIAC76x299OxwRGklm/dc7decd84f5ae80e454acb1792253518/r6s-operators-ability-zero.mp4", "description": null, "videoControls": true}}, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "August 8th (Age 63)", "placeOfBirth": "Baltimore, Maryland", "biography": "### Biography\n\n*“Prepare, execute, vanish.”*\n\nThough the CIA and Third Echelon have classified the majority of Fisher’s childhood it is known he was born in the Baltimore suburb of Towson, Maryland, where he was raised by his paternal grandmother, Sarah. He was enrolled in a Military Boarding School where he learned to focus his energy, hone his skills, and to either follow orders or be sure to hide the evidence. \n\nFrom school Fisher enrolled directly in the United States Naval Academy where he majored in Political Science and later went on to pursue SEALs Training. While serving in the Persian Gulf, Bolivia, Colombia, Senegal, and Kosovo, Fisher became known for his ability to complete the mission, regardless of personal cost. After being awarded a Defense Distinguished Service Medal, Fisher spent time as an instructor at Little Creek Naval Base, Virginia.  \n\nHe was recruited to the CIA, where he \\[REDACTED].\n\n### Psychological report\n\nAlthough these are my first interactions and observations of Specialist Samuel Leo “Zero” Fisher, I feel that I’m finally getting a glimpse of the man behind the legend. He doesn’t brag about what he’s done or what he can do, but you can see his training in the way he moves and the critical assessment with which he evaluates his surroundings. If he were to read my evaluation, I’m sure he’d agree. \\[…]  \n\nIt’s hard to pry details from the former Echelon agent. He is focused , to the point, and makes it clear when he’s done with a subject. His mandate was never to seek out conflict, but to perform damage control before there was any evidence of a disaster. Fisher’s skills and temperament ensure  that he keeps a clear head under pressure and is always prepared, regardless of circumstance. I’m interested to see if he has a leveling influence on some of our more hotheaded specialists such as Evans and Brunsmeier. \n\nThough his sarcasm can seem abrasive to those who aren’t familiar with him – and maybe even to those who are – it hides a deep thoughtfulness and attention to detail. He can see right into the heart of an issue, or person – I look forward to his assessment and his suggestions for the improvements we can make to our training program. \\[…]\n\nHe doesn’t want to talk about his daughter, but I feel that’s more of a warning than an indication of any residual conflict between them. \\[REDACTED]\n\n(Comment_S. Fisher: Great observation, also correct.)\n\nFisher is very much a solo operator, though he possesses a sense of duty to his colleagues and teammates and shows his affection through action. I’m hoping to draw him out of his shell and show him the benefits of working with the R6 Program. Based on his background as an instructor I feel he’ll appreciate more than the resources we can offer him, but also gain some satisfaction in the influence he’ll have on the R6 Program, and his teammates. \n\n(Comment_S. Fisher: Is one of the benefits coffee, because I’m running low.)\n\n-- Dr. Harishva \"Harry\" Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4ZbzOZt1Sur77RZTFwYVJ4/30037e84b2948449652547f06df146e0/Y5S3_BADGE_Zero_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7lou5sF83pEwxoQaRr7qgP/3bc2e32393f5e98389c1b5e98d005894/r6s-operator-zero.png", "loadout": [{"name": "MP7", "slot": "primary", "subtype": "SUBMACHINE GUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3a4dgTWGdiJqALhtRp4pKy/f2568d3de3cfe7e4b53179e8653cd2a2/MP7.png", "imageLocal": "img/loadout/MP7.png"}, {"name": "SC3000K", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7x7eDTm2NNpfGiFMrfQqEX/9898e74c780537be3ca6d88db32ea21e/F2000.png", "imageLocal": "img/loadout/SC3000K.png"}, {"name": "5.7 USG", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/tkYcSAJSe5yGkeUhzZqBO/e81feb86df4a7eb6951052bec26b6ed7/5.7_USG.png", "imageLocal": "img/loadout/5.7 USG.png"}, {"name": "Gonne-6", "slot": "secondary", "subtype": "Hand Cannon", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/23AlSVw8MwI1y3ZakEfqgW/c4561ae6e8da8db2627a146b8b55ee6c/GONNE-6_HUD_Icon__1_.png", "imageLocal": "img/loadout/Gonne-6.png"}, {"name": "HARD BREACH CHARGE", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3OvnVPWY1UyrDE913kU0a1/eae4b2a1584234ea2ff4ad6481239f3b/SecondaryBreacher.png", "imageLocal": "img/loadout/HARD BREACH CHARGE.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "ARGUS LAUNCHER", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6h4hyVSzG8IwAmEl1Objrd/6e51e64eeffcc68746b8ff59445fb103/r6s-operator-ability-zero.png", "imageLocal": "img/loadout/ARGUS LAUNCHER.png"}], "iconLocal": "img/operators/zero_icon.png", "imageLocal": "img/operators/zero_render.png"}, {"slug": "zofia", "name": "Zofia", "realName": "Zofia Bosak", "side": true, "isAttacker": true, "squad": ["ghosteyes"], "faction": "G.R.O.M", "speed": 1, "armor": 3, "health": 125, "difficulty": 1, "roles": ["breach", "anti-gadget"], "ability": {"id": "76VmnGrFVueP3cNZST48x4", "ccid-m": "76VmnGrFVueP3cNZST48x4", "ccid-l": "3vIbEOOy2nJXOycAjunIJo", "title": "UNIQUE ABILITIES AND PLAYSTYLE", "content": "KS79 LIFELINE makes use of electronically triggered projectile technology that can fire both concussion and impact ammunition.\nThe concussion ammunition delivers a 170-decibel shockwave that impairs hearing and causes a dizzying effect.", "image": {"url": null, "description": null}, "mobileImage": {"url": null, "description": null}, "backgroundImage": null, "mobileBackgroundImage": null, "videoImage": null, "backgroundVideo": null, "mobileVideoFile": null, "fallbackVideoImage": {"description": null}, "videoUrlIdAgegate": false, "videoControls": false, "buttons": [{"uid": "70c46c9b-0630-4c4b-b4b2-ec189eba4ad0", "buttonNumber": 1, "id": "6mgeypg0tUzrnnWb6uEQ14", "ccid-m": "6mgeypg0tUzrnnWb6uEQ14", "ccid-l": "5mvGd4I9erWxxeBesKSA7y", "buttonImage": {"url": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4bxrtfSxoZ6WE7VU5AvcVj/264e725c7f5c9b3908daa503c45bcc2d/R6-operators-gadget-zofia.png", "description": null}, "buttonType": "no-action", "downloadableAsset": {"url": null}, "externalDownload": null, "brandedInstaller": null, "trackingCategoryValue": "video", "trackingLocation": "promotion", "trackingLocationDetail": "promotion", "trackingValue": "unique abilites", "modal": null, "event": null, "video": null}], "refIds": []}, "dateOfBirth": "January 28th (Age 36)", "placeOfBirth": "Wrocław, Poland", "biography": "### Biography\n“It isn’t about where you end up, it’s about how you make it home.”\n\nZofia Bosak is the eldest daughter of Jan Bosak, respected former commander of the Polish Special Operation Forces unit, GROM. She excelled in the grueling extracurricular training given by her father, learning diverse techniques including some considered questionable. Zofia’s exceptional attitude saw her pass the GROM selection tests with the highest possible scores. She developed extensive skills beyond hand-to-hand combat and marksmanship, specifically survival, sabotage, target extraction, and field medicine. Driven to be the highest performing soldier in any given unit, Zofia is of singular focus in all of her operations. This focus enabled her to single-handedly evacuate hundreds of civilians, including children, during a rescue mission in Guatemala. She has since earned a number of awards and gained the respect of her commanding officers and peers. Zofia stands out as a lateral thinker with decisive, aggressive operational experience and an impeccable track record both on and off the field.\n\n### Psychological report\nThere are layers to Specialist Zofia “Zofia” Bosak and I’ve barely scratched the surface after a handful of meetings. So we’ll take it slow. I’ve read her jacket – since her father was a public and powerful figure, it means that there are redactions even in her personal file. \\[…\\] She wasn’t defensive in our meeting, but she was… distracted by my role. She didn’t want to be “analyzed,” which is exactly the response I received from her sister, Specialist Elżbieta “Ela” Bosak. \\[…\\]\n\nZofia neither likes discussing herself nor having anyone else discuss her life, especially her military husband and their daughter. She doesn’t “do” small talk. This made the first twenty minutes of our meeting rather quiet. After offering some family details of my own, she did share a funny incident with her daughter’s morning routine. Knowing how private she is, I want to honor her trust and not mention it here. \\[…\\]\n\nShe is conflicted between pride in her accomplishments and the sense that she was deprived of meaningful choices. When I said that the reports reflect someone exceptional, she laughed. She told me she often feels robotic, as if someone had programmed her and she’s on autopilot. It will be vital to disrupt that sense of powerlessness. \\[…\\]\n\nZofia struggles with her father’s death. She doesn’t believe it was suicide and asked if I can recover his autopsy report. I’m not sure I have those kinds of connections, nor do I think it’s necessarily a good idea. His absence already pervades her every thought and I’m not convinced that having an answer would bring her the closure she needs. I’ve encouraged her ongoing efforts to rebuild the relationship with her sister instead, and to cherish the close bonds she has with her teammates and her family. \\[…\\]\n\nWhat strikes me most is that Zofia faces the unknown with complete equanimity. Whether it’s due to her training or her upbringing I can’t say. Undoubtedly, it’s a valuable skill. Yet where there is ambivalence there can be no joy, and I find I wish more for her than that.\n\n-- Dr. Harishva “Harry” Pandey, Director of Rainbow", "operatorIcon": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1k09nbCCu2avlIWpK3cJz9/35d60746d67750230f2a020a7be78795/Y2S3_BADGE_Zofia_L.png", "operatorImage": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5KUunQgJWx9sVC0hFhHVAt/8fdff15ca50227328fb0589ecd8ccda0/R6-operator-zofia.png", "loadout": [{"name": "LMG-E", "slot": "primary", "subtype": "Light Machine Gun", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7JVJIew6t3iKwgByvrFXyi/7ba44dfda28b525506633e453104a604/LMG-E.png", "imageLocal": "img/loadout/LMG-E.png"}, {"name": "M762", "slot": "primary", "subtype": "ASSAULT RIFLE", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4oWAgi7tgQP1Tq0HooRtye/9109a74921ee17610d4bd85a61582823/M762.png", "imageLocal": "img/loadout/M762.png"}, {"name": "RG15", "slot": "secondary", "subtype": "HANDGUN", "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2LNSsp7B7wUnnPUweir7Jm/9f66d53be7a63a17a55253a0bea6eec1/RG15.png", "imageLocal": "img/loadout/RG15.png"}, {"name": "Claymore", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4T4H5EJgUxorucGVtU2pkm/74fef324b89c220ce6426e8097f915b9/Claymore.png", "imageLocal": "img/loadout/Claymore.png"}, {"name": "HARD BREACH CHARGE", "slot": "gadget", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3OvnVPWY1UyrDE913kU0a1/eae4b2a1584234ea2ff4ad6481239f3b/SecondaryBreacher.png", "imageLocal": "img/loadout/HARD BREACH CHARGE.png"}, {"name": "KS79 Lifeline", "slot": "unique-ability", "subtype": null, "image": "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1elqIEWJ6XsXKAbMNd0Cai/0b4c0591bad284d957e652cdae0b706b/KS79-Lifeline.png", "imageLocal": "img/loadout/KS79 Lifeline.png"}], "iconLocal": "img/operators/zofia_icon.png", "imageLocal": "img/operators/zofia_render.png"}];
let side='',term='';
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function pips(n,cls){let h='<span class=pips>';for(let i=0;i<3;i++)h+='<span class="pip '+cls+' '+(i<n?'on':'')+'"></span>';return h+'</span>';}
function mdToHtml(md){if(!md)return '';let h=esc(md);
 h=h.replace(/\\\[.*?\\\]/g,'[...]');
 h=h.replace(/^###\s*(.+)$/gm,'<h4>$1</h4>');
 h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
 h=h.split(/\n\n+/).map(p=>p.match(/^<h4>/)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
 return h;}
function render(){
 const g=document.getElementById('grid');g.innerHTML='';
 const list=OPS.filter(o=>(!side||(side=='att'?o.isAttacker:!o.isAttacker))&&o.name.toLowerCase().includes(term));
 document.getElementById('count').textContent=list.length+' Operatoren';
 list.forEach(o=>{
  const c=document.createElement('div');c.className='card';
  const bc=o.isAttacker?'att-b':'def-b';const bl=o.isAttacker?'ATK':'DEF';
  c.innerHTML='<div class=imgwrap><img loading=lazy src="'+(o.imageLocal||'')+'"></div>'+
   '<div class=meta><div class=nm>'+esc(o.name)+'</div>'+
   '<div class=sb><span class="badge '+bc+'">'+bl+'</span> <span class=hp>'+o.health+' HP</span></div>'+
   '<div class=sb>Speed '+pips(o.speed,'')+' &nbsp; Armor '+pips(o.armor,'arm')+'</div></div>';
  c.onclick=()=>detail(o);g.appendChild(c);
 });
}
function group(o,slot){return o.loadout.filter(w=>w.slot==slot);}
function wcard(w){return '<div class=w><img src="'+(w.imageLocal||'')+'"><div class=wn>'+esc(w.name)+'</div>'+(w.subtype?'<div class=wt>'+esc(w.subtype)+'</div>':'')+'</div>';}
function detail(o){
 const m=document.getElementById('modal');
 const prim=group(o,'primary'),sec=group(o,'secondary'),gad=group(o,'gadget'),abi=group(o,'unique-ability');
 let load='<div class=load>';
 if(prim.length){load+='<div class=slotlabel>Primärwaffen</div>'+prim.map(wcard).join('');}
 if(sec.length){load+='<div class=slotlabel>Sekundärwaffen</div>'+sec.map(wcard).join('');}
 if(gad.length){load+='<div class=slotlabel>Gadgets</div>'+gad.map(wcard).join('');}
 if(abi.length){load+='<div class=slotlabel>Spezialfähigkeit</div>'+abi.map(wcard).join('');}
 load+='</div>';
 const ab=o.ability||{};
 m.innerHTML='<button class=close onclick="cl()">&times;</button>'+
  '<div class=mtop><img class=render src="'+(o.imageLocal||'')+'">'+
  '<div style="flex:1;min-width:240px"><h2>'+esc(o.name)+'</h2><div class=real>'+esc(o.realName||'')+'</div>'+
  '<div class=statbox>'+
   '<div class=s><div class=lab>Health</div><div class="val hp">'+o.health+'</div></div>'+
   '<div class=s><div class=lab>Speed</div><div class=val>'+pips(o.speed,'')+'</div></div>'+
   '<div class=s><div class=lab>Armor</div><div class=val>'+pips(o.armor,'arm')+'</div></div>'+
   '<div class=s><div class=lab>Schwierigkeit</div><div class=val>'+pips(o.difficulty,'dif')+'</div></div>'+
  '</div>'+
  '<div class=kv><div><b>Seite</b>'+(o.isAttacker?'Angreifer':'Verteidiger')+'</div>'+
   (o.faction?'<div><b>Einheit</b>'+esc(o.faction)+'</div>':'')+
   (o.squad&&o.squad.length?'<div><b>Squad</b>'+esc([].concat(o.squad).join(', '))+'</div>':'')+
   (o.dateOfBirth?'<div><b>Geburtstag</b>'+esc(o.dateOfBirth)+'</div>':'')+
   (o.placeOfBirth?'<div><b>Herkunft</b>'+esc(o.placeOfBirth)+'</div>':'')+'</div>'+
   (o.roles&&o.roles.length?'<div class=roles style="margin-top:8px">'+o.roles.map(r=>'<span>'+esc(r)+'</span>').join('')+'</div>':'')+
  '</div></div>'+
  (ab.content?'<div class=section><h3>'+esc(ab.title||'Spezialfähigkeit')+'</h3><div class=ability>'+mdToHtml(ab.content)+'</div></div>':'')+
  '<div class=section><h3>Loadout</h3>'+load+'</div>'+
  (o.biography?'<div class=section><h3>Biografie &amp; Bericht</h3><div class=bio>'+mdToHtml(o.biography)+'</div></div>':'');
 document.getElementById('ov').classList.add('show');
 document.getElementById('ov').scrollTop=0;
}
function cl(){document.getElementById('ov').classList.remove('show');}
function setSide(s,el){side=s;document.querySelectorAll('header .chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render();}
document.getElementById('q').addEventListener('input',e=>{term=e.target.value.toLowerCase();render();});
document.addEventListener('keydown',e=>{if(e.key=='Escape')cl();});
render();
</script></body></html>
